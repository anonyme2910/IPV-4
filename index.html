e: .85rem;\n  font-weight: 700;\n  letter-spacing: .15em;\n  padding: .6rem 1.4rem;\n  border-radius: 20px;\n  cursor: pointer;\n  transition: all .2s;\n  text-shadow: 0 0 10px rgba(255,232,31,.5);\n}\n.sw-close:hover {\n  background: rgba(255,232,31,0.3);\n  box-shadow: 0 0 20px rgba(255,232,31,0.5);\n}\n\n/* ══════════ STARS ══════════ */\n.sw-stars {\n  position: absolute;\n  inset: 0;\n  pointer-events: none;\n}\n\n/* ══════════ SCENE STRUCTURE ══════════ */\n.sw-scene {\n  position: absolute;\n  inset: 0;\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  justify-content: center;\n}\n\n/* ══════════ INTRO TEXT ══════════ */\n.sw-intro-text {\n  position: absolute;\n  inset: 0;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  z-index: 5;\n  animation: swIntroFade 5s ease forwards;\n}\n.sw-intro-text p {\n  color: #4fc3f7;\n  font-size: clamp(1.3rem, 3.5vw, 2.2rem);\n  letter-spacing: .08em;\n  text-align: center;\n  font-style: italic;\n  opacity: 0;\n  animation: swIntroText 5s ease forwards;\n  text-shadow:\n    0 0 20px rgba(79,195,247,.7),\n    2px 2px 0 #000,\n    3px 3px 0 #001a2e;\n}\n@keyframes swIntroText {\n  0%   { opacity: 0; }\n  20%  { opacity: 1; }\n  70%  { opacity: 1; }\n  100% { opacity: 0; }\n}\n@keyframes swIntroFade {\n  0%,80% { pointer-events: auto; }\n  100%   { pointer-events: none; opacity: 0; }\n}\n\n/* ══════════ LOGO FLASH ══════════ */\n.sw-logo-wrap {\n  position: absolute;\n  inset: 0;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  z-index: 4;\n  pointer-events: none;\n  animation: swLogoAnim 3s 4.5s ease forwards;\n  opacity: 0;\n}\n.sw-logo {\n  font-family: sans-serif;\n  font-size: clamp(5rem, 18vw, 13rem);\n  font-weight: 900;\n  color: #ffe81f;\n  letter-spacing: -.02em;\n  text-shadow:\n    /* Contour noir épais 3D */\n    -4px -4px 0 #000,\n     4px -4px 0 #000,\n    -4px  4px 0 #000,\n     4px  4px 0 #000,\n    -6px -6px 0 #111,\n     6px -6px 0 #111,\n    -6px  6px 0 #111,\n     6px  6px 0 #111,\n    /* Profondeur 3D */\n    8px 8px 0 #332200,\n    10px 10px 0 #221800,\n    /* Glow */\n    0 0 50px rgba(255,232,31,.9),\n    0 0 100px rgba(255,232,31,.6),\n    0 0 200px rgba(255,232,31,.3);\n}\n.sw-logo span {\n  color: #fff;\n  text-shadow:\n    -4px -4px 0 #000,\n     4px -4px 0 #000,\n    -4px  4px 0 #000,\n     4px  4px 0 #000,\n    -6px -6px 0 #111,\n     6px -6px 0 #111,\n    -6px  6px 0 #111,\n     6px  6px 0 #111,\n    8px 8px 0 #222,\n    10px 10px 0 #111,\n    0 0 50px rgba(255,255,255,.7),\n    0 0 100px rgba(79,195,247,.4);\n}\n\n@keyframes swLogoAnim {\n  0%   { opacity: 0; transform: scale(1.8); }\n  25%  { opacity: 1; transform: scale(1); }\n  65%  { opacity: 1; transform: scale(.55); }\n  100% { opacity: 0; transform: scale(.1); }\n}\n\n/* ══════════ PERSPECTIVE CRAWL ══════════ */\n.sw-perspective {\n  position: absolute;\n  inset: 0;\n  perspective: 500px;\n  perspective-origin: 50% 88%;\n  overflow: hidden;\n}\n\n.sw-crawl {\n  position: absolute;\n  top: 100%;\n  left: 50%;\n  width: clamp(320px, 72vw, 900px);\n  color: #ffe81f;\n  text-align: center;\n  line-height: 2;\n  padding: 0 2rem 80vh;\n  transform: translateX(-50%) rotateX(25deg);\n  transform-origin: 50% 100%;\n  animation: swCrawl 65s 8.5s linear forwards;\n  opacity: 0;\n}\n\n@keyframes swCrawl {\n  0%   { opacity: 1; top: 100%; }\n  100% { opacity: 1; top: -420%; }\n}\n\n/* ══════════ TEXTE 3D AVEC CONTOUR ══════════ */\n.sw-crawl p {\n  font-size: clamp(1.4rem, 2.8vw, 2rem);\n  margin-bottom: 1.8em;\n  letter-spacing: .05em;\n  text-shadow:\n    /* Contour noir net */\n    -2px -2px 0 #000,\n     2px -2px 0 #000,\n    -2px  2px 0 #000,\n     2px  2px 0 #000,\n    /* Profondeur 3D */\n    4px  4px 0 #332200,\n    6px  6px 2px rgba(0,0,0,.8),\n    /* Glow subtil */\n    0 0 20px rgba(255,232,31,.25);\n}\n\n.sw-title-block {\n  margin: 0 auto 3rem;\n}\n\n.sw-episode {\n  font-size: clamp(1.4rem, 3vw, 2.2rem);\n  letter-spacing: .4em;\n  text-transform: uppercase;\n  margin-bottom: .6rem;\n  opacity: .9;\n  text-shadow:\n    -2px -2px 0 #000,  2px -2px 0 #000,\n    -2px  2px 0 #000,   2px  2px 0 #000,\n    4px 4px 0 #332200;\n}\n\n.sw-ep-title {\n  font-family: sans-serif;\n  font-size: clamp(3rem, 6vw, 5rem);\n  font-weight: 900;\n  letter-spacing: .1em;\n  line-height: 1.15;\n  margin-bottom: 2.5rem;\n  color: #ffe81f;\n  text-shadow:\n    /* Contour noir épais */\n    -3px -3px 0 #000,  3px -3px 0 #000,\n    -3px  3px 0 #000,   3px  3px 0 #000,\n    -5px -5px 0 #111,  5px -5px 0 #111,\n    -5px  5px 0 #111,   5px  5px 0 #111,\n    /* Relief 3D */\n    6px  6px 0 #332200,\n    8px  8px 0 #221800,\n    10px 10px 4px rgba(0,0,0,.9),\n    /* Glow */\n    0 0 30px rgba(255,232,31,.4);\n}\n\n.sw-section-title {\n  font-family: sans-serif;\n  font-size: clamp(1.4rem, 3vw, 2.2rem);\n  font-weight: 800;\n  letter-spacing: .25em;\n  color: #fff;\n  margin: 3rem 0 2rem;\n  text-transform: uppercase;\n  text-shadow:\n    -2px -2px 0 #000,  2px -2px 0 #000,\n    -2px  2px 0 #000,   2px  2px 0 #000,\n    4px 4px 0 #222,\n    6px 6px 2px rgba(0,0,0,.8),\n    0 0 25px rgba(255,255,255,.3);\n}\n\n.sw-highlight {\n  color: #fff;\n  font-weight: 800;\n  text-shadow:\n    -2px -2px 0 #000,  2px -2px 0 #000,\n    -2px  2px 0 #000,   2px  2px 0 #000,\n    3px 3px 0 #222,\n    0 0 15px rgba(255,255,255,.6);\n}\n\n.sw-creator {\n  font-family: sans-serif;\n  font-size: clamp(3rem, 8vw, 7rem);\n  font-weight: 900;\n  letter-spacing: .12em;\n  color: #fff;\n  text-shadow:\n    /* Contour noir épais */\n    -4px -4px 0 #000,  4px -4px 0 #000,\n    -4px  4px 0 #000,   4px  4px 0 #000,\n    -6px -6px 0 #111,  6px -6px 0 #111,\n    -6px  6px 0 #111,   6px  6px 0 #111,\n    /* Relief 3D profond */\n    7px  7px 0 #1a1a1a,\n    9px  9px 0 #111,\n    11px 11px 4px rgba(0,0,0,.9),\n    /* Glow */\n    0 0 40px rgba(255,255,255,.8),\n    0 0 80px rgba(79,195,247,.5);\n  margin: 1.5rem 0 .75rem;\n}\n\n.sw-creator-title {\n  font-size: clamp(1.3rem, 2.8vw, 2rem);\n  letter-spacing: .22em;\n  color: #4fc3f7;\n  margin-bottom: 2.5rem !important;\n  text-shadow:\n    -2px -2px 0 #000,  2px -2px 0 #000,\n    -2px  2px 0 #000,   2px  2px 0 #000,\n    3px 3px 0 #001a2e,\n    0 0 20px rgba(79,195,247,.5);\n}\n\n.sw-final {\n  font-size: clamp(1.4rem, 3vw, 2.2rem);\n  font-style: italic;\n  color: #fff;\n  opacity: .9;\n  line-height: 2.2 !important;\n  text-shadow:\n    -2px -2px 0 #000,  2px -2px 0 #000,\n    -2px  2px 0 #000,   2px  2px 0 #000,\n    4px 4px 0 #222,\n    0 0 20px rgba(255,255,255,.2);\n}\n\n.sw-end-logo {\n  font-family: sans-serif;\n  font-size: clamp(2.5rem, 6vw, 4.5rem);\n  font-weight: 900;\n  letter-spacing: .45em;\n  color: #ffe81f;\n  text-shadow:\n    -3px -3px 0 #000,  3px -3px 0 #000,\n    -3px  3px 0 #000,   3px  3px 0 #000,\n    5px 5px 0 #332200,\n    7px 7px 3px rgba(0,0,0,.8),\n    0 0 40px rgba(255,232,31,.6);\n  margin-top: 4rem;\n}\n\n/* ══════════ AUDIO CONTROLS ══════════ */\n.sw-audio-btn {\n  position: absolute;\n  top: 1.2rem; left: 1.5rem;\n  z-index: 10000;\n  background: rgba(255,232,31,0.15);\n  border: 2px solid rgba(255,232,31,0.6);\n  color: #ffe81f;\n  font-family: 'JetBrains Mono', monospace;\n  font-size: .85rem;\n  font-weight: 700;\n  letter-spacing: .1em;\n  padding: .6rem 1.2rem;\n  border-radius: 20px;\n  cursor: pointer;\n  transition: all .2s;\n  text-shadow: 0 0 10px rgba(255,232,31,.5);\n}\n.sw-audio-btn:hover {\n  background: rgba(255,232,31,0.3);\n  box-shadow: 0 0 20px rgba(255,232,31,0.5);\n}\n\n/* ═══════════════════════════════════════════════════════════════\n   REFONTE DU PARCOURS A / B / C — couleurs et logique conservées\n   ═══════════════════════════════════════════════════════════════ */\n#app { max-width:1160px; margin:0 auto; padding:0 0 3.5rem; }\n#app .k-hero {\n  display:grid; grid-template-columns:auto minmax(0,1fr); align-items:center;\n  gap:1.4rem; padding:1.55rem 1.7rem; margin:0 0 1.15rem;\n  border-radius:22px; border:1px solid var(--k-border);\n  background:linear-gradient(120deg,var(--k-bg2),var(--bg3, var(--k-bg2)));\n  box-shadow:0 18px 45px rgba(0,0,0,.18);\n}\n#app .k-letter {\n  width:86px; height:86px; display:grid; place-items:center;\n  border-radius:22px; font-size:3.8rem; font-weight:900;\n  background:color-mix(in srgb,var(--k) 13%,transparent);\n  border:1px solid color-mix(in srgb,var(--k) 45%,transparent);\n}\n#app .k-hero-info { gap:.4rem; }\n#app .k-title { font-size:clamp(1.45rem,3vw,2.1rem); letter-spacing:-.04em; line-height:1.1; }\n#app .k-rule { font-size:.78rem; line-height:1.65; }\n#app .learn-start {\n  display:grid; grid-template-columns:minmax(0,1fr) minmax(280px,.9fr);\n  gap:1.4rem; align-items:stretch; margin:0 0 1.35rem;\n  padding:1.45rem; border:1px solid var(--k-border); border-radius:22px;\n  background:linear-gradient(135deg,var(--bg2),var(--bg3));\n  position:relative; overflow:hidden;\n}\n#app .learn-start::after {\n  content:\"\"; position:absolute; width:220px; height:220px; right:-95px; top:-120px;\n  border-radius:50%; border:1px solid color-mix(in srgb,var(--k) 25%,transparent);\n  box-shadow:0 0 0 24px color-mix(in srgb,var(--k) 4%,transparent),0 0 0 48px color-mix(in srgb,var(--k) 3%,transparent);\n  pointer-events:none;\n}\n#app .learn-start-copy { align-self:center; position:relative; z-index:1; }\n#app .learn-eyebrow,.section-kicker {\n  font-size:.62rem; font-weight:800; letter-spacing:.16em; color:var(--k);\n  text-transform:uppercase; display:flex; align-items:center; gap:.5rem;\n}\n#app .learn-pulse { width:7px; height:7px; border-radius:50%; background:var(--k); box-shadow:0 0 12px var(--k); }\n#app .learn-start h2 { margin:.8rem 0 .55rem; font:800 clamp(1.35rem,2.5vw,2rem)/1.12 sans-serif; letter-spacing:-.035em; }\n#app .learn-start h2 span { color:var(--k); }\n#app .learn-start-copy p { color:var(--text-dim); font-size:.76rem; line-height:1.8; max-width:54ch; }\n#app .learn-steps { display:grid; gap:.55rem; position:relative; z-index:1; }\n#app .learn-step {\n  display:grid; grid-template-columns:34px minmax(0,1fr) auto; align-items:center; gap:.75rem;\n  text-decoration:none; color:var(--text); padding:.72rem .8rem;\n  background:color-mix(in srgb,var(--bg) 48%,transparent);\n  border:1px solid var(--border2); border-radius:13px; transition:transform .18s,border-color .18s,background .18s;\n}\n#app .learn-step:hover { transform:translateX(3px); border-color:var(--k); background:color-mix(in srgb,var(--k) 8%,var(--bg2)); }\n#app .learn-step-num { display:grid; place-items:center; width:32px; height:32px; border-radius:10px; background:color-mix(in srgb,var(--k) 14%,transparent); color:var(--k); font-size:.72rem; font-weight:900; }\n#app .learn-step b { display:block; font:750 .78rem sans-serif; }\n#app .learn-step small { display:block; color:var(--text-dim); font-size:.62rem; margin-top:.2rem; }\n#app .learn-step-arrow { font-size:1rem; color:var(--k); }\n#app .k-top { display:grid; grid-template-columns:minmax(0,1.2fr) minmax(280px,.8fr); gap:1rem; align-items:stretch; }\n#app .panel,#app .binary-panel,#app .private-panel {\n  border:1px solid var(--border2); border-radius:20px;\n  background:linear-gradient(145deg,var(--bg2),var(--bg3));\n  box-shadow:0 12px 30px rgba(0,0,0,.12); padding:1.35rem;\n}\n#app .panel-heading-row,.section-heading { display:flex; justify-content:space-between; align-items:flex-start; gap:1rem; margin-bottom:1.1rem; }\n#app .panel-title { font-size:.9rem; letter-spacing:-.015em; font-weight:850; margin:0; text-transform:none; }\n#app .heading-chip { flex-shrink:0; font-size:.55rem; font-weight:800; letter-spacing:.12em; border:1px solid var(--k-border); color:var(--k); border-radius:999px; padding:.38rem .6rem; }\n#app .k-iprow { border:1px solid var(--k-border); border-radius:15px; padding:.8rem; background:color-mix(in srgb,var(--k) 5%,var(--bg)); gap:.75rem; }\n#app .ip-field { font-size:1rem; min-height:42px; }\n#app .ip-display-big { font-size:clamp(1.8rem,4vw,2.7rem); letter-spacing:-.04em; padding:.7rem 0 .35rem; }\n#app .slider-wrap { margin-top:.7rem; padding:1rem; border-radius:14px; background:color-mix(in srgb,var(--k) 5%,var(--bg)); border:1px solid var(--k-border); }\n#app .slider-header { gap:.75rem; }\n#app .slider-label { font-size:.67rem; font-weight:700; }\n#app .slider-val { font-size:.7rem; }\n#app .range-bar-wrap { margin-top:1rem; padding:.25rem .15rem 0; }\n#app .stats-row.k-stats { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:.8rem; align-content:start; }\n#app .stat-card { min-width:0; padding:1.1rem; border-radius:17px; border:1px solid var(--border2); background:var(--bg2); position:relative; overflow:hidden; }\n#app .stat-card::before { content:\"\"; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--sc-accent,var(--k)); }\n#app .stat-label { font-size:.61rem; letter-spacing:.08em; line-height:1.5; }\n#app .stat-value { font-size:clamp(1.25rem,2.3vw,1.85rem); line-height:1.2; margin:.55rem 0 .35rem; overflow-wrap:anywhere; }\n#app .stat-formula,#app .stat-sub { font-size:.6rem; line-height:1.6; }\n#app .binary-panel,#app .private-panel { margin-top:1rem; }\n#app .section-heading { align-items:center; margin-bottom:1.2rem; }\n#app .section-heading .panel-title { margin-top:.3rem; }\n#app .section-heading p { color:var(--text-dim); font-size:.69rem; line-height:1.7; max-width:42ch; text-align:right; }\n#app .binary-grid { gap:.3rem; }\n#app .bits-legend { display:flex; flex-wrap:wrap; gap:.65rem 1.1rem; margin-top:1.15rem; padding-top:1rem; border-top:1px solid var(--border); }\n#app .bl { font-size:.62rem; }\n#app .private-panel .panel-title { font-size:.95rem; }\n#app #priv-shortcut-btn { border-radius:11px !important; padding:.75rem 1rem !important; font-weight:750 !important; }\n#app #priv-slider-wrap { border-radius:14px !important; padding:1rem !important; }\n#app .priv-zones { display:grid; gap:.65rem; }\n#app .priv-zones > * { border-radius:13px; }\n#app button:not(.class-btn):not(.theme-btn) { border-radius:11px; }\n@media(max-width:820px) {\n  #app .learn-start { grid-template-columns:1fr; }\n  #app .k-top { grid-template-columns:1fr; }\n  #app .stats-row.k-stats { grid-template-columns:repeat(2,minmax(0,1fr)); }\n}\n@media(max-width:540px) {\n  #app .k-hero { grid-template-columns:62px minmax(0,1fr); gap:.85rem; padding:1rem; border-radius:17px; }\n  #app .k-letter { width:60px; height:60px; border-radius:15px; font-size:2.8rem; }\n  #app .k-rule { font-size:.68rem; }\n  #app .learn-start { padding:1rem; border-radius:17px; gap:1rem; }\n  #app .learn-start h2 { font-size:1.4rem; }\n  #app .learn-start-copy p { font-size:.7rem; }\n  #app .learn-step { padding:.62rem; }\n  #app .panel,#app .binary-panel,#app .private-panel { padding:1rem; border-radius:16px; }\n  #app .panel-heading-row,.section-heading { gap:.6rem; }\n  #app .section-heading { display:block; }\n  #app .section-heading p { text-align:left; margin-top:.55rem; }\n  #app .stats-row.k-stats { gap:.55rem; }\n  #app .stat-card { padding:.8rem .7rem; }\n  #app .stat-label { font-size:.55rem; }\n  #app .stat-formula,#app .stat-sub { font-size:.54rem; }\n}\n\n<\/style>\n\n<script>\n/* ══════════ GENERATE STARS (TWINKLING) ══════════ */\n(function() {\n  const container = document.getElementById('sw-stars');\n  if (!container) return;\n  const canvas = document.createElement('canvas');\n  canvas.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;';\n  container.appendChild(canvas);\n\n  let stars = [];\n\n  function initStars() {\n    canvas.width = window.innerWidth;\n    canvas.height = window.innerHeight;\n    stars = [];\n    for (let i = 0; i < 350; i++) {\n      stars.push({\n        x: Math.random() * canvas.width,\n        y: Math.random() * canvas.height,\n        r: Math.random() * 1.8 + 0.2,\n        alpha: Math.random(),\n        speed: Math.random() * 0.015 + 0.003,\n        dir: Math.random() > 0.5 ? 1 : -1,\n      });\n    }\n  }\n\n  function animStars() {\n    const ctx = canvas.getContext('2d');\n    ctx.clearRect(0, 0, canvas.width, canvas.height);\n    stars.forEach(s => {\n      s.alpha += s.speed * s.dir;\n      if (s.alpha >= 1 || s.alpha <= 0.05) s.dir *= -1;\n      ctx.beginPath();\n      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);\n      ctx.fillStyle = `rgba(255,255,255,${s.alpha.toFixed(2)})`;\n      ctx.fill();\n    });\n    requestAnimationFrame(animStars);\n  }\n\n  initStars();\n  animStars();\n  window.addEventListener('resize', initStars);\n})();\n<\/script>\n\n<script>\n/* ══════════ STAR WARS MUSIC + SFX via Web Audio API ══════════ */\n(function() {\n  let audioCtx = null;\n  let musicNodes = [];\n  let musicPlaying = false;\n  let musicScheduled = false;\n\n  function getCtx() {\n    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();\n    return audioCtx;\n  }\n\n  /* ── Bruitage : whoosh d'ouverture ── */\n  function playWhoosh() {\n    const ctx = getCtx();\n    const bufLen = ctx.sampleRate * 1.2;\n    const buf = ctx.createBuffer(1, bufLen, ctx.sampleRate);\n    const data = buf.getChannelData(0);\n    for (let i = 0; i < bufLen; i++) {\n      const t = i / ctx.sampleRate;\n      const env = Math.exp(-t * 3.5) * (1 - Math.exp(-t * 60));\n      data[i] = (Math.random() * 2 - 1) * env;\n    }\n    const src = ctx.createBufferSource();\n    src.buffer = buf;\n    const filter = ctx.createBiquadFilter();\n    filter.type = 'bandpass';\n    filter.frequency.setValueAtTime(800, ctx.currentTime);\n    filter.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 1.2);\n    filter.Q.value = 2;\n    const gain = ctx.createGain();\n    gain.gain.setValueAtTime(0.5, ctx.currentTime);\n    gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 1.2);\n    src.connect(filter);\n    filter.connect(gain);\n    gain.connect(ctx.destination);\n    src.start();\n  }\n\n  /* ── Note helper ── */\n  function playNote(freq, startTime, duration, gain, type = 'sawtooth') {\n    const ctx = getCtx();\n    const osc = ctx.createOscillator();\n    const gainNode = ctx.createGain();\n    const filter = ctx.createBiquadFilter();\n\n    osc.type = type;\n    osc.frequency.setValueAtTime(freq, startTime);\n\n    filter.type = 'lowpass';\n    filter.frequency.value = 2200;\n    filter.Q.value = 1;\n\n    gainNode.gain.setValueAtTime(0, startTime);\n    gainNode.gain.linearRampToValueAtTime(gain, startTime + 0.04);\n    gainNode.gain.setValueAtTime(gain, startTime + duration - 0.08);\n    gainNode.gain.linearRampToValueAtTime(0, startTime + duration);\n\n    // Légère reverb simulée\n    const delay = ctx.createDelay(0.3);\n    delay.delayTime.value = 0.18;\n    const delayGain = ctx.createGain();\n    delayGain.gain.value = 0.18;\n\n    osc.connect(filter);\n    filter.connect(gainNode);\n    gainNode.connect(ctx.destination);\n    gainNode.connect(delay);\n    delay.connect(delayGain);\n    delayGain.connect(ctx.destination);\n\n    osc.start(startTime);\n    osc.stop(startTime + duration + 0.1);\n\n    musicNodes.push(osc);\n  }\n\n  /* ── Thème principal Star Wars (mélodie + harmonies) ── */\n  function scheduleSWTheme(startOffset) {\n    const ctx = getCtx();\n    const t0 = ctx.currentTime + startOffset;\n\n    // Fréquences (Do Majeur transposé)\n    const C4=261.63, D4=293.66, E4=329.63, F4=349.23,\n          G4=392.00, A4=440.00, B4=493.88,\n          C5=523.25, D5=587.33, E5=659.25, F5=698.46,\n          G5=783.99, A5=880.00,\n          G3=196.00, C3=130.81, F3=174.61;\n\n    // Mélodie principale — thème Star Wars simplifié\n    const melody = [\n      // Fanfare intro\n      [G4, 0,    0.35], [G4, 0.38, 0.35], [G4, 0.76, 0.35],\n      [C5, 1.14, 0.7],  [G5, 1.88, 0.55],\n      [F5, 2.5,  0.25], [E5, 2.78, 0.25], [D5, 3.06, 0.25], [C5, 3.34, 0.7],\n      [G5, 4.1,  0.55],\n      [F5, 4.7,  0.25], [E5, 4.98, 0.25], [D5, 5.26, 0.25], [C5, 5.54, 0.7],\n      [G5, 6.3,  0.55],\n      [F5, 6.9,  0.25], [E5, 7.18, 0.25], [F5, 7.46, 0.25], [D5, 7.74, 0.9],\n      // Deuxième phrase\n      [G4, 8.8,  0.35], [G4, 9.18, 0.35], [G4, 9.56, 0.35],\n      [C5, 9.94, 0.7],  [G5, 10.68, 0.55],\n      [F5, 11.28, 0.25],[E5, 11.56, 0.25],[D5, 11.84, 0.25],[C5, 12.12, 0.7],\n      [G5, 12.88, 0.55],\n      [F5, 13.48, 0.25],[E5, 13.76, 0.25],[D5, 14.04, 0.25],[C5, 14.32, 0.9],\n    ];\n\n    // Basse\n    const bass = [\n      [C3, 0, 1.0], [G3, 1.14, 0.7], [C3, 2.5, 0.9], [F3, 3.5, 1.0],\n      [C3, 4.6, 0.7], [G3, 5.6, 0.9], [C3, 6.5, 1.0], [F3, 7.5, 1.2],\n      [C3, 8.8, 1.0], [G3, 9.94, 0.7],[C3, 11.28, 0.9],[F3, 12.12, 1.0],\n      [C3, 13.48, 0.7],[G3, 14.04, 0.9],\n    ];\n\n    melody.forEach(([freq, time, dur]) => {\n      playNote(freq, t0 + time, dur, 0.22, 'sawtooth');\n    });\n\n    bass.forEach(([freq, time, dur]) => {\n      playNote(freq, t0 + time, dur, 0.14, 'sine');\n    });\n\n    // Boucle après 16s\n    const loopTimer = setTimeout(() => {\n      if (musicPlaying) scheduleSWTheme(0.1);\n    }, (startOffset + 16) * 1000 + 500);\n    musicNodes.push({ stop: () => clearTimeout(loopTimer) });\n  }\n\n  /* ── Démarrer / Arrêter la musique ── */\n  function startMusic() {\n    if (musicPlaying) return;\n    musicPlaying = true;\n    musicNodes = [];\n    playWhoosh();\n    scheduleSWTheme(1.0);\n    const btn = document.getElementById('sw-audio-btn');\n    if (btn) btn.textContent = '🔊 Musique ON';\n  }\n\n  function stopMusic() {\n    musicPlaying = false;\n    musicNodes.forEach(n => { try { n.stop(); } catch(e){} });\n    musicNodes = [];\n    const btn = document.getElementById('sw-audio-btn');\n    if (btn) btn.textContent = '🔇 Musique OFF';\n  }\n\n  window.toggleSwMusic = function() {\n    if (musicPlaying) stopMusic();\n    else startMusic();\n  };\n\n  window.stopSwMusic = stopMusic;\n\n  /* ── Bruitage : sabres laser à la fermeture ── */\n  window.playSaberClose = function() {\n    const ctx = getCtx();\n    const osc = ctx.createOscillator(   var v=primary();\n        for(;;){\n          if(peek()==='!'){p++;v=fact(v);}\n          else if(peek()==='%'){p++;v=v/100;}\n          else break;\n        }\n        return v;\n      }\n      function fact(n){\n        if(n<0||n!==Math.floor(n)||n>170)fail();\n        var r=1;for(var i=2;i<=n;i++)r*=i;return r;\n      }\n      function arg(){\n        if(peek()==='('){p++;var v=expr();if(peek()===')')p++;return v;}   /* parenthèse manquante tolérée */\n        return power();\n      }\n      function trig(f){return function(x){return f(deg?x*Math.PI/180:x);};}\n      function atrig(f){return function(x){var r=f(x);return deg?r*180/Math.PI:r;};}\n      var FN={\n        sin:trig(Math.sin),cos:trig(Math.cos),tan:trig(Math.tan),\n        asin:atrig(Math.asin),acos:atrig(Math.acos),atan:atrig(Math.atan),\n        ln:Math.log,log:Math.log10,sqrt:Math.sqrt,cbrt:Math.cbrt,abs:Math.abs,exp:Math.exp\n      };\n      function primary(){\n        var c=peek();\n        if(c==='('){p++;var v=expr();if(peek()===')')p++;return v;}\n        if(/[0-9.]/.test(c)){\n          var m=/^(\\d+\\.?\\d*|\\.\\d+)/.exec(t.slice(p));\n          if(!m)fail();\n          p+=m[0].length;return parseFloat(m[0]);\n        }\n        var w=/^[a-z]+/.exec(t.slice(p));\n        if(w){\n          var name=w[0];\n          if(name.indexOf('pi')===0){p+=2;return Math.PI;}\n          if(name==='ans'||name.indexOf('ans')===0){p+=3;return ans;}\n          var fnm=null;\n          Object.keys(FN).sort(function(a,b){return b.length-a.length;}).forEach(function(k){if(!fnm&&name.indexOf(k)===0)fnm=k;});\n          if(fnm){p+=fnm.length;return FN[fnm](arg());}\n          if(name.charAt(0)==='e'){p+=1;return Math.E;}\n        }\n        fail();\n      }\n      var v=expr();\n      if(p<t.length)fail();\n      if(typeof v!=='number'||!isFinite(v)||isNaN(v))fail();\n      return v;\n    }\n\n    function raw(v){\n      var r=+v.toPrecision(12);\n      if(Math.abs(r)<1e21&&Math.abs(r)>=1e-7||r===0){\n        var s=String(r);\n        if(s.indexOf('e')<0)return s;\n      }\n      return String(r);\n    }\n    function pretty(s){\n      if(s.indexOf('e')>=0)return s;\n      var neg=s.charAt(0)==='-',q=(neg?s.slice(1):s).split('.');\n      q[0]=q[0].replace(/\\B(?=(\\d{3})+(?!\\d))/g,' ');\n      return (neg?'-':'')+q.join('.');\n    }\n    function update(final){\n      var v;\n      try{v=parse(inp.value);}catch(e){v=undefined;}\n      res.classList.remove('err');alt.textContent='';\n      if(v===null){res.textContent='';lastRaw='';return;}\n      if(v===undefined){\n        lastRaw='';\n        if(final){res.textContent='Erreur';res.classList.add('err');}\n        else res.textContent='';\n        return;\n      }\n      lastRaw=raw(v);\n      res.textContent='= '+pretty(lastRaw);\n      if(v>=0&&v<=4294967295&&v===Math.floor(v)){\n        alt.textContent='bin '+v.toString(2)+'  ·  hex '+v.toString(16).toUpperCase();\n      }\n      if(final){ans=parseFloat(lastRaw);inp.value=lastRaw;}\n    }\n    function insert(txt,back){\n      var a=inp.selectionStart,b=inp.selectionEnd,v=inp.value;\n      if(a==null){a=b=v.length;}\n      inp.value=v.slice(0,a)+txt+v.slice(b);\n      var pos=a+txt.length-(back||0);\n      inp.focus();inp.setSelectionRange(pos,pos);\n      update(false);\n    }\n    function clearAll(){inp.value='';res.textContent='';alt.textContent='';res.classList.remove('err');inp.focus();}\n    function back(){\n      var a=inp.selectionStart,b=inp.selectionEnd,v=inp.value;\n      if(a!==b){inp.value=v.slice(0,a)+v.slice(b);inp.setSelectionRange(a,a);}\n      else if(a>0){inp.value=v.slice(0,a-1)+v.slice(a);inp.setSelectionRange(a-1,a-1);}\n      inp.focus();update(false);\n    }\n    function equals(){update(true);inp.focus();}\n\n    function copyText(t){\n      if(!t)return;\n      function fallback(){\n        var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';\n        document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}\n        document.body.removeChild(ta);\n      }\n      try{navigator.clipboard.writeText(t).catch(fallback);}catch(e){fallback();}\n    }\n    copyBtn.addEventListener('click',function(){\n      if(!lastRaw){update(true);}\n      copyText(lastRaw);\n      var o=copyBtn.textContent;copyBtn.textContent='✅ Copié !';\n      setTimeout(function(){copyBtn.textContent=o;},1200);\n    });\n\n    /* ----- touches ----- */\n    var degBtn;\n    var L=[\n      ['DEG','fn',function(){deg=!deg;degBtn.textContent=deg?'DEG':'RAD';update(false);inp.focus();}],\n      ['(','op',function(){insert('(');}],[')','op',function(){insert(')');}],\n      ['C','fn',clearAll],['⌫','fn',back],\n      ['sin','sc',function(){insert('sin(');}],['cos','sc',function(){insert('cos(');}],['tan','sc',function(){insert('tan(');}],\n      ['ln','sc',function(){insert('ln(');}],['log','sc',function(){insert('log(');}],\n      ['sin⁻¹','sc',function(){insert('asin(');}],['cos⁻¹','sc',function(){insert('acos(');}],['tan⁻¹','sc',function(){insert('atan(');}],\n      ['√','sc',function(){insert('√(');}],['x²','sc',function(){insert('^2');}],\n      ['xʸ','sc',function(){insert('^');}],['2ⁿ','sc',function(){insert('2^(');}],['n!','sc',function(){insert('!');}],\n      ['1/x','sc',function(){insert('1/(');}],['π','sc',function(){insert('π');}],\n      ['7'],['8'],['9'],['÷','op',function(){insert('÷');}],['mod','op',function(){insert(' mod ');}],\n      ['4'],['5'],['6'],['×','op',function(){insert('×');}],['e','sc',function(){insert('e');}],\n      ['1'],['2'],['3'],['−','op',function(){insert('−');}],['ANS','sc',function(){insert('ans');}],\n      ['0'],['.'],['%','op',function(){insert('%');}],['+','op',function(){insert('+');}],['=','eq',equals]\n    ];\n    L.forEach(function(k){\n      var b=document.createElement('button');b.type='button';b.textContent=k[0];\n      if(k[1])b.className=k[1];\n      if(k[0]==='DEG')degBtn=b;\n      b.addEventListener('mousedown',function(e){e.preventDefault();});   /* garde le curseur dans le champ */\n      b.addEventListener('click',function(){(k[2]||function(){insert(k[0]);})();});\n      keys.appendChild(b);\n    });\n\n    /* ----- champ : saisie, collage, clavier ----- */\n    inp.addEventListener('input',function(){\n      var v=inp.value.replace(/[^0-9a-zA-Zπ√.,+\\-−–×÷*/^()!%\\s²³]/g,'');\n      if(v!==inp.value)inp.value=v;\n      update(false);\n    });\n    inp.addEventListener('paste',function(e){\n      var txt=(e.clipboardData||window.clipboardData).getData('text')||'';\n      e.preventDefault();\n      /* « 16 777 214 » ou « 1,5 » collés tels quels : espaces retirés, virgule → point */\n      txt=txt.trim().replace(/[\\s\\u00a0\\u202f\\u2009]+/g,function(m,off,all){return /\\d\\s+\\d/.test(all.slice(Math.max(0,off-1),off+m.length+1))?'':' ';}).replace(/,/g,'.');\n      insert(txt);\n    });\n    inp.addEventListener('keydown',function(e){\n      if(e.key==='Enter'){e.preventDefault();equals();}\n      else if(e.key==='Escape'){clearAll();}\n      else return;\n      e.stopPropagation();\n    });\n    root.addEventListener('keydown',function(e){e.stopPropagation();});\n    return {focus:function(){inp.focus();}};\n  }\n\n  var pages={};\n  function wide(){ if(window.wideUpdate)window.wideUpdate(); }\n  ['m-row','m-row-3'].forEach(function(id){\n    var root=$(id);\n    pages[id]={aide:buildAide(root.querySelector('.calc-body')),calcu:buildCalcu(root.querySelector('.calcu'))};\n  });\n  window.resetCalc=function(id){pages[id].aide.reset();pages[id].aide.focus();};\n  window.toggleCalc=function(id){\n    var r=$(id),on=r.classList.toggle('calc-on');\n    r.querySelector('.aide-btn').textContent=on?'🧮 Réduire Aide calcul':'🧮 Aide calcul';\n    wide();\n    if(on)pages[id].aide.focus();\n  };\n  window.toggleCalcu=function(id){\n    var r=$(id),on=r.classList.toggle('calcu-on');\n    r.querySelector('.calcu-btn').textContent=on?'🔢 Fermer calculatrice':'🔢 Calculatrice';\n    wide();\n    if(on)pages[id].calcu.focus();\n  };\n\n  /* ── Exercice BILAN ── */\n  var cells=[];\n  function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}\n  function spaced(n){return String(n).replace(/\\B(?=(\\d{3})+(?!\\d))/g,' ');}\n  var SUP={'8':'⁸','16':'¹⁶','24':'²⁴'};\n  function cell(key){return document.querySelector('#macc-3 [data-r=\"'+key+'\"]');}\n  function colored(arr,n){\n    var on=(window.COURS_LVL||'d1')==='d1';\n    return arr.map(function(v,i){return on?'<span class=\"'+(i<n?'net':'host')+'\">'+v+'<\/span>':'<span>'+v+'<\/span>';}).join('<span>.<\/span>');\n  }\n  function mkInput(kind,exp){\n    var i=document.createElement('input');i.type='text';i.className='c';i.dataset.exp=exp;\n    i.setAttribute('autocomplete','off');\n    if(kind==='ip'){i.maxLength=15;i.setAttribute('inputmode','decimal');}\n    if(kind==='nb'){i.maxLength=13;i.setAttribute('inputmode','numeric');}\n    if(kind==='cl'){i.maxLength=1;}\n    i.addEventListener('input',function(){\n      i.classList.remove('good','bad','shown');\n      if(kind==='ip')i.value=i.value.replace(/[^0-9.]/g,'');\n      else if(kind==='nb')i.value=i.value.replace(/[^0-9 ]/g,'');\n      else i.value=i.value.toUpperCase().replace(/[^ABC]/g,'');\n    });\n    cells.push({el:i,kind:kind});\n    return i;\n  }\n  var data=[];\n  function build(){\n    cells=[];data=[];\n    var lv=window.COURS_LVL||'d1';window._bilan=[];\n    $('b-mkth').textContent=lv==='d3'?'Masque de réseau (CIDR)':'Masque de réseau';\n    $('b-bcrow').style.display=lv==='d3'?'':'none';\n    var order=[0,1,2].sort(function(){return Math.random()-.5;});\n    order.forEach(function(cls,c){\n      var n=cls+1;\n      var first=cls===0?rnd(1,126):cls===1?rnd(128,191):rnd(192,223);\n      var ip=[first,rnd(0,255),rnd(0,255),rnd(1,254)];\n      var mk=[0,0,0,0];for(var k=0;k<n;k++)mk[k]=255;\n      var net=ip.map(function(v,k){return v&mk[k];});\n      var fp=net.slice();fp[3]=1;\n      var hostBits=8*(4-n);\n      var nb=Math.pow(2,hostBits)-2;\n      data.push({hostBits:hostBits,nb:nb});\n      window._bilan.push({ip:ip,mk:mk,n:n});\n      var bc=ip.map(function(v,k){return k<n?v:255;});\n      cell('ip'+c).innerHTML=colored(ip,n);\n      cell('mk'+c).innerHTML=lv==='d3'?'/'+(8*n):colored(mk,n);\n      ['net','fp','bc','nb','cl'].forEach(function(key){cell(key+c).innerHTML='';});\n      cell('net'+c).appendChild(mkInput('ip',net.join('.')));\n      cell('fp'+c).appendChild(mkInput('ip',fp.join('.')));\n      if(lv==='d3')cell('bc'+c).appendChild(mkInput('ip',bc.join('.')));\n      cell('nb'+c).appendChild(mkInput('nb',String(nb)));\n      cell('cl'+c).appendChild(mkInput('cl','ABC'.charAt(cls)));\n    });\n    var sc=$('b-score');sc.textContent='';sc.style.color='';\n  }\n  function norm(c){\n    var v=c.el.value.trim();\n    if(c.kind==='nb')v=v.replace(/ /g,'');\n    return v;\n  }\n  $('b-new').addEventListener('click',build);\n  $('b-check').addEventListener('click',function(){\n    var ok=0;\n    cells.forEach(function(c){\n      c.el.classList.remove('good','bad','shown');\n      var good=norm(c)!==''&&norm(c)===c.el.dataset.exp;\n      c.el.classList.add(good?'good':'bad');if(good)ok++;\n    });\n    var sc=$('b-score');\n    if(ok===cells.length){sc.textContent='🎉 Parfait ! '+ok+'/'+cells.length+' bonnes réponses.';sc.style.color='var(--green)';}\n    else{sc.textContent=ok+'/'+cells.length+' bonnes réponses — en rouge ce qui est faux (ou vide), en vert ce qui est bon.';sc.style.color='var(--red)';}\n  });\n  $('b-corr').addEventListener('click',function(){\n    cells.forEach(function(c){\n      c.el.value=c.kind==='nb'?spaced(c.el.dataset.exp):c.el.dataset.exp;\n      c.el.classList.remove('good','bad');c.el.classList.add('shown');\n    });\n    var sc=$('b-score');\n    sc.textContent='💡 Correction — postes : '+data.map(function(d,i){\n      return 'colonne '+(i+1)+' → 2'+SUP[d.hostBits]+' − 2 = '+spaced(d.nb);\n    }).join(' · ');\n    sc.style.color='var(--accent)';\n  });\n  window._rebuildT2=build;\n  build();\n})();\n<\/script>\n<\/script>\n<style>\n/* ═════ EXPLICATIONS (à gauche des tableaux 2 et 3) ═════ */\n#more .expl{display:none}\n#more .m-row.expl-on{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:.8rem;align-items:start}\n#more .m-row.expl-on .expl{display:block;animation:fadeUp .35s ease;position:sticky;top:1rem;max-height:calc(100vh - 2rem);overflow-y:auto}\n#more .m-row.expl-on.calc-on,#more .m-row.expl-on.calcu-on{grid-template-columns:minmax(0,340px) minmax(0,1.1fr) minmax(0,1fr)}\n#more.widee .more-inner{max-width:1240px}\n#more.widee .m-steps{max-width:1200px}\n#more.wide .more-inner{max-width:1320px}\n#more.wide .m-steps{max-width:1280px}\n#more.wide3 .more-inner{max-width:1640px}\n#more.wide3 .m-steps{max-width:1600px}\n#more .expl{border:1px solid var(--accent);border-radius:13px;background:color-mix(in srgb,var(--bg) 55%,transparent);padding:.8rem .9rem 1rem}\n#more .expl-head{display:flex;align-items:center;justify-content:space-between;gap:.6rem;margin-bottom:.5rem}\n#more .expl-head b{font:750 .85rem sans-serif;color:var(--text)}\n#more .expl-head .ex-btn{padding:.3rem .6rem;font-size:.66rem}\n#more .xp-sub{font-size:.7rem;line-height:1.65;color:var(--text-dim);margin:0 0 .7rem}\n#more .xp-sub b{color:var(--text)}\n#more .xp-item{border:1px solid var(--border2);border-left-width:4px;border-radius:10px;padding:.55rem .7rem .6rem;margin-bottom:.55rem;background:color-mix(in srgb,var(--bg2) 62%,transparent)}\n#more .xp-item.st-ok{border-left-color:var(--green)}\n#more .xp-item.st-bad{border-left-color:var(--red)}\n#more .xp-item.st-info{border-left-color:var(--accent)}\n#more .xp-head{display:flex;align-items:center;gap:.45rem;font:800 .74rem sans-serif;color:var(--text)}\n#more .xp-desc{font-size:.72rem;line-height:1.65;color:var(--text-dim);margin:.3rem 0 .15rem}\n#more .xp-desc b,#more .xp-list b{color:var(--text)}\n#more .xp-list{list-style:none;margin:.2rem 0 0;padding:0}\n#more .xp-list s+'\"':'')+'>'+t+'<\/li>';}\n\n  var ST={t1:'guide',t3:'guide'};   /* guide | checked | corr */\n\n  /* ════════ TABLEAU 1 (bloc 2) ════════ */\n  function t1(){\n    var D1=window._t1data||{};var ip=D1.ip?D1.ip.slice():numsOf('ex-ipd'),mk=D1.mk?D1.mk.slice():numsOf('ex-mkd'),lv1=D1.lv||'d1';\n    var n=mk.filter(function(v){return v===255;}).length;\n    var L=letter(n),mode=ST.t1;\n    var rows={ipb:inputsOf('ex-ipb'),mkb:inputsOf('ex-mkb'),netb:inputsOf('ex-netb'),netd:inputsOf('ex-netd')};\n    var net=rows.netd.map(function(i){return parseInt(i.dataset.exp,10);});\n    var ipS=ip.join('.'),mkS=mk.join('.');\n    var mkShow=lv1==='d3'?'/'+(8*n)+' (= '+mkS+')':mkS;\n    var netPart=ip.slice(0,n).join('.'),hostPart=ip.slice(n).join('.');\n    function oct(arr,k){return arr.slice(8*k,8*k+8);}\n    function usr(arr,k){return oct(arr,k).map(function(i){return i.value===''?'·':i.value;}).join('');}\n    function exp(arr,k){return oct(arr,k).map(function(i){return i.dataset.exp;}).join('');}\n    var out=[],ok=0,tot=0,html='';\n\n    /* 1 et 2 : valeurs données */\n    html+=item('info','IP poste 1 (décimal)','Adresse unique de la machine.',[\n      li('','Ici : <b>'+ipS+'<\/b>. Le 1<sup>er<\/sup> nombre (<b>'+ip[0]+'<\/b>) est dans la zone <b>'+range(ip[0])+'<\/b> : c’est une adresse de <b>classe '+L+'<\/b>.')]);\n    html+=item('info',lv1==='d3'?'Masque (CIDR)':'Masque (décimal)',lv1==='d3'?'Le <b>/'+(8*n)+'<\/b> veut dire que les <b>'+(8*n)+'<\/b> premiers bits sont à 1 (partie réseau) et les autres à 0 (partie machine).':'Sépare la partie réseau (<b>255<\/b>) de la partie machine (<b>0<\/b>).',[\n      li('','Ici : <b>'+mkShow+'<\/b> → <b>'+n+'<\/b> fois 255 : les '+n+' premier'+(n>1?'s':'')+' nombre'+(n>1?'s':'')+' (<b>'+netPart+'<\/b>) sont le <b>réseau<\/b>, '+(4-n>1?'les '+(4-n)+' derniers nombres':'le dernier nombre')+' (<b>'+hostPart+'<\/b>) identifie'+(4-n>1?'nt':'')+' la <b>machine<\/b>.')]);\n\n    /* lignes à compléter */\n    function rowBits(key,label,descGuide,guideLines,okFn,badFn){\n      var lines=[],bad=0;\n      for(var k=0;k<4;k++){\n        var u=usr(rows[key],k),e=exp(rows[key],k),good=(u===e);\n        if(!good)bad++;\n        lines.push(good?li('ok',okFn(k,e)):li('bad',badFn(k,u,e)));\n      }\n      tot+=4;ok+=4-bad;\n      if(mode==='guide')return item('info',label,descGuide,guideLines);\n      return item(bad?'bad':'ok',label,descGuide,lines);\n    }\n    html+=rowBits('ipb','IP poste 1 (binaire)','Traduit l’IP en binaire (0 et 1).',[\n      li('','Chaque nombre devient 1 octet = <b>8 bits<\/b>. On cherche quelles valeurs parmi <b>128 · 64 · 32 · 16 · 8 · 4 · 2 · 1<\/b> s’additionnent pour former le nombre : <b>1<\/b> sous celles qu’on garde, <b>0<\/b> sous les autres. On commence toujours par les plus grands nombres <b>128 · 64<\/b>… et si ça dépasse le nombre qu’on veut, on ne le prend pas (<b>0<\/b>).'),\n      li('','Exemple avec ton 1<sup>er<\/sup> nombre : <b>'+ip[0]+' = '+decomp(ip[0])+'<\/b> → <code>'+bin8(ip[0])+'<\/code>.')],\n      function(k,e){return 'Octet '+(k+1)+' : '+ip[k]+' = '+decomp(ip[k])+' → <code>'+e+'<\/code>';},\n      function(k,u,e){return 'Octet '+(k+1)+' ('+ip[k]+') : tu as mis <code>'+esc(u)+'<\/code>, la bonne réponse est <code>'+e+'<\/code> car <b>'+ip[k]+' = '+decomp(ip[k])+'<\/b>.';});\n    html+=rowBits('mkb','Masque (binaire)','Traduit le masque en binaire (0 et 1).',[\n      li('','<b>255<\/b> s’écrit <code>11111111<\/code> (huit 1) et <b>0<\/b> s’écrit <code>00000000<\/code> (huit 0).'),\n      li('','Ici le masque <b>'+mkShow+'<\/b> : '+n+' octet'+(n>1?'s':'')+' de 1, puis '+(4-n)+' octet'+(4-n>1?'s':'')+' de 0.')],\n      function(k,e){return 'Octet '+(k+1)+' : '+mk[k]+' → <code>'+e+'<\/code>';},\n      function(k,u,e){return 'Octet '+(k+1)+' ('+mk[k]+') : tu as mis <code>'+esc(u)+'<\/code>, attendu <code>'+e+'<\/code> ('+(mk[k]===255?'255 = huit 1':'0 = huit 0')+').';});\n    html+=rowBits('netb','Adresse réseau (binaire)','Résultat de l’opération ET logique : <b>IP ET Masque<\/b>, bit par bit.',[\n      li('','Rappel : <b>1 ET 1 = 1<\/b>, et quand il y a 1 seul <b>0<\/b> c’est = <b>0<\/b> (1 et 0 = 0).'),\n      li('','Ici : les <b>'+(8*n)+'<\/b> premiers bits (<b>'+(n===1?'le 1<sup>er<\/sup> octet':'les '+n+' premiers octets')+'<\/b>) (masque = 1) : avec ceux de l’IP on fait le <b>ET logique<\/b> ; les <b>'+(32-8*n)+'<\/b> derniers bits (masque = <b>'+(32-8*n)+'<\/b> fois 0) deviennent des <b>0<\/b> : le ET logique est tout simple, que des 0.')],\n      function(k,e){return 'Octet '+(k+1)+' : <code>'+bin8(ip[k])+'<\/code> ET <code>'+bin8(mk[k])+'<\/code> = <code>'+e+'<\/code>';},\n      function(k,u,e){return 'Octet '+(k+1)+' : <code>'+bin8(ip[k])+'<\/code> ET <code>'+bin8(mk[k])+'<\/code> = <code>'+e+'<\/code> (tu as mis <code>'+esc(u)+'<\/code>). '+(mk[k]===255?'Le masque est à 1 : on recopie l’IP.':'Le masque est à 0 : on met 0.');});\n    /* décimal */\n    (function(){\n      var lines=[],bad=0;\n      for(var k=0;k<4;k++){\n        var u=rows.netd[k].value,e=String(net[k]),good=(u===e);\n        if(!good)bad++;\n        lines.push(good?li('ok','Octet '+(k+1)+' : <code>'+bin8(net[k])+'<\/code> = '+decomp(net[k])+' → <b>'+net[k]+'<\/b>')\n                       :li('bad','Octet '+(k+1)+' : <code>'+bin8(net[k])+'<\/code> = '+decomp(net[k])+' → <b>'+net[k]+'<\/b> (tu as mis <code>'+esc(u===''?'rien':u)+'<\/code>).'));\n      }\n      tot+=4;ok+=4-bad;\n      var desc='Conversion de l’adresse réseau (en binaire) en décimal.';\n      html+=mode==='guide'\n        ?item('info','Adresse réseau (décimal)',desc,[\n            li('','Pour chaque octet on additionne les valeurs <b>128, 64, 32…<\/b> des bits à 1 : on transforme les 0 et 1 en nombre (de 0 à 255).'),\n            li('','Comment faire ici : quand le masque est à <b>255<\/b> pour l’octet, on garde le même nombre que l’IP, et quand l’octet du masque est à <b>0<\/b>, on met <b>0<\/b>.'),\n            li('','Exemple : (Masque : <b>'+mkShow+'<\/b>) (IP : <b>'+ipS+'<\/b>). Donc Adresse réseau (décimal) : <b>'+net.join('.')+'<\/b>')])\n        :item(bad?'bad':'ok','Adresse réseau (décimal)',desc,lines);\n    })();\n\n    var sub;\n    if(mode==='guide')sub='Voici <b>comment remplir chaque ligne<\/b>, adapté à ton IP <b>'+ipS+'<\/b> (classe '+L+'). Valide ton tableau puis reviens ici : je te corrige.';\n    else if(mode==='corr')sub='La <b>correction est affichée<\/b> : voici comment on arrive à chaque réponse pour <b>'+ipS+'<\/b>.';\n    else sub=(ok===tot?'🎉 <b>Tout est juste !<\/b> ':'Voici ta correction : <b>'+ok+'/'+tot+'<\/b> octets justes. ')+'✅ ce qui est bon, ❌ ce qui est à revoir.';\n    return '<p class=\"xp-sub\">'+sub+'<\/p>'+html;\n  }\n\n  /* ════════ TABLEAU 2 — BILAN (bloc 3) ════════ */\n  function cellOf(key){return document.querySelector('#macc-3 [data-r=\"'+key+'\"]');}\n  function t3(){\n    var mode=ST.t3,cols=[];\n    for(var c=0;c<3;c++){\n      var bd=(window._bilan||[])[c];\n      var ip=bd.ip.join('.'),mk=bd.mk.join('.'),ipn=bd.ip.slice(),n=bd.n;\n      cols.push({ip:ip,mk:mk,ipn:ipn,n:n,hb:8*(4-n),lv:(window.COURS_LVL||'d1'),bc:cellOf('bc'+c).querySelector('input'),\n        net:cellOf('net'+c).querySelector('input'),fp:cellOf('fp'+c).querySelector('input'),\n        nb:cellOf('nb'+c).querySelector('input'),cl:cellOf('cl'+c).querySelector('input')});\n    }\n    var ok=0,tot=0,html='';\n    function val(i,kind){var v=i.value.trim();if(kind==='nb')v=v.replace(/ /g,'');return v;}\n    function row(key,label,desc,guideFn,okFn,badFn,kind){\n      var lines=[],bad=0;\n      cols.forEach(function(x,c){\n        var i=x[key],u=val(i,kind),e=i.dataset.exp,good=(u!==''&&u===e);\n        if(!good)bad++;\n        tot++;if(good)ok++;\n        lines.push(mode==='guide'?li('',guideFn(x,c)):(good?li('ok',okFn(x,c,e)):li('bad',badFn(x,c,e,u===''?'rien':u))));\n      });\n      return item(mode==='guide'?'info':(bad?'bad':'ok'),label,desc,lines);\n    }\n    function mkLab(x){return x.lv==='d3'?'/'+(8*x.n)+' = '+x.mk:x.mk;}\n    function col(c){return 'Colonne '+(c+1)+' · <b>'+cols[c].ip+'<\/b> (masque '+mkLab(cols[c])+')';}\n    html+=row('net','Adresse du réseau','Identifie l’adresse du réseau : tous les bits hôtes sont à <b>0<\/b>, et la partie réseau reste la même.<br><b>Astuce :<\/b> quand le masque est à <b>255<\/b> pour l’octet, on garde le même nombre que l’IP, et quand l’octet du masque est à <b>0<\/b>, on met <b>0<\/b>.',\n      function(x,c){return 'Colonne '+(c+1)+' · (IP : <b>'+x.ip+'<\/b>) (masque <b>'+mkLab(x)+'<\/b>) : Donc l’Adresse réseau (décimal) : <b>'+x.net.dataset.exp+'<\/b>';},\n      function(x,c,e){return col(c)+' : <b>'+e+'<\/b> — '+x.n+' nombre'+(x.n>1?'s':'')+' gardé'+(x.n>1?'s':'')+' ('+x.ipn.slice(0,x.n).join('.')+'), le reste remis à 0.';},\n      function(x,c,e,u){return col(c)+' : tu as mis <code>'+esc(u)+'<\/code>, la bonne réponse est <b>'+e+'<\/b> : on garde <b>'+x.ipn.slice(0,x.n).join('.')+'<\/b> et on met 0 pour le reste.';});\n    html+=row('fp','Adresse 1<sup>er<\/sup> poste','Première adresse utilisable pour une machine (le <b>.0<\/b> est réservé au réseau), donc <b>.1<\/b>.',\n      function(x,c){return col(c)+' : on reprend l’adresse du réseau et on remplace le dernier <b>0<\/b> par un <b>1<\/b>.';},\n      function(x,c,e){return col(c)+' : adresse du réseau + <b>.1<\/b> = <b>'+e+'<\/b>.';},\n      function(x,c,e,u){return col(c)+' : tu as mis <code>'+esc(u)+'<\/code>, la bonne réponse est <b>'+e+'<\/b> (adresse du réseau avec <b>.1<\/b> à la fin).';});\n    if(cols[0].lv==='d3')html+=row('bc','Adresse de diffusion (broadcast)','Dernière adresse du réseau : tous les bits hôtes sont à <b>1<\/b>. Elle sert à envoyer un message à tous les postes du réseau, donc on ne peut pas la donner à une machine.<br><b>Astuce :<\/b> quand le masque est à <b>255<\/b> pour l’octet, on garde le même nombre que l’IP, et quand l’octet du masque est à <b>0<\/b>, on met <b>255<\/b>.',\n      function(x,c){return 'Colonne '+(c+1)+' · (IP : <b>'+x.ip+'<\/b>) ( filter .12s}\n.next-btn:hover{transform:translateY(-1px);filter:brightness(1.1)}\n@media(max-width:860px){.board{grid-template-columns:1fr;overflow:auto}.q-grid{grid-template-columns:1fr}.q-card.bonus{grid-column:auto}}\n#devtools-block{position:fixed;inset:0;background:#000;z-index:2147483647;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;font-family:'Nunito',sans-serif}\n#devtools-block .dtb-lock{font-size:60px;line-height:1;margin-bottom:20px}\n#devtools-block .dtb-title{font-size:28px;font-weight:900;color:#FFFFFF;margin-bottom:14px}\n#devtools-block .dtb-sub{font-size:15px;font-weight:600;color:#9AA0A6;line-height:1.55;max-width:400px}\n#pw-modal{position:fixed;inset:0;background:rgba(4,10,20,0.72);z-index:2147483646;display:none;align-items:center;justify-content:center;padding:20px}\n#pw-modal.show{display:flex}\n.pw-box{background:#0F2138;border:1.5px solid #1E5278;border-radius:14px;padding:20px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px}\n.pw-title{font-size:16px;font-weight:900;color:#E8A0C0;display:flex;align-items:center;gap:8px}\n.pw-sub{font-size:13px;font-weight:700;color:#9FB8D4}\n.pw-input{font-family:'JetBrains Mono',monospace;font-size:14px;border-radius:8px;border:1.5px solid #2E6FA8;background:#0C1D30;color:#E6F1FB;padding:9px 12px;width:100%}\n.pw-input:focus{outline:none;border-color:#3B82C4}\n.pw-err{font-size:12px;font-weight:700;color:#F0A0A0;min-height:14px}\n.pw-actions{display:flex;justify-content:flex-end;gap:8px}\n.pw-cancel{font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;cursor:pointer;background:#143E5C;color:#9FD0F5;border:none;border-radius:99px;padding:8px 18px}\n.pw-ok{font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;cursor:pointer;background:#1BA8C7;color:#06121F;border:none;border-radius:99px;padding:8px 22px}\n<\/style>\n<style>\n/* centrage sans couper le haut quand l'écran est petit */\n.diff-screen{justify-content:flex-start}\n.diff-screen>:first-child{margin-top:auto}.diff-screen>:last-child{margin-bottom:auto}\n.win-panel{justify-content:flex-start}.win-card{margin:auto}\n@media(max-width:860px){\n #app{overflow-y:auto;padding:10px;gap:10px;-webkit-overflow-scrolling:touch}\n #app>*{flex-shrink:0}\n .hud{flex-wrap:wrap;gap:8px 12px;padding:10px 12px}\n .hud-prog{order:9;flex:1 1 100%}\n .hud-tile{min-width:0;flex:1}\n .rules{display:none}\n .hud-v{font-size:19px}\n .lvl-pill{order:8;flex:1 1 100%;text-align:center;font-size:11px;padding:5px 10px}\n .board{display:flex;flex-direction:column;flex:none;min-height:auto;overflow:visible}\n .ip-card{overflow:visible;flex:none}\n .acts{display:grid;grid-template-columns:1fr 1fr;margin-top:4px}\n .acts .act-main{grid-column:1/-1}\n .q-grid{display:flex;flex-direction:column;gap:10px}\n .q-card{flex:none;padding:12px 12px 12px 16px}\n .bottom{position:sticky;bottom:0;padding:8px 0 2px;background:linear-gradient(to bottom,transparent,#07101c 30%);z-index:5}\n .result-row{flex-direction:column}\n .next-btn{justify-content:center}\n .ip-addr{font-size:1.2rem}\n .diff-title{font-size:1.7rem}\n}\n<\/style>\n<\/head>\n<body>\n<div id=\"app\"><\/div>\n<div id=\"devtools-block\">\n  <div class=\"dtb-lock\">🔒<\/div>\n  <div class=\"dtb-title\">Accès non autorisé<\/div>\n  <div class=\"dtb-sub\">Les outils de développement sont désactivés sur cette application.<br>Fermez-les pour reprendre.<\/div>\n<\/div>\n<div id=\"pw-modal\">\n  <div class=\"pw-box\">\n    <div class=\"pw-title\"><i class=\"ti ti-lock\"><\/i> <span id=\"pw-title-txt\">Réinitialiser la partie<\/span><\/div>\n    <div class=\"pw-sub\">Mot de passe :<\/div>\n    <input id=\"pw-input\" type=\"password\" class=\"pw-input\" autocomplete=\"off\" onkeydown=\"if(event.key==='Enter'){submitPw()}else if(event.key==='Escape'){closePwModal()}\">\n    <div id=\"pw-err\" class=\"pw-err\"><\/div>\n    <div class=\"pw-actions\">\n      <button class=\"pw-cancel\" onclick=\"closePwModal()\">Annuler<\/button>\n      <button class=\"pw-ok\" onclick=\"submitPw()\">OK<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n<script>\n// Écran \"Accès non autorisé\" lorsqu'on tente d'ouvrir / utiliser les outils de développement\nfunction showBlock(){var b=document.getElementById('devtools-block');if(b)b.style.display='flex';}\nfunction hideBlock(){var b=document.getElementById('devtools-block');if(b)b.style.display='none';}\n\ndocument.addEventListener('contextmenu',e=>e.preventDefault());\nvar keyLockUntil=0;\ndocument.addEventListener('keydown',function(e){\n  const k=(e.key||'').toUpperCase();\n  // F12 / Ctrl+Maj+I / J / C : on bloque la touche ET on affiche l'écran de blocage\n  if(k==='F12'\n    ||((e.ctrlKey||e.metaKey)&&e.shiftKey&&(k==='I'||k==='J'||k==='C'))\n    ||(e.metaKey&&e.altKey&&(k==='I'||k==='J'||k==='C'))){\n    e.preventDefault();e.stopPropagation();\n    keyLockUntil=Date.now()+2000;\n    showBlock();\n    return false;\n  }\n  // Ctrl+U (code source) / Ctrl+S (enregistrer) : on bloque\n  if(((e.ctrlKey||e.metaKey)&&k==='U')||((e.ctrlKey||e.metaKey)&&k==='S')){\n    e.preventDefault();e.stopPropagation();return false;\n  }\n  // F5 / Ctrl+R / Ctrl+Maj+R : actualisation protégée par mot de passe\n  if(k==='F5'||((e.ctrlKey||e.metaKey)&&k==='R')){\n    e.preventDefault();e.stopPropagation();\n    if(typeof askRefresh==='function')askRefresh();\n    return false;\n  }\n});\n\n// Actualisation clavier protégée par mot de passe (voir keydown ci-dessus)\nlet allowReload=false;\n\n// Surveillance continue : affiche l'écran tant que les outils sont ouverts, le masque dès qu'ils sont refermés\nsetInterval(function(){\n  var seuil=160;\n  var ouvert=(window.outerWidth-window.innerWidth>seuil)||(window.outerHeight-window.innerHeight>seuil);\n  var mob=/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)||matchMedia('(pointer:coarse)').matches;\n  if((!mob&&ouvert)||Date.now()<keyLockUntil)showBlock();else hideBlock();\n},600);\n\nconst DIFFS=[\n  {key:'d1',label:'Facile',gain:1,perte:1,icon:'ti-mood-smile',desc:'+1 pt si tout juste\\n-1 pt si erreur',notePer:5,noteLoss:2},\n  {key:'d2',label:'Moyen',gain:0.5,perte:0.5,icon:'ti-mood-neutral',desc:'+0.5 pt si tout juste\\n-0.5 pt si erreur',notePer:5,noteLoss:2},\n  {key:'d3',label:'Difficile',gain:0.25,perte:0.25,icon:'ti-mood-sad',desc:'+0.25 pt si tout juste\\n-0.25 pt si erreur',notePer:10,noteLoss:5},\n];\nconst QUESTIONS=[\n  {id:'classe',label:'Classe du réseau',hint:'A, B ou C'},\n  {id:'masque',label:'Masque par défaut',hint:'ex: 255.0.0.0'},\n  {id:'reseau',label:'Adresse réseau',hint:'ex: 10.0.0.0'},\n  {id:'broadcast',label:'Adresse broadcast',hint:'ex: 10.255.255.255'},\n  {id:'premier',label:'Premier hôte',hint:'ex: 10.0.0.1'},\n  {id:'dernier',label:'Dernier hôte',hint:'ex: 10.255.255.254'},\n];\nconst QCOLORS={\n  classe:{u:'#143A58',ub:'#3E92C8',ut:'#A8D8F5'},\n  masque:{u:'#143A58',ub:'#3E92C8',ut:'#A8D8F5'},\n  reseau:{u:'#3C1C30',ub:'#9A4A6E',ut:'#F2A8C2'},\n  broadcast:{u:'#3C1C30',ub:'#9A4A6E',ut:'#F2A8C2'},\n  premier:{u:'#13473A',ub:'#3FA47C',ut:'#A8ECD5'},\n  dernier:{u:'#13473A',ub:'#3FA47C',ut:'#A8ECD5'},\n};\n\nfunction ri(a,b){return Math.floor(Math.random()*(b-a+1))+a}\nfunction genIP(){\n  const t=ri(0,2);\n  if(t===0)return{oct:[ri(1,126),ri(0,255),ri(0,255),ri(0,255)],cls:'A'};\n  if(t===1)return{oct:[ri(128,191),ri(0,255),ri(0,255),ri(0,255)],cls:'B'};\n  return{oct:[ri(192,223),ri(0,255),ri(0,255),ri(0,255)],cls:'C'};\n}\nfunction getMask(c){return c==='A'?'255.0.0.0':c==='B'?'255.255.0.0':'255.255.255.0'}\nfunction getNetwork(o,c){return c==='A'?o[0]+'.0.0.0':c==='B'?o[0]+'.'+o[1]+'.0.0':o[0]+'.'+o[1]+'.'+o[2]+'.0'}\nfunction getBroadcast(o,c){return c==='A'?o[0]+'.255.255.255':c==='B'?o[0]+'.'+o[1]+'.255.255':o[0]+'.'+o[1]+'.'+o[2]+'.255'}\nfunction getFirst(o,c){return c==='A'?o[0]+'.0.0.1':c==='B'?o[0]+'.'+o[1]+'.0.1':o[0]+'.'+o[1]+'.'+o[2]+'.1'}\nfunction getLast(o,c){return c==='A'?o[0]+'.255.255.254':c==='B'?o[0]+'.'+o[1]+'.255.254':o[0]+'.'+o[1]+'.'+o[2]+'.254'}\nfunction getCIDR(c){return c==='A'?'/8':c==='B'?'/16':'/24'}\nfunction isPrivate(o){\n  if(o[0]===10)return true;\n  if(o[0]===172&&o[1]>=16&&o[1]<=31)return true;\n  if(o[0]===192&&o[1]===168)return true;\n  return false;\n}\nfunction getVisibilite(o){return isPrivate(o)?'privée':'publique'}\nfunction getNthHost(o,c,n){\n  if(c==='A'){const b=o[0]*16777216;const a=b+n;return[(a>>>24)&255,(a>>>16)&255,(a>>>8)&255,a&255].join('.');}\n  if(c==='B'){const b=o[0]*16777216+o[1]*65536;const a=b+n;return[(a>>>24)&255,(a>>>16)&255,(a>>>8)&255,a&255].join('.');}\n  const b=o[0]*16777216+o[1]*65536+o[2]*256;const a=b+n;return[(a>>>24)&255,(a>>>16)&255,(a>>>8)&255,a&255].join('.');\n}\nfunction getAnswers(ip){return{\n  classe:ip.cls,masque:getMask(ip.cls),reseau:getNetwork(ip.oct,ip.cls),\n  broadcast:getBroadcast(ip.oct,ip.cls),premier:getFirst(ip.oct,ip.cls),dernier:getLast(ip.oct,ip.cls),\n  cidr:getCIDR(ip.cls),visibilite:getVisibilite(ip.oct)\n};}\nfunction fmt(n){return parseFloat(n.toFixed(2))}\nfunction coloredIP(ip){\n  const netCount=ip.cls==='A'?1:ip.cls==='B'?2:3;\n  return ip.oct.map((v,i)=>`<span class=\"ip-${i<netCount?'net':'host'}\">${v}<\/span>`).join('<span class=\"ip-dot\">.<\/span>');\n}\n\nlet diff=null,score=0,ip=null,answers=null,inputs={},bonusInput='',bonusN=200,coups=0;\nlet validated=false,roundResult=null,won=false,lockedIn=false,finished=false;\n\nlet startTime=Date.now(),timerRunning=false,finalTime=0;\nfunction getElapsed(){return timerRunning?Date.now()-startTime:finalTime;}\nfunction fmtTime(ms){const s=Math.floor(ms/1000);const m=Math.floor(s/60);return String(m).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}\nfunction resetTimer(){startTime=Date.now();timerRunning=true;finalTime=0;}\nfunction menuTimer(){startTime=Date.now();timerRunning=false;finalTime=0;}\nfunction stopTimer(){if(timerRunning){finalTime=Date.now()-startTime;timerRunning=false;}}\nfunction updateTimer(){const t=fmtTime(getElapsed());document.querySelectorAll('.timer-val,.dt-val').forEach(e=>e.textContent=t);}\nsetInterval(updateTimer,1000);\n\nfunction allFilled(){\n  const base=QUESTIONS.every(q=>(inputs[q.id]||'').trim());\n  if(!base)return false;\n  if(!diff||diff.key==='d1')return true;\n  if(diff.key==='d3'&&(!(inputs.cidr||'').trim()||!(inputs.visibilite||'').trim()))return false;\n  return !!bonusInput.trim();\n}\n\nfunction isAdmin(){try{return !!(parent&&parent.adminActive&&parent.adminActive());}catch(e){return false;}}\nfunction adminRefresh(){if(diff&&!won&&!finished&&!validated)render();}\nfunction adminFill(){\n  if(!isAdmin()||validated||!diff||!answers)return;\n  QUESTIONS.forEach(q=>{inputs[q.id]=answers[q.id];});\n  if(diff.key==='d3'){inputs.cidr=answers.cidr;inputs.visibilite=answers.visibilite;}\n  if(diff.key!=='d1')bonusInput=getNthHost(ip.oct,ip.cls,bonusN);\n  render();refreshValidateBtn();saveState();\n}\nfunction nextIP(){\n  ip=genIP();answers=getAnswers(ip);\n  inputs={};bonusInput='';bonusN=ip.cls==='C'?ri(2,253):ri(200,280);\n  validated=false;roundResult=null;\n  render();\n}\n\nfunction newIP(){\n  coups++;\n  score=Math.max(0,fmt(score-diff.perte));\n  nextIP();\n}\n\nfunction chooseDiff(d){diff=d;score=0;coups=0;won=false;lockedIn=false;finished=false;resetTimer();nextIP();}\nfunction goBack(){if(lockedIn)return;diff=null;menuTimer();render();saveState();}\nfunction finishGame(){finished=true;stopTimer();render();}\n\nconst RH=[189,29,88,107,7,110,242,123,155,130,151,106,69,170,82,167,199,172,114,45,204,192,223,4,203,38,198,172,233,4,152,180];\nlet _pwAction=null;\nfunction openPwModal(title,action){\n  _pwAction=action;\n  document.getElementById('pw-title-txt').textContent=title;\n  const inp=document.getElementById('pw-input');\n  document.getElementById('pw-err').textContent='';\n  inp.value='';\n  document.getElementById('pw-modal').classList.add('show');\n  setTimeout(()=>inp.focus(),50);\n}\nfunction closePwModal(){document.getElementById('pw-modal').classList.remove('show');_pwAction=null;}\nasync function submitPw(){\n  const inp=document.getElementById('pw-input');\n  const err=document.getElementById('pw-err');\n  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(inp.value));\n  const h=Array.from(new Uint8Array(buf));\n  if(h.length===RH.length&&h.every((b,i)=>b===RH[i])){const a=_pwAction;closePwModal();if(a)a();}\n  else{err.textContent='Mot de passe incorrect.';inp.value='';inp.focus();}\n}\nconst STORAGE_KEY='quizIpState_v1';\nfunction saveState(){\n  try{\n    sessionStorage.setItem(STORAGE_KEY,JSON.stringify({\n      diff,score,ip,answers,inputs,bonusInput,bonusN,coups,\n      validated,roundResult,won,lockedIn,finished,\n      startTime,timerRunning,finalTime\n    }));\n  }catch(e){}\n}\nfunction loadState(){\n  try{\n    const raw=sessionStorage.getItem(STORAGE_KEY);\n    if(!raw)return false;\n    const s=JSON.parse(raw);\n    diff=s.diff;score=s.score;ip=s.ip;answers=s.answers;inputs=s.inputs||{};\n    bonusInput=s.bonusInput||'';bonusN=s.bonusN;coups=s.coups||0;\n    validated=s.validated;roundResult=s.roundResult;won=s.won;lockedIn=s.lockedIn;finished=s.finished;\n    startTime=s.startTime;timerRunning=s.timerRunning;finalTime=s.finalTime;\n    return true;\n  }catch(e){return false;}\n}\n// Avertissement natif du navigateur avant tout départ de la page (rechargement via le bouton\n// du navigateur, fermeture d'onglet, etc.) — la touche clavier F5/Ctrl+R reste, elle, bloquée\n// en amont par mot de passe (voir keydown plus haut), donc on ignore l'avertissement dans ce cas.\nwindow.addEventListener('beforeunload',function(e){\n  if(allowReload)return;\n  e.preventDefault();\n  e.returnValue='';\n});\nfunction changeLevel(){doReset();saveState();}\nfunction askReset(){openPwModal('Réinitialiser la partie',doReset);}\nfunction askRefresh(){openPwModal('Actualiser la page',function(){allowReload=true;location.reload();});}\nfunction doReset(){\n  diff=null;score=0;coups=0;won=false;lockedIn=false;finished=false;\n  inputs={};bonusInput='';validated=false;roundResult=null;\n  menuTimer();render();\n}\n\nfunction upInput(id,val){inputs[id]=val;refreshValidateBtn();}\nfunction upBonus(val){bonusInput=val;refreshValidateBtn();}\nfunction chooseVis(v){if(validated)return;inputs.visibilite=v;render();}\nfunction refreshValidateBtn(){\n  const btn=document.getElementById('vbtn');\n  if(btn)btn.disabled=!allFilled();\n}\n\nfunction validate(){\n  if(!allFilled()||validated)return;\n  validated=true;\n  coups++;\n  lockedIn=true;\n  const isFacile=diff.key==='d1';\n  const bonusCorrect=getNthHost(ip.oct,ip.cls,bonusN);\n  let allOk=true;\n  const details={};\n  QUESTIONS.forEach(q=>{\n    const ok=(inputs[q.id]||'').trim().toUpperCase().replace(/\\s/g,'')===answers[q.id].toUpperCase().replace(/\\s/g,'');\n    details[q.id]=ok;if(!ok)allOk=false;\n  });\n  let extraErr=0;\n  if(diff.key==='d3'){\n    const cidrIn=(inputs.cidr||'').trim().replace(/\\s/g,'').replace(/^\\//,'');\n    const cidrOk=cidrIn===answers.cidr.replace(/^\\//,'');\n    details.cidr=cidrOk;if(!cidrOk){allOk=false;extraErr++;}\n    const visIn=(inputs.visibilite||'').trim().toLowerCase();\n    const visTok=visIn.startsWith('priv')?'priv':visIn.startsWith('pub')?'pub':'';\n    const visOk=(visTok==='priv'&&answers.visibilite==='privée')||(visTok==='pub'&&answers.visibilite==='publique');\n    details.visibilite=visOk;if(!visOk){allOk=false;extraErr++;}\n  }\n  let bok=true;\n  if(!isFacile){\n    bok=(bonusInput||'').trim().replace(/\\s/g,'')===bonusCorrect;\n    if(!bok)allOk=false;\n    details.bonus=bok;\n  }\n  const errCount=QUESTIONS.filter(q=>!details[q.id]).length+extraErr+((!isFacile&&!bok)?1:0);\n  roundResult={allOk,details,bonusCorrect,errCount};\n  if(allOk){score=fmt(score+diff.gain);if(score>=20){won=true;stopTimer();}}\n  else{score=Math.max(0,fmt(score-diff.perte));}\n  render();\n}\n\nfunction hkey(e){if(e.key==='Enter'){const b=document.getElementById('vbtn');if(b&&!b.disabled)validate();}}\n\n\nfunction levelScreenHTML(cfg){\n  return `<div class=\"diff-screen\">\n    <div class=\"ds-chip\">${cfg.chip}<\/div>\n    <div class=\"diff-title\">Choisis ton niveau<\/div>\n    <div class=\"diff-sub\">${cfg.sub}<br>La difficulté sera verrouillée pour toute la partie.<\/div>\n    <div class=\"diff-timer\">⏱ Temps : <span class=\"dt-val\">${fmtTime(getElapsed())}<\/span><\/div>\n    <div class=\"diff-grid\">${DIFFS.map(d=>{const u=cfg.ui[d.key];return `\n      <button class=\"diff-btn ${d.key}\" onclick=\"chooseDiff(${JSON.stringify(d).replace(/\"/g,'&quot;')})\">\n        <span class=\"diff-ico\">${u.emoji}<\/span>\n        <span class=\"diff-name\">${d.label}<\/span>\n        <span class=\"diff-tag\">${u.tag}<\/span>\n        <span class=\"diff-pts\"><b class=\"up\">+${d.gain} pt<\/b><b class=\"down\">−${d.perte} pt<\/b><\/span>\n        <ul class=\"diff-feat\">${u.feat.map(f=>`<li>${f}<\/li>`).join('')}<\/ul>\n        <span class=\"diff-go\">Lancer le niveau →<\/span>\n      <\/button>`;}).join('')}\n    <\/div>\n  <\/div>`;\n}\nfunction winScreenHTML(o){\n  return `<div class=\"win-panel\"><div class=\"win-card\">\n    <div class=\"win-emoji\">${o.reached?'🎉':'🏁'}<\/div>\n    <div class=\"win-label\">${o.reached?'Objectif atteint':'Partie terminée'} · ${o.label}<\/div>\n    <div class=\"win-note\">${o.note}<small> / 20<\/small><\/div>\n    <div class=\"win-stats\">\n      <div class=\"win-stat\"><b>${o.score.toFixed(2)}<\/b><span>Points<\/span><\/div>\n      <div class=\"win-stat\"><b>${o.coups}<\/b><span>Coups<\/span><\/div>\n      <div class=\"win-stat\"><b>${o.time}<\/b><span>Temps<\/span><\/div>\n    <\/div>\n    <div class=\"win-foot\">${o.reached?`Objectif : ${o.baseline} coups · −${o.noteLoss} pt par tranche de ${o.notePer} coups au-delà`:`Atteins 20 points pour décrocher la note maximale.`}<\/div>\n    <div class=\"win-actions\">\n      <button class=\"btn-main\" onclick=\"diff=null;menuTimer();render();saveState()\">↻ Rejouer<\/button>\n      <button class=\"btn-ghost\" onclick=\"askReset()\">🔒 Réinitialiser<\/button>\n    <\/div>\n  <\/div><\/div>`;\n}\n\nconst LV_CFG={\n  chip:'🌐 Quiz · Adressage IP &amp; Classes',\n  sub:'Trouve la classe, le masque, le réseau, le broadcast et les hôtes de chaque adresse.',\n  ui:{\n    d1:{emoji:'🌱',tag:'Pour bien démarrer',feat:['Classe, masque, réseau, broadcast, 1er et dernier hôte','IP colorée : réseau en bleu, hôte en vert','Indices écrits dans les cases']},\n    d2:{emoji:'⚡',tag:'On enlève les aides',feat:['Mêmes questions, sans couleurs ni indices','+ Question bonus : le n-ième hôte utilisable','Bonne réponse affichée après une erreur']},\n    d3:{emoji:'🔥',tag:'Pour les experts',feat:['Sans couleurs ni indices','+ Masque en CIDR (/8, /16, /24)','+ Adresse publique ou privée ?','+ Question bonus : le n-ième hôte utilisable']}\n  }\n};\n\nfunction render(){\n  const app=document.getElementById('app');\n\n  if(!diff){app.innerHTML=levelScreenHTML(LV_CFG);saveState();return;}\n\n  if(won||finished){\n    const baseline=Math.round(20/diff.gain);\n    const extra=Math.max(0,coups-baseline);\n    const penalty=diff.noteLoss*Math.floor(extra/diff.notePer);\n    const reached=score>=20;\n    const note=reached?Math.max(0,20-penalty):fmt(Math.round(score*2)/2);\n    app.innerHTML=winScreenHTML({reached,note,baseline,coups,score,label:diff.label,time:fmtTime(getElapsed()),noteLoss:diff.noteLoss,notePer:diff.notePer});\n    saveState();return;\n  }\n\n  const pct=Math.min(100,(score/20)*100);\n  const ipStr=ip.oct.join('.');\n  const ipHtml=diff.key==='d1'?coloredIP(ip):ipStr;\n  const bonusCorrect=getNthHost(ip.oct,ip.cls,bonusN);\n  const done=validated;\n  const dk=diff.key;\n  const dcolor=dk==='d1'?'#34D399':dk==='d2'?'#FBBF24':'#F87171';\n  const dbg=dk==='d1'?'rgba(52,211,153,.14)':dk==='d2'?'rgba(251,191,36,.14)':'rgba(248,113,113,.14)';\n  const dtc=dk==='d1'?'#A7F3D0':dk==='d2'?'#FDE68A':'#FECACA';\n\n  let qCards=QUESTIONS.map((q,idx)=>{\n    const col=QCOLORS[q.id];\n    const val=(inputs[q.id]||'');\n    let cc,inputClass='q-input',ic='',hint='';\n    if(!done){\n      cc=val?'q-card filled':'q-card unanswered neon';\n      inputClass=val?'q-input filled':'q-input';\n    } else {\n      const ok=roundResult.details[q.id];\n      cc=ok?'q-card correct':'q-card wrong';\n      ic=ok?'✓ ':'✗ ';\n      inputClass=ok?'q-input correct':'q-input wrong';\n      if(!ok)hint=`<div class=\"q-hint\">→ ${answers[q.id]}<\/div>`;\n    }\n    let qlabel=q.label,cidrInput='',cidrHint='';\n    const isCidr=(q.id==='masque'&&diff.key==='d3');\n    if(isCidr){\n      qlabel='Masque par défaut';\n      const cval=(inputs.cidr||'');\n      let cClass='q-input';\n      if(!done){cClass=cval?'q-input filled':'q-input';}\n      else{const cok=roundResult.details.cidr;cClass=cok?'q-input correct':'q-input wrong';if(!cok)cidrHint=`<div class=\"q-hint\">→ CIDR ${answers.cidr}<\/div>`;}\n      cidrInput=`<div style=\"display:flex;flex-direction:column;gap:3px;flex:0 0 auto;align-items:center\"><span class=\"cidr-lbl\">CIDR<\/span><input class=\"${cClass}\" type=\"text\" placeholder=\"/…\" value=\"${cval}\" ${done?'disabled':''} style=\"width:70px;flex:0 0 auto;text-align:center\" oninput=\"upInput('cidr',this.value)\" onkeydown=\"hkey(event)\"><\/div>`;\n    }\n    return `<div class=\"${cc}\" style=\"--qc:${col.ub}\">\n      <div class=\"q-title\"><span class=\"q-num\">${idx+1}<\/span>${ic}${qlabel}<\/div>\n      <div class=\"q-row\" style=\"align-items:${isCidr?'flex-end':'center'}\">\n        <input class=\"${inputClass}\" type=\"text\" placeholder=\"${diff.key==='d1'?q.hint:''}\" value=\"${val}\" ${done?'disabled':''} oninput=\"upInput('${q.id}',this.value)\" onkeydown=\"hkey(event)\">${cidrInput}\n      <\/div>${hint}${cidrHint}\n    <\/div>`;\n  }).join('');\n\n  let bonusCard='';\n  if(diff.key!=='d1'){\n    const bval=bonusInput||'';\n    let bcc,bInputClass='q-input',bic='',bhint='';\n    if(!done){\n      bcc=bval?'q-card bonus filled':'q-card bonus unanswered neon';\n      bInputClass=bval?'q-input filled':'q-input';\n    } else {\n      const bok=roundResult.details.bonus;\n      bcc=bok?'q-card bonus correct':'q-card bonus wrong';\n      bic=bok?'✓ ':'✗ ';\n      bInputClass=bok?'q-input correct':'q-input wrong';\n      if(!bok&&diff.key==='d2')bhint=`<div class=\"q-hint\">→ ${bonusCorrect}<\/div>`;\n    }\n    bonusCard=`<div class=\"${bcc}\" style=\"--qc:#FBBF24\">\n      <div class=\"q-title\"><span class=\"q-num\">★<\/span>${bic}${bonusN}ème hôte utilisable ?<\/div>\n      <div class=\"q-row\"><input class=\"${bInputClass}\" type=\"text\" placeholder=\"\" value=\"${bval}\" ${done?'disabled':''} oninput=\"upBonus(this.value)\" onkeydown=\"hkey(event)\"><\/div>${bhint}\n    <\/div>`;\n  }\n\n  let visCard='';\n  if(diff.key==='d3'){\n    const vval=(inputs.visibilite||'');\n    let vcc='q-card bonus unanswered',vic='',pubCls='vis-opt',privCls='vis-opt';\n    if(!done){\n      vcc=vval?'q-card bonus filled':'q-card bonus unanswered neon';\n      if(vval==='publique')pubCls+=' sel';\n      if(vval==='privée')privCls+=' sel';\n    } else {\n      const vok=roundResult.details.visibilite;\n      vcc=vok?'q-card bonus correct':'q-card bonus wrong';\n      vic=vok?'✓ ':'✗ ';\n      const correct=answers.visibilite;\n      if(vval==='publique')pubCls+=(correct==='publique'?' correct':' wrong');\n      if(vval==='privée')privCls+=(correct==='privée'?' correct':' wrong');\n      if(!vok){if(correct==='publique')pubCls+=' correct';else privCls+=' correct';}\n    }\n    const dis=done?'disabled':'';\n    visCard=`<div class=\"${vcc}\" style=\"--qc:#A78BFA\">\n      <div class=\"q-title\"><span class=\"q-num\">?<\/span>${vic}Adresse publique ou privée ?<\/div>\n      <div class=\"vis-choice\">\n        <button class=\"${pubCls}\" ${dis} onclick=\"chooseVis('publique')\">🌍 Publique<\/button>\n        <button class=\"${privCls}\" ${dis} onclick=\"chooseVis('privée')\">🏠 Privée<\/button>\n      <\/div>\n    <\/div>`;\n  }\n\n  let bottomHtml='';\n  if(!done){\n    bottomHtml=`${isAdmin()?'<button class=\"validate-btn\" style=\"background:#7C3AED;color:#fff\" onclick=\"adminFill()\">🛠 Correction (admin)<\/button>':''}<button id=\"vbtn\" class=\"validate-btn\" style=\"background:${dcolor}\" onclick=\"validate()\" disabled>✔ Valider toutes les réponses<\/button>`;\n  } else {\n    const rr=roundResult;\n    bottomHtml=`<div class=\"result-row\">\n      <div class=\"result-banner ${rr.allOk?'win':'lose'}\">\n        <span class=\"result-txt\">${rr.allOk?'Parfait ! Toutes les réponses sont correctes !':rr.errCount+' erreur'+(rr.errCount>1?'s':'')+' — prends le temps de voir tes erreurs'}<\/span>\n        <span class=\"result-pts\">${rr.allOk?'+'+diff.gain:'−'+diff.perte} pt<\/span>\n      <\/div>\n      <button class=\"next-btn\" onclick=\"nextIP()\">IP suivante →<\/button>\n    <\/div>`;\n  }\n\n  app.innerHTML=`\n    <div class=\"hud\">\n      <div class=\"hud-tile\"><span class=\"hud-k\">Score<\/span><span class=\"hud-v score\">${score.toFixed(2)}<\/span><\/div>\n      <div class=\"hud-prog\">\n        <div class=\"hud-bar\"><i style=\"width:${pct.toFixed(1)}%;background:${dcolor}\"><\/i><\/div>\n        <div class=\"hud-ticks\"><span>0<\/span><span>5<\/span><span>10<\/span><span>15<\/span><span>20<\/span><\/div>\n      <\/div>\n      <span class=\"lvl-pill\" style=\"color:${dtc};background:${dbg};border-color:${dcolor}\">${diff.label} · +${diff.gain} / −${diff.perte}<\/span>\n      <div class=\"hud-tile\"><span class=\"hud-k\">Objectif<\/span><span class=\"hud-v dim\">20<\/span><\/div>\n      <div class=\"hud-tile\"><span class=\"hud-k\">Temps<\/span><span class=\"hud-v timer-val\">${fmtTime(getElapsed())}<\/span><\/div>\n    <\/div>\n    <div class=\"board\">\n      <aside class=\"ip-card\">\n        <div class=\"ip-top\"><span class=\"cls-badge cls-${ip.cls}\">${done?'Classe '+ip.cls:'Classe ?'}<\/span><\/div>\n        <div class=\"screen\"><div class=\"screen-lbl\">Adresse IP du poste<\/div><div class=\"ip-addr\">${ipHtml}<\/div><\/div>\n        ${diff.key==='d1'?'<div class=\"legend\"><span><i style=\"background:#60A5FA\"><\/i>Réseau<\/span><span><i style=\"background:#6EE7B7\"><\/i>Hôte<\/span><\/div>':''}\n        <div class=\"rules\"><span class=\"r-up\">Tout juste +${diff.gain}<\/span><span class=\"r-down\">Erreur −${diff.perte}<\/span><span class=\"r-down\">Nouvelle IP −${diff.perte}<\/span><\/div>\n        <div class=\"acts\">\n          <button class=\"act act-main\" onclick=\"newIP()\">🔄 Nouvelle IP (−${diff.perte} pt)<\/button>\n          <button class=\"act act-blue\" onclick=\"finishGame()\">🏁 Finir &amp; voir la note<\/button>\n          <button class=\"act act-gold\" onclick=\"changeLevel()\">🎚 Changer de niveau · chrono 0<\/button>\n          <button class=\"act act-rose\" onclick=\"askReset()\">🔒 Réinitialiser<\/button>\n          ${lockedIn?'':`<button class=\"act\" onclick=\"goBack()\">← Changer de mode<\/button>`}\n        <\/div>\n      <\/aside>\n      <section class=\"q-grid\">${qCards}${visCard}${bonusCard}<\/section>\n    <\/div>\n    <div class=\"bottom\">${bottomHtml}<\/div>\n  `;\n\n  if(!done){const b=document.getElementById('vbtn');if(b)b.disabled=!allFilled();}\n  saveState();\n}\n\nloadState();\nif(!diff)menuTimer();\nrender();\n<\/script>\n<\/body>\n<\/html>\n";
