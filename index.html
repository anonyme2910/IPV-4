<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPv4 — Accueil</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#050810;font-family:'JetBrains Mono',monospace;color:#e8f0ff}

/* ───────── ACCUEIL ───────── */
#home{
  position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2.8rem;padding:1.5rem;overflow:auto;
  background:
    radial-gradient(ellipse 60% 55% at 15% 15%,rgba(0,136,204,.28) 0%,transparent 70%),
    radial-gradient(ellipse 55% 55% at 88% 85%,rgba(119,34,204,.30) 0%,transparent 70%),
    radial-gradient(ellipse 40% 40% at 50% 50%,rgba(0,255,157,.06) 0%,transparent 70%),
    #050810;
}
#bg{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#home .hero,#home .choices{position:relative;z-index:1}
#home.hidden{display:none}
.hero{text-align:center}
.tag{font-size:.62rem;letter-spacing:.4em;color:#ffb020;text-transform:uppercase;margin-bottom:.8rem;opacity:.85}
.title{font-family:sans-serif;font-size:clamp(3rem,10vw,6rem);font-weight:800;letter-spacing:-.03em;line-height:.95;color:#fff}
.title span{color:#ffb020;text-shadow:0 0 40px rgba(255,176,32,.5)}
.sub{font-size:.78rem;color:#8aabcc;letter-spacing:.05em;margin-top:1rem}
.line{width:120px;height:1px;background:linear-gradient(90deg,transparent,#ffb020,transparent);margin:1rem auto 0}

.choices{display:grid;grid-template-columns:1fr 1fr;gap:1.4rem;width:100%;max-width:760px}
@media(max-width:620px){.choices{grid-template-columns:1fr}}
.choice{
  position:relative;overflow:hidden;cursor:pointer;text-align:left;font-family:inherit;color:inherit;
  background:#0a0f1e;border:1px solid #1a2540;border-radius:18px;padding:2rem 1.8rem;
  display:flex;flex-direction:column;gap:.7rem;
  transition:transform .3s,border-color .3s,box-shadow .3s;
}
.choice::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--a),var(--b));opacity:.07;transition:opacity .3s}
.choice::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--b),transparent)}
.choice:hover{transform:translateY(-6px);border-color:var(--b);box-shadow:0 22px 50px rgba(0,0,0,.5),0 0 34px var(--g)}
.choice:hover::before{opacity:.16}
.choice>*{position:relative;z-index:1}
.c-cours{--a:#00a86b;--b:#00e5a0;--g:rgba(0,229,160,.22)}
.c-quiz{--a:#c2185b;--b:#ff4d8d;--g:rgba(255,77,141,.22)}
.c-icon{font-size:2.6rem;line-height:1}
.c-name{font-family:sans-serif;font-size:2.2rem;font-weight:900;letter-spacing:.04em;color:var(--b)}
.c-desc{font-size:.72rem;line-height:1.6;color:#8aabcc}
.c-go{margin-top:.4rem;font-size:.68rem;font-weight:700;letter-spacing:.18em;color:var(--b)}

/* ───────── PAGES COURS / QUIZ ───────── */
.page{position:fixed;inset:0;display:none;background:#050810}
.page.on{display:block}
/* fine bande à gauche : la page ne perd que de la largeur (jamais de hauteur) */
.rail{position:absolute;top:0;left:0;bottom:0;width:46px;display:flex;flex-direction:column;align-items:center;padding-top:8px;gap:10px;background:#050810;border-right:1px solid #1a2540}
.back{
  width:34px;height:34px;border-radius:50%;cursor:pointer;border:1px solid #243050;background:#0a0f1e;color:#e8f0ff;
  font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s,border-color .15s;
}
.back:hover{background:#00d4ff;color:#050810;border-color:#00d4ff}
.rail-label{writing-mode:vertical-rl;transform:rotate(180deg);font-size:.6rem;letter-spacing:.3em;color:#5a7399;text-transform:uppercase;user-select:none}
.page iframe{position:absolute;top:0;left:46px;width:calc(100% - 46px);height:100%;border:0;background:#050810}

/* ───────── MULTIJOUEUR ───────── */
.c-multi{--a:#d98a00;--b:#ffb020;--g:rgba(255,176,32,.22);grid-column:1/-1;flex-direction:row;align-items:center;gap:1.2rem;padding:1.3rem 1.8rem}
@media(max-width:620px){.c-multi{flex-direction:column;align-items:flex-start}}
.c-multi .c-name{font-size:1.6rem}
.c-multi .c-txt{display:flex;flex-direction:column;gap:.35rem;flex:1}
.c-multi .c-go{margin-top:0;white-space:nowrap}
#mp-modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(3,6,14,.78)}
#mp-modal.show{display:flex}
.mp-box{width:100%;max-width:400px;background:#0a0f1e;border:1px solid #243050;border-radius:18px;padding:1.6rem;display:flex;flex-direction:column;gap:.9rem;box-shadow:0 22px 60px rgba(0,0,0,.6);font-family:'JetBrains Mono',monospace}
.mp-title{font-family:sans-serif;font-size:1.4rem;font-weight:900;color:#ffb020;letter-spacing:.04em}
.mp-txt{font-size:.74rem;line-height:1.6;color:#8aabcc}
.mp-btn{font-family:inherit;font-size:.8rem;font-weight:700;cursor:pointer;border-radius:12px;border:1px solid #243050;background:#0f1730;color:#e8f0ff;padding:.85rem 1rem;transition:background .15s,border-color .15s}
.mp-btn:hover{background:#16224a;border-color:#ffb020}
.mp-btn.main{background:#ffb020;color:#050810;border-color:#ffb020}
.mp-btn.main:hover{background:#ffc552}
.mp-btn:disabled{opacity:.45;cursor:default}
.mp-input{font-family:inherit;font-size:1rem;font-weight:700;border-radius:10px;border:1px solid #243050;background:#050810;color:#e8f0ff;padding:.7rem .9rem;width:100%}
.mp-input:focus{outline:none;border-color:#ffb020}
.mp-input.code{text-align:center;letter-spacing:.15em;text-transform:uppercase;font-size:1.1rem}
.mp-code{font-size:1.7rem;font-weight:700;letter-spacing:.18em;text-align:center;word-break:break-all;color:#ffb020;background:#050810;border:1px dashed #6b4a00;border-radius:12px;padding:.8rem .5rem;cursor:pointer;user-select:all}
.mp-players{display:flex;flex-direction:column;gap:.35rem;max-height:150px;overflow:auto}
.mp-player{font-size:.78rem;font-weight:700;background:rgba(255,255,255,.05);border-radius:8px;padding:.4rem .7rem;color:#cfe3f5}
.mp-err{font-size:.72rem;font-weight:700;color:#ff8a8a;min-height:1em}
.mp-row{display:flex;gap:.6rem}.mp-row>*{flex:1}

/* ───────── MODE SURVEILLÉ / RÉSULTATS ───────── */
.mp-box.wide{max-width:980px}
#mp-res{position:fixed;inset:0;z-index:61;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(3,6,14,.78)}
#mp-res.show{display:flex}
#mp-resbtn{position:fixed;left:4px;bottom:12px;z-index:55;width:38px;height:38px;border-radius:50%;border:1px solid #6b4a00;background:#0a0f1e;color:#ffb020;font-size:1.1rem;cursor:pointer;display:none;align-items:center;justify-content:center}
#mp-resbtn:hover{background:#16224a}
#mp-badge{position:fixed;top:6px;left:50%;transform:translateX(-50%);z-index:55;display:none;background:rgba(10,15,30,.92);border:1px solid #6b4a00;color:#ffb020;font:700 .68rem 'JetBrains Mono',monospace;padding:.35rem .8rem;border-radius:999px;pointer-events:none;white-space:nowrap}
#mp-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:70;display:none;max-width:90%;background:#3a1010;border:1px solid #ff8a8a;color:#ffd0d0;font:700 .75rem 'JetBrains Mono',monospace;padding:.7rem 1rem;border-radius:12px;text-align:center}
.mp-tbl-wrap{overflow-x:auto}
.mp-tbl{width:100%;border-collapse:collapse;font-size:.7rem;color:#cfe3f5}
.mp-tbl th{text-align:left;color:#8aabcc;font-weight:700;padding:.4rem .5rem;border-bottom:1px solid #243050;white-space:nowrap}
.mp-tbl td{padding:.45rem .5rem;border-bottom:1px solid #131c36;white-space:nowrap}
.mp-tbl td.bad{color:#ff8a8a;font-weight:700}
.mp-chk{display:flex;gap:.6rem;align-items:flex-start;font-size:.72rem;color:#cfe3f5;line-height:1.5;cursor:pointer}
.mp-chk span{color:#8aabcc}

.mp-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:.45rem;vertical-align:middle}
.mp-cell{display:inline-block;font-weight:700;border-radius:8px;padding:.35rem .6rem;text-align:left}
.mp-sub{display:block;font-size:.62rem;font-weight:600;opacity:.92;margin-top:.15rem}
.mp-cell small{opacity:.8;font-weight:600;margin-left:.3rem}

#mp-res.full{padding:0;background:#050810}
#mp-res.full .mp-box{max-width:none;width:100%;height:100%;border-radius:0;border:0;box-shadow:none;overflow:auto;padding:1.2rem 1.8rem}
#mp-res.full .mp-tbl-wrap{flex:1}
#mp-res.full .mp-title{font-size:1.9rem}
#mp-res.full .mp-txt{font-size:.85rem}
#mp-res.full .mp-tbl{font-size:1rem}
#mp-res.full .mp-tbl th{padding:.8rem .9rem;font-size:.85rem}
#mp-res.full .mp-tbl td{padding:.75rem .9rem}
#mp-res.full .mp-cell{font-size:1.05rem;padding:.5rem 1rem}
.mp-head{display:flex;align-items:center;justify-content:space-between;gap:.8rem;flex-wrap:wrap}
.mp-tools{display:flex;gap:.5rem;flex-wrap:wrap}
.mp-tools .mp-btn{padding:.55rem .9rem;white-space:nowrap}

/* ───────── EXPORT (flèche) + EXPULSION ───────── */
.mp-split{display:flex}
.mp-tools .mp-split .mp-btn:first-child{border-radius:12px 0 0 12px}
.mp-tools .mp-split .mp-arrow{border-radius:0 12px 12px 0;border-left:1px solid #6b4a00;padding:.55rem .65rem}
.mp-kick{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;margin-left:.6rem;padding:0;border:1px solid #ff6b6b;border-radius:8px;background:rgba(255,80,80,.14);color:#ff8a8a;cursor:pointer;vertical-align:middle}
.mp-kick:hover{background:#ff5050;color:#fff}
.mp-player.has-kick{display:flex;align-items:center;justify-content:space-between}
</style>
</head>
<body>

<!-- ACCUEIL -->
<div id="home">
  <canvas id="bg"></canvas>
  <div class="hero">
    <p class="tag">Réseaux · Adressage IPv4</p>
    <h1 class="title">IP<span>v4</span></h1>
    <p class="sub">Choisis ce que tu veux faire</p>
    <div class="line"></div>
  </div>

  <div class="choices">
    <button class="choice c-cours" onclick="openPage('cours')">
      <div class="c-icon">🛜 🧑‍🏫</div>
      <div class="c-name">COURS</div>
      <div class="c-desc">Classes A, B, C, binaire, masques, adresses privées — explore tout de façon interactive.</div>
      <div class="c-go">OUVRIR →</div>
    </button>
    <button class="choice c-quiz" onclick="openPage('quiz')">
      <div class="c-icon">🧑‍💻 🪪</div>
      <div class="c-name">QUIZ</div>
      <div class="c-desc">Entraîne-toi : classe, masque, réseau, broadcast, premier et dernier hôte.</div>
      <div class="c-go">COMMENCER →</div>
    </button>
    <button class="choice c-multi" onclick="mpOpen()">
      <div class="c-icon">👥</div>
      <div class="c-txt">
        <div class="c-name">MULTIJOUEUR</div>
        <div class="c-desc">Crée une partie et partage le code, ou rejoins celle d'un ami avec son code.</div>
      </div>
      <div class="c-go">CRÉER / REJOINDRE →</div>
    </button>
  </div>
</div>

<!-- MULTIJOUEUR -->
<div id="mp-modal"><div class="mp-box" id="mp-box"></div></div>
<div id="mp-res"><div class="mp-box wide" id="mp-resbox"></div></div>
<button id="mp-resbtn" title="Résultats des joueurs" onclick="mpResOpen()">📊</button>
<div id="mp-badge"></div>
<div id="mp-toast"></div>

<!-- COURS -->
<div class="page" id="page-cours">
  <div class="rail"><button class="back" id="back-cours" onclick="backCours()" title="Retour à l'accueil">←</button><span class="rail-label" id="label-cours">Accueil</span></div>
  <iframe id="f-cours" title="Cours IPv4"></iframe>
</div>

<!-- QUIZ -->
<div class="page" id="page-quiz">
  <div class="rail"><button class="back" onclick="backQuiz()" title="Retour à l'accueil">←</button><span class="rail-label">Accueil</span></div>
  <iframe id="f-quiz" title="Quiz IPv4"></iframe>
</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
/* ───────── MULTIJOUEUR : créer / rejoindre une partie avec un code ───────── */
const MP_PREFIX='ipv4quiz-';
const MP_CHARS='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const MP_OPTS={debug:0,config:{iceServers:[
  {urls:'stun:stun.l.google.com:19302'},
  {urls:'stun:global.stun.twilio.com:3478'},
  {urls:'turn:openrelay.metered.ca:80',username:'openrelayproject',credential:'openrelayproject'},
  {urls:'turn:openrelay.metered.ca:443',username:'openrelayproject',credential:'openrelayproject'},
  {urls:'turn:openrelay.metered.ca:443?transport=tcp',username:'openrelayproject',credential:'openrelayproject'},
  {urls:'turn:staticauth.openrelay.metered.ca:80',username:'openrelayproject',credential:'openrelayprojectsecret'},
  {urls:'turn:staticauth.openrelay.metered.ca:443',username:'openrelayproject',credential:'openrelayprojectsecret'},
  {urls:'turn:staticauth.openrelay.metered.ca:443?transport=tcp',username:'openrelayproject',credential:'openrelayprojectsecret'},
  {urls:'turns:staticauth.openrelay.metered.ca:443?transport=tcp',username:'openrelayproject',credential:'openrelayprojectsecret'},
  {urls:'turn:freestun.net:3478',username:'free',credential:'free'},
  {urls:'turns:freestun.net:5349',username:'free',credential:'free'}
]}};
let mp={peer:null,role:null,code:'',name:'',conns:[],hostConn:null,players:[],results:{},exam:false,started:false,exits:0,away:0,hiddenAt:0,tick:null,done:{},lv:{},curLevel:null,hiddenLevel:null,state:'salon',lastSig:'',lastSend:0,forceSend:false,kicked:{}};

function mpBox(h){document.getElementById('mp-box').innerHTML=h;}
function mpEsc(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function mpNorm(t){return String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,20);}
function mpGenCode(){let c='';for(let i=0;i<5;i++)c+=MP_CHARS[Math.floor(Math.random()*MP_CHARS.length)];return c;}
function mpClean(){
  try{clearInterval(mp.tick);}catch(e){}
  mpConfirmClose();mpDlClose();
  try{mp.conns.forEach(c=>c.close());}catch(e){}
  try{if(mp.hostConn)mp.hostConn.close();}catch(e){}
  try{if(mp.peer)mp.peer.destroy();}catch(e){}
  mp={peer:null,role:null,code:'',name:mp.name,wanted:mp.wanted,conns:[],hostConn:null,players:[],results:{},exam:false,started:false,exits:0,away:0,hiddenAt:0,tick:null,done:{},lv:{},curLevel:null,hiddenLevel:null,state:'salon',lastSig:'',lastSend:0,forceSend:false,kicked:{}};
  mpUi();
}
function mpOpen(){
  document.getElementById('mp-modal').classList.add('show');
  if(mp.started){mpRunning();return;}
  mpClean();
  mpMenu();
}
function mpHide(){document.getElementById('mp-modal').classList.remove('show');}
function mpRunning(){
  if(mp.role==='host'){
    mpBox(`<div class="mp-title">🎮 Partie ${mp.code}</div>
      <div class="mp-txt">Partie en cours — ${mp.conns.length} joueur(s) connecté(s). Mode surveillé : <b>${mp.exam?'activé':'désactivé'}</b>.</div>
      <button class="mp-btn main" onclick="mpHide();mpResOpen()">📊 Voir les résultats</button>
      <button class="mp-btn" onclick="mpClose()">⛔ Terminer la partie (déconnecte tout le monde)</button>
      <button class="mp-btn" onclick="mpHide()">Fermer</button>`);
  }else{
    const locked=mpLocked();
    mpBox(`<div class="mp-title">🎮 Partie ${mp.code}</div>
      <div class="mp-txt">${locked?'🔒 Mode surveillé : tu ne peux pas quitter la partie avant d\'avoir terminé le Quiz.':'Tu es connecté à la partie.'}</div>
      ${locked?'':'<button class="mp-btn" onclick="mpClose()">Quitter la partie</button>'}
      <button class="mp-btn" onclick="mpHide()">Fermer</button>`);
  }
}
function mpClose(){mpClean();document.getElementById('mp-modal').classList.remove('show');}
function mpMenu(err){
  mpBox(`<div class="mp-title">👥 Multijoueur</div>
    <div class="mp-txt">Que veux-tu faire ?</div>
    <div class="mp-err" id="mp-err">${err?mpEsc(err):''}</div>
    <button class="mp-btn main" onclick="mpCreateForm()">➕ Créer une partie</button>
    <button class="mp-btn" onclick="mpJoinForm()">🔑 Rejoindre une partie</button>
    <button class="mp-btn" onclick="mpClose()">Annuler</button>`);
}
function mpCreateForm(err){
  mpBox(`<div class="mp-title">➕ Créer une partie</div>
    <div class="mp-txt">Choisis ton pseudo :</div>
    <input class="mp-input" id="mp-name" maxlength="16" placeholder="Ton pseudo" value="${mpEsc(mp.name||'')}">
    <div class="mp-txt">Crée le code de ta partie (3 à 20 lettres/chiffres, espaces et accents ignorés) ou laisse vide pour un code automatique :</div>
    <input class="mp-input code" id="mp-gamename" maxlength="30" placeholder="Code de la partie" autocomplete="off" value="${mpEsc(mp.wanted||'')}" onkeydown="if(event.key==='Enter')mpCreate()">
    <div class="mp-err" id="mp-err">${err?mpEsc(err):''}</div>
    <button class="mp-btn main" onclick="mpCreate()">Créer la partie</button>
    <button class="mp-btn" onclick="mpMenu()">← Retour</button>`);
}
function mpGetName(){
  const v=(document.getElementById('mp-name')||{}).value||'';
  mp.name=v.trim()||'Joueur'+Math.floor(Math.random()*90+10);
  return mp.name;
}
function mpErr(t){const e=document.getElementById('mp-err');if(e)e.textContent=t;}


/* ───────── MODE SURVEILLÉ + RÉSULTATS + NIVEAUX UNIQUES ───────── */
const MP_Q=`(function(){
 if(typeof diff==='undefined')return null;
 if(!diff)return{state:'menu'};
 const done=won||finished;
 const baseline=Math.round(20/diff.gain);
 const extra=Math.max(0,coups-baseline);
 const penalty=diff.noteLoss*Math.floor(extra/diff.notePer);
 const reached=score>=20;
 const note=reached?Math.max(0,20-penalty):fmt(Math.round(score*2)/2);
 return{state:done?'done':'run',level:diff.label,score:score,coups:coups,note:done?note:null,time:getElapsed(),locked:lockedIn};
})()`;
const MP_LEVELS=['Facile','Moyen','Difficile'];
const MP_PAL=[
  {bg:'#8b5cf6',fg:'#ffffff'},{bg:'#22c55e',fg:'#052e14'},{bg:'#3b82f6',fg:'#ffffff'},{bg:'#f97316',fg:'#2a1200'},
  {bg:'#ec4899',fg:'#ffffff'},{bg:'#06b6d4',fg:'#03262d'},{bg:'#eab308',fg:'#2a2000'},{bg:'#ef4444',fg:'#ffffff'}
];
const MP_LBL={salon:'Au salon',menu:'Au menu',run:'En cours',done:'Niveau terminé'};
function mpFmt(ms){const s=Math.floor((ms||0)/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function mpRead(){try{return document.getElementById('f-quiz').contentWindow.eval(MP_Q);}catch(e){return null;}}
function mpToast(t){const e=document.getElementById('mp-toast');if(!e)return;e.textContent=t;e.style.display='block';clearTimeout(mpToast._t);mpToast._t=setTimeout(()=>{e.style.display='none';},3500);}
function mpDoneCount(){return Object.keys(mp.done).length;}
/* surveillé = verrouillé tant qu'un niveau est en cours, ou tant qu'aucun niveau n'a été terminé */
function mpIsLocked(){return !(mpDoneCount()>0&&mp.state!=='run');}
function mpLocked(){
  if(!(mp.role==='guest'&&mp.started&&mp.exam))return false;
  mpScan();
  return mpIsLocked();
}
function mpUi(){
  const rb=document.getElementById('mp-resbtn');
  if(rb)rb.style.display=(mp.role==='host'&&mp.started)?'flex':'none';
  const b=document.getElementById('mp-badge');
  if(b){
    const on=mp.role==='guest'&&mp.started&&mp.exam;
    b.style.display=on?'block':'none';
    if(on)b.textContent=mpIsLocked()?'🔒 Mode surveillé · sorties de page : '+mp.exits:'✅ '+mpDoneCount()+' niveau(x) terminé(s) · sorties de page : '+mp.exits;
  }
}

/* ----- invité : un niveau = une seule fois, pas de changement après validation ----- */
function mpGuard(){
  if(mp.role!=='guest'||!mp.started)return;
  let w;try{w=document.getElementById('f-quiz').contentWindow;}catch(e){return;}
  if(!w||typeof w.chooseDiff!=='function'||!w.document||!w.document.getElementById('app'))return;
  if(!w.__mpg){
    w.__mpg=true;
    const oc=w.chooseDiff,ol=w.changeLevel;
    w.chooseDiff=function(d){
      if(mp.role==='guest'&&mp.started&&d&&mp.done[d.label]){mpToast('Tu as déjà fait le niveau '+d.label+' : choisis un autre niveau.');return;}
      return oc.apply(this,arguments);
    };
    w.changeLevel=function(){
      if(mp.role==='guest'&&mp.started){
        let lk=false;try{lk=!!w.eval('lockedIn&&!won&&!finished');}catch(e){}
        if(lk){mpToast('Tu as déjà validé une réponse : impossible de changer de niveau.');return;}
      }
      return ol.apply(this,arguments);
    };

let _mpCrcT=null;
function mpCrc(u8){
  if(!_mpCrcT){_mpCrcT=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;_mpCrcT[n]=c>>>0;}}

  return (crc^0xFFFFFFFF)>>>0;
}
function mpZip(files){
  const enc=new TextEncoder(),parts=[],cen=[];let off=0;

  const dd=((now.getFullYear()-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate();
  files.forEach(f=>{
    const nm=enc.encode(f.name),data=enc.encode(f.text),crc=mpCrc(data),sz=data.length;
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);
    h.setUint16(10,dt,true);h.setUint16(12,dd,true);h.setUint32(14,crc,true);h.setUint32(18,sz,true);h.setUint32(22,sz,true);
    h.setUint16(26,nm.length,true);h.setUint16(28,0,true);
    parts.push(new Uint8Array(h.buffer),nm,data);
    const c=new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);
    c.setUint16(12,dt,true);c.setUint16(14,dd,true);c.setUint32(16,crc,true);c.setUint32(20,sz,true);c.setUint32(24,sz,true);
    c.setUint16(28,nm.length,true);c.setUint16(30,0,true);c.setUint16(32,0,true);c.setUint16(34,0,true);c.setUint16(36,0,true);
    c.setUint32(38,0,true);c.setUint32(42,off,true);
    cen.push(new Uint8Array(c.buffer),nm);
    off+=30+nm.length+sz;
  });
  const cenSize=cen.reduce((a,b)=>a+b.length,0);
  const e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(4,0,true);e.setUint16(6,0,true);
  e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);
  e.setUint32(12,cenSize,true);e.setUint32(16,off,true);e.setUint16(20,0,true);

}

/* ----- export PDF (même présentation que l'Excel, sans bibliothèque) ----- */
const MP_HW=[278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584];
function mpPdfClean(t){return String(t).replace(/[^\x20-\x7E\u00A0-\u00FF\u2013\u2014\u2019\u2026]/g,'');}
function mpPdfEsc(t){
  const map={0x2013:0x96,0x2014:0x97,0x2019:0x92,0x2026:0x85};
  let o='';
  for(const ch of mpPdfClean(t)){
    let c=ch.charCodeAt(0);if(map[c])c=map[c];
    if(c===40||c===41||c===92)o+='\\'+ch;
    else if(c>126||c<32)o+='\\'+c.toString(8).padStart(3,'0');
    else o+=ch;
  }
  return o;
}
function mpPdfW(t,size,bold){
  let w=0;
  for(const ch of mpPdfClean(t)){const c=ch.charCodeAt(0);w+=(c>=32&&c<=126)?MP_HW[c-32]:(c>=192&&c<=222?640:556);}
  return w*size/1000*(bold?1.06:1);
}
function mpPdfWrap(t,size,bold,maxw){
  const words=mpPdfClean(t).split(' '),lines=[];let cur='';
  words.forEach(w=>{
    const test=cur?cur+' '+w:w;
    if(mpPdfW(test,size,bold)<=maxw||!cur)cur=test;else{lines.push(cur);cur=w;}
  });
  if(cur)lines.push(cur);
  return lines;
}
function mpPdfFit(t,size,bold,maxw){
  t=mpPdfClean(t);
  if(mpPdfW(t,size,bold)<=maxw)return t;
  while(t.length>1&&mpPdfW(t+'...',size,bold)>maxw)t=t.slice(0,-1);
  return t+'...';
}
function mpPdf(){
  const PW=842,PH=595,M=20;
  const rgb=h=>{h=h.replace('#','');return [0,2,4].map(i=>(parseInt(h.substr(i,2),16)/255).toFixed(3)).join(' ');};
  const colW=[80,112,78,78,78,78,78,78,71,71];
  const colX=[];let ax=M;colW.forEach(w=>{colX.push(ax);ax+=w;});
  const ex=!!mp.exam;
  const pages=[];let cmds=null,y=0;
  const cell=(c0,c1,top,h,fill)=>{
    const x=colX[c0],w=colX[c1]+colW[c1]-x;
    cmds.push((fill?rgb(fill)+' rg ':'1 1 1 rg ')+x+' '+(PH-top-h)+' '+w+' '+h+' re f');
    cmds.push('0.75 G 0.5 w '+x+' '+(PH-top-h)+' '+w+' '+h+' re S');
  };
  const text=(t,c0,c1,top,h,size,bold,color)=>{
    const x=colX[c0],w=colX[c1]+colW[c1]-x;
    const lines=mpPdfWrap(t,size,bold,w-8).slice(0,3);
    const lh=size*1.2,start=top+h/2-(lines.length*lh)/2;
    lines.forEach((ln,k)=>{
      const tw=mpPdfW(ln,size,bold);
      cmds.push('BT /'+(bold?'F2':'F1')+' '+size+' Tf '+rgb(color)+' rg '+(x+(w-tw)/2).toFixed(2)+' '+(PH-(start+k*lh+size*0.95)).toFixed(2)+' Td ('+mpPdfEsc(ln)+') Tj ET');
    });
  };
  const header=()=>{
    const h=32;
    const names=['Joueur','État'];
    MP_LEVELS.forEach(l=>names.push(l+' – note /20',l+' – temps'));
    names.push('Total sorties de page','Total temps hors page');
    names.forEach((n,i)=>{cell(i,i,y,h,'#1f2937');text(n,i,i,y,h,8,true,'#ffffff');});
    y+=h;
  };
  const newPage=()=>{
    cmds=[];pages.push(cmds);
    cmds.push('BT /F2 16 Tf 0.07 0.09 0.15 rg '+M+' '+(PH-M-14)+' Td ('+mpPdfEsc('Résultats – partie '+mp.code)+') Tj ET');
    const sub='Mode surveillé : '+(ex?'activé':'désactivé')+'   ·   généré le '+new Date().toLocaleString('fr-FR');
    cmds.push('BT /F1 9 Tf 0.4 0.45 0.5 rg '+M+' '+(PH-M-30)+' Td ('+mpPdfEsc(sub)+') Tj ET');
    y=M+42;header();
  };
  newPage();
  const sortieTxt=n=>n+' sortie'+(n>1?'s':'')+' de page';
  Object.values(mp.results).forEach(e=>{
    const h1=ex?22:26,h2=ex?18:0,H=h1+h2;
    if(y+H>PH-M)newPage();
    const pal=MP_PAL[e.pi%MP_PAL.length],tint=mpTint(pal.bg),lv=e.levels||{};
    let st=MP_LBL[e.state]||e.state;
    if(e.state==='run')st+=' ('+e.level+')';
    if(e.disc)st+=' - déconnecté';
    cell(0,0,y,H,pal.bg);text(e.name,0,0,y,H,10,true,pal.fg);
    cell(1,1,y,H,'#ffffff');text(st,1,1,y,H,8.5,false,'#1f2937');
    MP_LEVELS.forEach((l,i)=>{
      const c=2+i*2,d=lv[l];
      if(d){
        cell(c,c,y,h1,pal.bg);text(String(d.note),c,c,y,h1,10,true,pal.fg);
        cell(c+1,c+1,y,h1,pal.bg);text(mpFmt(d.time),c+1,c+1,y,h1,10,true,pal.fg);
        if(ex){
          cell(c,c,y+h1,h2,tint);text(sortieTxt(d.exits||0),c,c,y+h1,h2,7.5,false,'#1f2937');
          cell(c+1,c+1,y+h1,h2,tint);text(mpFmt(d.away||0)+' hors page',c+1,c+1,y+h1,h2,7.5,false,'#1f2937');
        }
      }else{
        cell(c,c,y,h1,'#ffffff');cell(c+1,c+1,y,h1,'#ffffff');
        if(ex){cell(c,c,y+h1,h2,'#ffffff');cell(c+1,c+1,y+h1,h2,'#ffffff');}
      }
    });
    cell(8,8,y,H,'#ffffff');text(ex?String(e.exits||0):'—',8,8,y,H,10,true,'#1f2937');
    cell(9,9,y,H,'#ffffff');text(ex?mpFmt(e.away||0):'—',9,9,y,H,10,true,'#1f2937');
    y+=H;
  });
  /* assemblage du fichier PDF */
  let out='%PDF-1.4\n';const offs=[];
  const add=body=>{offs.push(out.length);out+=offs.length+' 0 obj\n'+body+'\nendobj\n';};
  const kids=pages.map((_,k)=>(5+2*k)+' 0 R').join(' ');
  add('<< /Type /Catalog /Pages 2 0 R >>');
  add('<< /Type /Pages /Kids ['+kids+'] /Count '+pages.length+' >>');
  add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
  add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
  pages.forEach((cm,k)=>{
    const content=cm.join('\n');
    add('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+PW+' '+PH+'] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents '+(6+2*k)+' 0 R >>');
    add('<< /Length '+content.length+' >>\nstream\n'+content+'\nendstream');
  });
  const xr=out.length;
  out+='xref\n0 '+(offs.length+1)+'\n0000000000 65535 f \n'+offs.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('');
  out+='trailer\n<< /Size '+(offs.length+1)+' /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF';
  const u8=new Uint8Array(out.length);for(let i=0;i<out.length;i++)u8[i]=out.charCodeAt(i)&255;
  return new Blob([u8],{type:'application/pdf'});
}
function mpPdfDownload(){
  try{
    const blob=mpPdf(),a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download='resultats-'+(mp.code||'partie')+'.pdf';
    document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
  }catch(e){mpToast('Téléchargement impossible : '+e.message);}
}

/* ----- expulsion d'un joueur (avec confirmation) ----- */
function mpConfirmClose(){const o=document.getElementById('mp-confirm');if(o)o.remove();}
function mpAskKick(id){
  if(mp.role!=='host')return;
  const c=mp.conns.find(x=>x.peer===id),e=mp.results[id];
  const name=c?c._name:(e?e.name:'ce joueur');
  const res=document.getElementById('mp-res');
  const host=(res&&res.classList.contains('show'))?res:document.getElementById('mp-modal');
  mpConfirmClose();
  const o=document.createElement('div');o.id='mp-confirm';
  o.style.cssText='position:fixed;inset:0;z-index:96;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(3,6,14,.75)';
  o.innerHTML='<div class="mp-box"><div class="mp-title">🗑 Supprimer ce joueur ?</div><div class="mp-txt">Voulez-vous vraiment supprimer ce joueur ?<br><b style="color:#ffb020;font-size:.95rem">'+mpEsc(name)+'</b><br>Il sera expulsé immédiatement de la partie.</div><div class="mp-row"><button class="mp-btn" onclick="mpConfirmClose()">Annuler</button><button class="mp-btn main" onclick="mpKick(\''+mpEsc(id)+'\');mpConfirmClose()">🗑 Oui, supprimer</button></div></div>';
  host.appendChild(o);
}
function mpKick(id){
  if(mp.role!=='host')return;
  const c=mp.conns.find(x=>x.peer===id);
  const name=c?c._name:((mp.results[id]||{}).name||'');
  if(name)mp.kicked[name.toLowerCase()]=1;
  if(c){
    try{c.send({t:'kick'});}catch(e){}
    mp.conns=mp.conns.filter(x=>x!==c);
    setTimeout(()=>{try{c.close();}catch(e){}},300);
  }
  delete mp.results[id];
  mpBroadcastPlayers();
  mpRenderRes();
}
function mpKicked(){
  const n=mp.name;mpClean();mp.name=n;
  try{goHome();}catch(e){}
  document.getElementById('mp-modal').classList.add('show');
  mpMenu('Tu as été expulsé de la partie par le créateur.');
}

/* ----- CRÉER ----- */
function mpCreate(tries){
  if(typeof Peer==='undefined'){mpErr("Connexion impossible : vérifie ta connexion internet.");return;}
  mpGetName();
  const gn=document.getElementById('mp-gamename');
  if(gn)mp.wanted=gn.value;
  const custom=mpNorm(mp.wanted);
  if((mp.wanted||'').trim()&&custom.length<3){mpErr('Le nom doit faire au moins 3 lettres ou chiffres.');return;}
  const keepName=mp.name,keepWanted=mp.wanted;
  mpClean();mp.name=keepName;mp.wanted=keepWanted;
  tries=tries||0;
  const code=custom||mpGenCode();
  const peer=new Peer(MP_PREFIX+code,MP_OPTS);
  peer.on('disconnected',()=>{try{if(!peer.destroyed)peer.reconnect();}catch(e){}});
  mp.peer=peer;mp.role='host';mp.code=code;mp.players=[mp.name];
  peer.on('open',()=>mpHostLobby());
  peer.on('error',e=>{
    if(e.type==='unavailable-id'){
      if(custom){mpCreateForm('Ce code est déjà utilisé par une autre partie, choisis-en un autre.');return;}
      if(tries<5){mpCreate(tries+1);return;}
    }
    mpCreateForm("Impossible de créer la partie ("+e.type+").");
  });
  peer.on('connection',conn=>{
    conn.on('data',d=>{
      if(!d)return;
      if(d.t==='hello'){
        conn._name=String(d.name||'Joueur').slice(0,16);
        if(mp.kicked[conn._name.toLowerCase()]){try{conn.send({t:'kick'});}catch(x){}setTimeout(()=>{try{conn.close();}catch(x){}},300);return;}
        if(mp.conns.indexOf(conn)<0)mp.conns.push(conn);
        const e=mpEntry(conn);e.name=conn._name;e.disc=false;
        if(mp.started){try{conn.send({t:'start',exam:!!mp.exam});}catch(x){}}
        mpBroadcastPlayers();mpRenderRes();
      }else if(d.t==='status'){
        const e=mpEntry(conn);
        Object.assign(e,{state:d.state,level:d.level,score:d.score,coups:d.coups,note:d.note,time:d.time,exits:d.exits,away:d.away,levels:d.levels||{}});
        mpRenderRes();
      }
    });
    conn.on('close',()=>{
      mp.conns=mp.conns.filter(c=>c!==conn);
      if(mp.results[conn.peer])mp.results[conn.peer].disc=true;
      mpBroadcastPlayers();mpRenderRes();
    });
  });
}
function mpBroadcastPlayers(){
  mp.players=[mp.name].concat(mp.conns.map(c=>c._name));
  mp.conns.forEach(c=>{try{c.send({t:'players',list:mp.players});}catch(e){}});
  mpHostLobby();
}
function mpHostLobby(){
  if(mp.role!=='host'||mp.started)return;
  mpBox(`<div class="mp-title">🎮 Ta partie</div>
    <div class="mp-txt">Donne ce code à tes amis (clique dessus pour le copier) :</div>
    <div class="mp-code" onclick="mpCopy()" id="mp-code">${mp.code}</div>
    <div class="mp-txt">Joueurs connectés (${mp.players.length}) :</div>
    <div class="mp-players">${mp.players.map((n,i)=>{const c=i>0?mp.conns[i-1]:null;return `<div class="mp-player has-kick"${c?` oncontextmenu="event.preventDefault();mpAskKick('${mpEsc(c.peer)}')"`:''}><span>${i===0?'👑 ':'🧑 '}${mpEsc(n)}</span>${c?`<button class="mp-kick" title="Expulser ce joueur" onclick="mpAskKick('${mpEsc(c.peer)}')"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/></svg></button>`:''}</div>`;}).join('')}</div>
    <label class="mp-chk"><input type="checkbox" ${mp.exam?'checked':''} onchange="mp.exam=this.checked"><div>🔒 Mode surveillé <span>— les joueurs ne peuvent pas quitter le Quiz avant d'avoir fini, et chaque sortie de la page est comptée.</span></div></label>
    <button class="mp-btn main" onclick="mpStart()">▶ Lancer le Quiz pour tout le monde</button>
    <button class="mp-btn" onclick="mpClose()">Annuler la partie</button>`);
}
function mpCopy(){try{navigator.clipboard.writeText(mp.code);const e=document.getElementById('mp-code');if(e){e.textContent='Copié ✓';setTimeout(()=>{if(document.getElementById('mp-code'))e.textContent=mp.code;},900);}}catch(e){}}
function mpStart(){
  mp.started=true;
  mp.conns.forEach(c=>{mpEntry(c).state='menu';try{c.send({t:'start',exam:!!mp.exam});}catch(e){}});
  document.getElementById('mp-modal').classList.remove('show');
  mpUi();
  openPage('quiz');
}

/* ----- REJOINDRE ----- */
function mpJoinForm(err){
  mpBox(`<div class="mp-title">🔑 Rejoindre une partie</div>
    <div class="mp-txt">Choisis ton pseudo :</div>
    <input class="mp-input" id="mp-name" maxlength="16" placeholder="Ton pseudo" value="${mpEsc(mp.name||'')}">
    <div class="mp-txt">Entre le code de la partie (donné par son créateur) :</div>
    <input class="mp-input code" id="mp-codein" maxlength="30" placeholder="Code de la partie" autocomplete="off" onkeydown="if(event.key==='Enter')mpJoin()">
    <div class="mp-err" id="mp-err">${err?mpEsc(err):''}</div>
    <button class="mp-btn main" onclick="mpJoin()">Rejoindre</button>
    <button class="mp-btn" onclick="mpMenu()">← Retour</button>`);
}
function mpJoin(){
  mpGetName();
  if(typeof Peer==='undefined'){mpErr("Connexion impossible : vérifie ta connexion internet.");return;}
  const code=mpNorm(document.getElementById('mp-codein').value);
  if(code.length<3){mpErr('Entre le nom/code de la partie (3 caractères minimum).');return;}
  const keep=mp.name;mpClean();mp.name=keep;
  mpErr('Connexion…');
  const peer=new Peer(undefined,MP_OPTS);
  mp.peer=peer;mp.role='guest';mp.code=code;
  let ok=false;
  const fail=m=>{if(!ok){const n=mp.name;mpClean();mp.name=n;mpJoinForm(m);}};
  const timer=setTimeout(()=>fail('Connexion impossible (réseau bloqué ?). Vérifie le nom, que la partie est toujours ouverte, et réessaie.'),25000);
  peer.on('error',e=>{clearTimeout(timer);fail(e.type==='peer-unavailable'?'Partie introuvable. Vérifie le code.':'Erreur de connexion ('+e.type+').');});
  peer.on('open',()=>{
    const conn=peer.connect(MP_PREFIX+code,{reliable:true});
    mp.hostConn=conn;
    conn.on('open',()=>{
      ok=true;clearTimeout(timer);
      conn.send({t:'hello',name:mp.name});
      mpGuestLobby();
    });
    conn.on('data',d=>{
      if(!d)return;
      if(d.t==='players'){mp.players=d.list||[];mpGuestLobby();}
      else if(d.t==='start'){mpGuestStart(!!d.exam);}
      else if(d.t==='kick'){mpKicked();}
    });
    conn.on('close',()=>{
      if(mp.hostConn!==conn)return;
      const n=mp.name;mpClean();mp.name=n;
      if(document.getElementById('mp-modal').classList.contains('show'))mpMenu('La partie a été fermée par le créateur.');
      else mpToast('La partie a été fermée par le créateur.');
    });
  });
}
function mpGuestLobby(){
  mpBox(`<div class="mp-title">⏳ Partie ${mp.code}</div>
    <div class="mp-txt">Tu as rejoint la partie. En attente du lancement par le créateur…</div>
    <div class="mp-txt">Joueurs connectés (${mp.players.length}) :</div>
    <div class="mp-players">${mp.players.map((n,i)=>`<div class="mp-player">${i===0?'👑 ':'🧑 '}${mpEsc(n)}</div>`).join('')}</div>
    <button class="mp-btn" onclick="mpClose()">Quitter la partie</button>`);
}
