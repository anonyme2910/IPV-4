ixed-zero {\n  background:rgba(220,0,40,.14) !important;\n  color:#cc0033 !important;\n  box-shadow:inset 0 0 0 2px rgba(220,0,40,.55) !important;\n}\n\n/* Bit fixe à 1 → vert/cyan selon classe */\n.bit.fixed-one {\n  background:rgba(0,255,157,.20) !important;\n  color:#00ff9d !important;\n  box-shadow:inset 0 0 0 2px rgba(0,255,157,.7), 0 0 12px rgba(0,255,157,.35) !important;\n  font-weight:900 !important;\n  cursor:not-allowed;\n}\nbody.light .bit.fixed-one {\n  background:rgba(0,136,68,.14) !important;\n  color:#007744 !important;\n  box-shadow:inset 0 0 0 2px rgba(0,136,68,.55) !important;\n}\n\n/* Légende dot mise à jour */\n.bl-fixed-zero { background:rgba(255,50,80,.22); border:2px solid rgba(255,50,80,.75); box-shadow:0 0 6px rgba(255,50,80,.4); }\n.bl-fixed-one  { background:rgba(0,255,157,.20);  border:2px solid rgba(0,255,157,.7);  box-shadow:0 0 6px rgba(0,255,157,.35); }\n\n/* Legend dot for fixed bits */\n.bl-fixed { background:rgba(255,204,0,.22); border:2px solid rgba(255,204,0,.7); box-shadow:0 0 6px rgba(255,204,0,.4); }\n\n/* separator line between NET/HOST */\n.bit.separator::after {\n  content:''; position:absolute; left:-3px; top:4px; bottom:4px;\n  width:2px; background:var(--yellow); border-radius:1px;\n  box-shadow:0 0 8px var(--yellow);\n}\n\n/* octet separator (dots) */\n.octet-dot {\n  display:flex; align-items:center; color:var(--text-dim); font-size:1.1rem;\n  font-weight:700; padding:.2rem 0; margin-top:2rem;\n  flex-shrink:0;\n}\n\n/* ── LEGEND ── */\n.bits-legend {\n  display:flex; gap:1.2rem; flex-wrap:wrap; margin-top:1rem; font-size:.68rem;\n}\n.bl { display:flex; align-items:center; gap:.4rem; }\n.bl-dot { width:14px; height:14px; border-radius:4px; flex-shrink:0; }\n.bl-net { background:var(--net-bg); border:1px solid var(--net-border); }\n.bl-host { background:var(--host-bg); border:1px solid var(--host-border); }\n.bl-priv { background:var(--priv-bg); border:1px solid var(--priv-border); }\n\n/* ── STATS ROW ── */\n.stats-row {\n  display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr));\n  gap:1rem; margin-bottom:1.5rem;\n}\n.stat-card {\n  background:var(--bg2); border:1px solid var(--border); border-radius:12px;\n  padding:1.1rem 1.25rem; position:relative; overflow:hidden;\n}\n.stat-card::after {\n  content:''; position:absolute; bottom:0; left:0; right:0; height:2px;\n  background:var(--sc-accent,var(--accent)); opacity:.7;\n}\n.stat-label { font-size:.58rem; letter-spacing:.13em; color:var(--text-dim); text-transform:uppercase; margin-bottom:.35rem; }\n.stat-value {\n  font-family:sans-serif; font-size:1.5rem; font-weight:800;\n  color:var(--sc-accent,var(--accent)); line-height:1.1;\n  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;\n}\n.stat-sub { font-size:.6rem; color:var(--text-dim); margin-top:.25rem; }\n.stat-formula { font-family:'JetBrains Mono',monospace; font-size:.7rem; color:var(--green); margin-top:.2rem; }\n.stat-formula.net-formula { color:var(--net-col); }\n\n/* ── PRIVATE ZONES PANEL ── */\n.private-panel {\n  background:var(--bg2); border:1px solid var(--border); border-radius:14px;\n  padding:1.5rem 1.75rem; margin-bottom:1.5rem;\n}\n.priv-zones { display:flex; flex-direction:column; gap:.6rem; margin-top:1rem; }\n.priv-zone {\n  display:flex; align-items:center; gap:.75rem;\n  padding:.75rem 1rem; border-radius:8px;\n  background:var(--bg3); border:1px solid var(--border);\n  transition:all .3s; position:relative; overflow:hidden;\n}\n.priv-zone::before {\n  content:''; position:absolute; left:0; top:0; bottom:0; width:3px;\n  background:var(--border); transition:background .3s;\n}\n.priv-zone.highlighted {\n  border-color:var(--priv-border);\n  background:var(--priv-bg);\n  box-shadow:0 0 20px rgba(255,159,64,.15);\n}\n.priv-zone.highlighted::before { background:var(--priv-col); }\n.pz-name { font-size:.62rem; letter-spacing:.1em; color:var(--text-dim); text-transform:uppercase; flex-shrink:0; width:60px; }\n.pz-range {\n  font-family:'JetBrains Mono',monospace; font-size:.8rem; font-weight:600;\n  color:var(--text); transition:color .3s;\n}\n.priv-zone.highlighted .pz-range { color:var(--priv-col); }\n.pz-badge {\n  margin-left:auto; padding:.2rem .6rem; border-radius:10px;\n  font-size:.6rem; font-weight:700;\n  background:transparent; border:1px solid var(--border); color:var(--text-dim);\n  transition:all .3s; white-space:nowrap;\n}\n.priv-zone.highlighted .pz-badge {\n  background:var(--priv-bg); border-color:var(--priv-border); color:var(--priv-col);\n}\n\n/* Progress bar in private zone */\n.pz-progress {\n  position:absolute; left:3px; top:0; bottom:0;\n  background:var(--priv-bg); transition:right .1s; z-index:0; right:100%;\n}\n.priv-zone > * { position:relative; z-index:1; }\n\n/* ── IP TYPE badge ── */\n.ip-type-badge {\n  display:inline-flex; align-items:center; gap:.35rem;\n  padding:.3rem .8rem; border-radius:20px;\n  font-size:.68rem; font-weight:700; letter-spacing:.04em;\n  transition:all .25s;\n}\n.ip-type-public { background:rgba(0,212,255,.1); border:1px solid rgba(0,212,255,.3); color:var(--accent); }\n.ip-type-private { background:var(--priv-bg); border:1px solid var(--priv-border); color:var(--priv-col); }\n\n/* ── CLASS RANGE VISUAL ── */\n.range-bar-wrap {\n  margin-top:1rem; background:var(--bg3); border-radius:8px; padding:.75rem 1rem;\n  border:1px solid var(--border);\n}\n.range-bar {\n  height:24px; border-radius:6px; background:var(--border);\n  position:relative; overflow:hidden; margin:.5rem 0;\n}\n.range-bar-fill {\n  height:100%; border-radius:6px;\n  background:linear-gradient(90deg,var(--cbtn-a2),var(--cbtn-b2));\n  position:absolute; left:0; top:0; transition:width .5s ease;\n}\n.range-bar-cursor {\n  position:absolute; top:0; bottom:0; width:3px;\n  background:var(--yellow); border-radius:1px;\n  box-shadow:0 0 8px var(--yellow); transition:left .1s;\n}\n.range-labels { display:flex; justify-content:space-between; font-size:.58rem; color:var(--text-dim); }\n\n/* ── ANIMATIONS ── */\n@keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }\n@keyframes bitflash { 0%{transform:scale(1.3);filter:brightness(1.5)} 100%{transform:scale(1);filter:brightness(1)} }\n@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }\n@keyframes slideIn { from{opacity:0;transform:translateX(-8px)} to{opacity:1;transform:translateX(0)} }\n@keyframes glow-in { from{box-shadow:0 0 0 rgba(255,159,64,0)} to{box-shadow:0 0 20px rgba(255,159,64,.2)} }\n\n::-webkit-scrollbar { width:6px; height:6px; }\n::-webkit-scrollbar-track { background:var(--bg); }\n::-webkit-scrollbar-thumb { background:var(--border2); border-radius:3px; }\n\n/* ═══════════════════════════════════════════════════════════\n   INTÉRIEUR DES CLASSES A / B / C — rouge · vert · bleu\n   (tout est limité à #app : rien d'autre dans la page ne change)\n═══════════════════════════════════════════════════════════ */\n#app{\n  --k:#e8334f; --k-hi:#ff8fa0; --k-lo:#8f0f26;\n  --k-bg:rgba(209,26,56,.18); --k-border:rgba(232,51,79,.5); --k-glow:rgba(232,51,79,.4);\n}\n#app[data-cls=\"B\"]{\n  --k:#2fc25b; --k-hi:#86e6a4; --k-lo:#106b2c;\n  --k-bg:rgba(31,168,74,.16); --k-border:rgba(47,194,91,.5); --k-glow:rgba(47,194,91,.4);\n}\n#app[data-cls=\"C\"]{\n  --k:#3b8ee8; --k-hi:#8cc2ff; --k-lo:#143f85;\n  --k-bg:rgba(36,120,214,.18); --k-border:rgba(59,142,232,.5); --k-glow:rgba(59,142,232,.4);\n}\nbody.light #app{ --k:#b0102c; --k-hi:#8f0f26; --k-bg:rgba(176,16,44,.10); --k-border:rgba(176,16,44,.45); --k-glow:rgba(176,16,44,.25); }\nbody.light #app[data-cls=\"B\"]{ --k:#14803a; --k-hi:#0d5e2a; --k-bg:rgba(20,128,58,.10); --k-border:rgba(20,128,58,.45); --k-glow:rgba(20,128,58,.25); }\nbody.light #app[data-cls=\"C\"]{ --k:#1a5fb4; --k-hi:#123f85; --k-bg:rgba(26,95,180,.10); --k-border:rgba(26,95,180,.45); --k-glow:rgba(26,95,180,.25); }\n\n/* les couleurs de la page sont remplacées par celle de la classe, seulement ici */\n#app{\n  --accent:var(--k); --accent2:var(--k-lo);\n  --net-bg:var(--k-bg); --net-col:var(--k-hi); --net-border:var(--k-border);\n  --host-bg:rgba(138,171,204,.07); --host-col:var(--text-dim); --host-border:rgba(138,171,204,.22);\n  --green:var(--k); --yellow:var(--k-hi);\n  --priv-bg:var(--k-bg); --priv-col:var(--k-hi); --priv-border:var(--k-border);\n  --cbtn-a2:var(--k-lo); --cbtn-b2:var(--k);\n}\n\n/* bandeau de classe */\n#app .k-hero{\n  display:flex; align-items:center; gap:1.5rem; padding:1.1rem 1.6rem; margin-bottom:1.5rem;\n  border-radius:14px; border:1px solid var(--k-border); position:relative; overflow:hidden;\n  background:linear-gradient(110deg,var(--k-bg),transparent 65%),var(--bg2);\n}\n#app .k-hero::before{content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,var(--k),transparent);}\n#app .k-letter{font-family:sans-serif; font-weight:900; font-size:4.6rem; line-height:1; color:var(--k); text-shadow:0 0 40px var(--k-glow); min-width:3.2rem; text-align:center;}\n#app[data-cls=\"A\"] .k-letter::before{content:\"A\"}\n#app[data-cls=\"B\"] .k-letter::before{content:\"B\"}\n#app[data-cls=\"C\"] .k-letter::before{content:\"C\"}\n#app .k-title{font-family:sans-serif; font-weight:800; font-size:1.5rem; letter-spacing:.04em; color:var(--text); margin-bottom:.35rem;}\n#app .k-rule{display:none; font-size:.72rem; color:var(--text-dim);}\n#app .k-rule b{color:var(--k); font-weight:700;}\n#app[data-cls=\"A\"] .k-rule-A, #app[data-cls=\"B\"] .k-rule-B, #app[data-cls=\"C\"] .k-rule-C{display:block}\n\n/* adresse à gauche, chiffres à droite */\n#app .k-top{display:grid; grid-template-columns:minmax(0,3fr) minmax(0,2fr); gap:1.5rem; margin-bottom:1.5rem; align-items:stretch;}\n#app .k-main{display:flex; flex-direction:column; gap:.9rem;}\n#app .k-main .panel-title{margin-bottom:0}\n#app .k-iprow{display:flex; gap:.75rem; align-items:center;}\n#app .k-iprow .ip-field{flex:1; min-width:0}\n#app .k-main .slider-wrap, #app .k-main .range-bar-wrap{margin-top:0}\n#app .k-main .private-indicator{align-self:flex-start}\n#app .k-stats{display:grid; grid-template-columns:1fr 1fr; gap:1rem; margin-bottom:0; align-content:stretch;}\n#app .k-stats .stat-card{display:flex; flex-direction:column; justify-content:center;}\n#app .k-stats .stat-value{font-size:1.3rem}\n@media(max-width:860px){ #app .k-top{grid-template-columns:1fr} }\n\n/* binaire : 4 couleurs dédiées (hors rouge/vert/bleu), identiques pour A, B et C */\n#app{\n  --b-net:#b57bff;   --b-net-bg:rgba(168,85,247,.22);  --b-net-bd:rgba(168,85,247,.65);\n  --b-host:#ffa24a;  --b-host-bg:rgba(255,159,64,.16); --b-host-bd:rgba(255,159,64,.55);\n  --b-fixed:#ffd23f; --b-fixed-ink:#2a1f00;\n  --b-sep:#ffffff;\n}\nbody.light #app{\n  --b-net:#6a1fc2;   --b-net-bg:rgba(119,34,204,.14);  --b-net-bd:rgba(119,34,204,.5);\n  --b-host:#b34700;  --b-host-bg:rgba(204,85,0,.12);   --b-host-bd:rgba(204,85,0,.5);\n  --b-fixed:#e0a400; --b-fixed-ink:#2a1f00;\n  --b-sep:#0a1428;\n}\n#app .bit.net{background:var(--b-net-bg); color:var(--b-net); box-shadow:inset 0 0 0 1px var(--b-net-bd);}\n#app .bit.host{background:var(--b-host-bg); color:var(--b-host); box-shadow:inset 0 0 0 1px var(--b-host-bd);}\n#app .bit.fixed-zero, #app .bit.fixed-one{\n  background:var(--b-fixed) !important; color:var(--b-fixed-ink) !important;\n  box-shadow:0 0 14px rgba(255,210,63,.45), inset 0 0 0 1px rgba(255,255,255,.4) !important;\n  font-weight:900 !important;\n}\n#app .bit.separator::after{background:var(--b-sep); box-shadow:0 0 8px var(--b-sep);}\n#app .k-lg-net{background:var(--b-net-bg); border:1px solid var(--b-net-bd)}\n#app .k-lg-host{background:var(--b-host-bg); border:1px solid var(--b-host-bd)}\n#app .k-lg-fixed{background:var(--b-fixed); box-shadow:0 0 6px rgba(255,210,63,.45)}\n#app .k-lg-sep{background:var(--b-sep); width:4px !important; border-radius:2px; margin:0 5px; box-shadow:0 0 6px var(--b-sep)}\n#app .k-lt-net{color:var(--b-net)} #app .k-lt-host{color:var(--b-host)}\n#app .k-lt-fixed{color:var(--b-fixed)} #app .k-lt-sep{color:var(--b-sep)}\n\n/* plages privées : adresse + curseur côte à côte */\n#app .private-panel{display:grid; grid-template-columns:auto 1fr; gap:.75rem 1rem; align-items:stretch;}\n#app .private-panel > .panel-title{grid-column:1/-1; margin-bottom:.15rem}\n#app #priv-shortcut-btn{margin:0 !important; text-align:left}\n#app #priv-slider-wrap{margin:0 !important}\n#app .priv-zones{grid-column:1/-1; margin-top:.15rem}\n@media(max-width:760px){ #app .private-panel{grid-template-columns:1fr} }\n\n/* IP : NET et HOST colorés comme dans le binaire (A, B et C) */\n#app .ip-display-big .oct.o-net, #app .ip-display-big.is-private .oct.o-net{color:var(--b-net)}\n#app .ip-display-big .oct.o-host, #app .ip-display-big.is-private .oct.o-host{color:var(--b-host)}\n#app .ip-display-big .sep.s-net{color:var(--b-net); opacity:.75}\n#app .ip-display-big .sep.s-host{color:var(--b-host); opacity:.75}\n#app .octet-dec.o-net{color:var(--b-net)}\n#app .octet-dec.o-host{color:var(--b-host)}\n\n/* IP colorées partout (NET violet / HOST orange) */\n#app .ipn{color:var(--b-net)} #app .iph{color:var(--b-host)}\n#app .ipnd{color:var(--b-net); opacity:.75} #app .iphd{color:var(--b-host); opacity:.75}\n#app .ip-field{color:transparent; caret-color:var(--text)}\n#app .ip-colored{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;\n  pointer-events:none; overflow:hidden; white-space:pre;\n  font-family:'JetBrains Mono',monospace; font-size:1.2rem; font-weight:600; letter-spacing:.05em}\n#app{--c-tot:#22d3ee}\nbody.light #app{--c-tot:#0e7490}\n\n/* Cartes de chiffres : noms roses · formules cyan · grands nombres jaunes (A, B, C identiques) */\n#app{--c-lab:#ff5cc0; --c-num:#ffd60a}\nbody.light #app{--c-lab:#c2185b; --c-num:#a67c00}\n#app .k-stats .stat-label{color:var(--c-lab); font-size:1rem; font-weight:700; letter-spacing:.05em; margin-bottom:.5rem}\n#app .k-stats .stat-value{color:var(--c-num)}\n#app .k-stats .stat-formula, #app .k-stats .stat-sub{color:var(--c-tot); font-size:1rem; margin-top:.3rem}\n#app #stat-formula, #app #stat-mask-dec{color:var(--c-tot)}\n\n/* En-tête du cours : couleur de la classe choisie (A rouge · B vert · C bleu) */\nbody[data-cls='A']{--hk:#e8334f; --hk-hi:#ff8fa0; --hk-glow:rgba(232,51,79,.45)}\nbody[data-cls='B']{--hk:#2fc25b; --hk-hi:#86e6a4; --hk-glow:rgba(47,194,91,.45)}\nbody[data-cls='C']{--hk:#3b8ee8; --hk-hi:#8cc2ff; --hk-glow:rgba(59,142,232,.45)}\nbody.light[data-cls='A']{--hk:#b0102c; --hk-hi:#b0102c; --hk-glow:rgba(176,16,44,.25)}\nbody.light[data-cls='B']{--hk:#14803a; --hk-hi:#14803a; --hk-glow:rgba(20,128,58,.25)}\nbody.light[data-cls='C']{--hk:#1a5fb4; --hk-hi:#1a5fb4; --hk-glow:rgba(26,95,180,.25)}\nbody[data-cls] header .header-tag{color:var(--hk); opacity:1}\nbody[data-cls] header h1{color:var(--hk-hi)}\nbody[data-cls] header h1 span{color:var(--hk); text-shadow:0 0 20px var(--hk-glow)}\nbody[data-cls] header .subtitle{color:var(--hk)}\nbody[data-cls] header .header-line{background:linear-gradient(90deg,transparent,var(--hk),transparent)}\nheader .subtitle .hk-a, header .subtitle .hk-b, header .subtitle .hk-c{font-weight:800}\nheader .subtitle .hk-a{color:#e8334f} header .subtitle .hk-b{color:#2fc25b} header .subtitle .hk-c{color:#3b8ee8}\nbody.light header .subtitle .hk-a{color:#b0102c} body.light header .subtitle .hk-b{color:#14803a} body.light header .subtitle .hk-c{color:#1a5fb4}\n<\/style>\n<\/head>\n<body>\n\n<\!-- ══ LANDING SCREEN ══ -->\n<div id=\"landing\">\n  <canvas id=\"landing-canvas\"><\/canvas>\n\n  <div class=\"landing-inner\">\n    <div class=\"landing-hero\">\n      <p class=\"landing-tag\">Visualiseur interactif · Réseaux IPv4<\/p>\n      <h1 class=\"landing-title\">\n        Classes d'adresses<br><span class=\"accent-word\">IPV4<\/span>\n      <\/h1>\n      <p class=\"landing-sub\">Adressage classful · <span style=\"color:#d11a38\">A<\/span> &nbsp;·&nbsp; <span style=\"color:#1fa84a\">B<\/span> &nbsp;·&nbsp; <span style=\"color:#2478d6\">C<\/span><\/p>\n      <div class=\"landing-line\"><\/div>\n    <\/div>\n\n    <div class=\"class-cards\">\n\n      <\!-- Classe A -->\n      <div class=\"class-card cc-a\" onclick=\"launchClass('A')\">\n        <div class=\"cc-letter\">A<\/div>\n        <div class=\"cc-title\">Classe A<\/div>\n        <div class=\"cc-range\">1.0.0.0 → 127.255.255.255<\/div>\n        <div class=\"cc-stats\">\n          <div class=\"cc-stat\"><span>Bits NET<\/span><span class=\"cc-stat-val\">8 bits<\/span><\/div>\n          <div class=\"cc-stat\"><span>Bits HOST<\/span><span class=\"cc-stat-val\">24 bits<\/span><\/div>\n          <div class=\"cc-stat\"><span>Adresses/réseau<\/span><span class=\"cc-stat-val\">16 777 216<\/span><\/div>\n          <div class=\"cc-stat\"><span>Plage privée<\/span><span class=\"cc-stat-val\">10.0.0.0/8<\/span><\/div>\n        <\/div>\n        <div class=\"cc-divider\"><\/div>\n        <div class=\"cc-mask-row\">\n          <span class=\"cc-mask-label\">Masque par défaut<\/span>\n          <span class=\"cc-mask-val\">/8<\/span>\n        <\/div>\n        <div class=\"cc-sweep\"><\/div>\n      <\/div>\n\n      <\!-- Classe B -->\n      <div class=\"class-card cc-b\" onclick=\"launchClass('B')\">\n        <div class=\"cc-letter\">B<\/div>\n        <div class=\"cc-title\">Classe B<\/div>\n        <div class=\"cc-range\">128.0.0.0 → 191.255.255.255<\/div>\n        <div class=\"cc-stats\">\n          <div class=\"cc-stat\"><span>Bits NET<\/span><span class=\"cc-stat-val\">16 bits<\/span><\/div>\n          <div class=\"cc-stat\"><span>Bits HOST<\/span><span class=\"cc-stat-val\">16 bits<\/span><\/div>\n          <div class=\"cc-stat\"><span>Adresses/réseau<\/span><span class=\"cc-stat-val\">65 536<\/span><\/div>\n          <div class=\"cc-stat\"><span>Plage privée<\/span><span class=\"cc-stat-val\">172.16.0.0/12<\/span><\/div>\n        <\/div>\n        <div class=\"cc-divider\"><\/div>\n        <div class=\"cc-mask-row\">\n          <span class=\"cc-mask-label\">Masque par défaut<\/span>\n          <span class=\"cc-mask-val\">/16<\/span>\n        <\/div>\n        <div class=\"cc-sweep\"><\/div>\n      <\/div>\n\n      <\!-- Classe C -->\n      <div class=\"class-card cc-c\" onclick=\"launchClass('C')\">\n        <div class=\"cc-letter\">C<\/div>\n        <div class=\"cc-title\">Classe C<\/div>\n        <div class=\"cc-range\">192.0.0.0 → 223.255.255.255<\/div>\n        <div class=\"cc-stats\">\n          <div class=\"cc-stat\"><span>Bits NET<\/span><span class=\"cc-stat-val\">24 bits<\/span><\/div>\n          <div class=\"cc-stat\"><span>Bits HOST<\/span><span class=\"cc-stat-val\">8 bits<\/span><\/div>\n          <div class=\"cc-stat\"><span>Adresses/réseau<\/span><span class=\"cc-stat-val\">256<\/span><\/div>\n          <div class=\"cc-stat\"><span>Plage privée<\/span><span class=\"cc-stat-val\">192.168.0.0/16<\/span><\/div>\n        <\/div>\n        <div class=\"cc-divider\"><\/div>\n        <div class=\"cc-mask-row\">\n          <span class=\"cc-mask-label\">Masque par défaut<\/span>\n          <span class=\"cc-mask-val\">/24<\/span>\n        <\/div>\n        <div class=\"cc-sweep\"><\/div>\n      <\/div>\n\n    <\/div>\n\n    <p class=\"landing-hint\">Cliquez sur une classe pour commencer l'exploration &nbsp;<span>↓<\/span><\/p>\n  <\/div>\n<\/div>\n\n<div class=\"wrapper\">\n\n  <\!-- HEADER -->\n  <header>\n    <button class=\"theme-btn\" id=\"theme-btn\" onclick=\"toggleTheme()\">\n      <span id=\"theme-icon\">☀️<\/span> <span id=\"theme-label\">Mode clair<\/span>\n    <\/button>\n    <p class=\"header-tag\">Visualiseur interactif · Réseaux IPv4<\/p>\n    <h1>IPv4 <span>CLASSES<\/span><\/h1>\n    <p class=\"subtitle\"><span class=\"hk-a\">A<\/span> · <span class=\"hk-b\">B<\/span> · <span class=\"hk-c\">C<\/span> — Adressage classful<\/p>\n    <div class=\"header-line\"><\/div>\n  <\/header>\n\n  <\!-- CLASS SELECTOR -->\n  <div class=\"class-selector\">\n    <button class=\"class-btn cbtn-a\" onclick=\"selectClass('A')\">\n      <span>CLASSE <strong>A<\/strong><small class=\"class-badge\">1.0.0.0 → 127.255.255.255<\/small><\/span>\n    <\/button>\n    <button class=\"class-btn cbtn-b\" onclick=\"selectClass('B')\">\n      <span>CLASSE <strong>B<\/strong><small class=\"class-badge\">128.0.0.0 → 191.255.255.255<\/small><\/span>\n    <\/button>\n    <button class=\"class-btn cbtn-c\" onclick=\"selectClass('C')\">\n      <span>CLASSE <strong>C<\/strong><small class=\"class-badge\">192.0.0.0 → 223.255.255.255<\/small><\/span>\n    <\/button>\n  <\/div>\n\n  <\!-- APP (shown after class selection) -->\n  <div id=\"app\">\n\n    <\!-- BANDEAU DE CLASSE -->\n    <div class=\"k-hero\">\n      <div class=\"k-letter\"><\/div>\n      <div class=\"k-hero-info\">\n        <div class=\"k-title\" id=\"class-label-title\">Classe A<\/div>\n        <div class=\"k-rule k-rule-A\">Le 1er bit est toujours <b>0<\/b><\/div>\n        <div class=\"k-rule k-rule-B\">Les 2 premiers bits sont toujours <b>10<\/b><\/div>\n        <div class=\"k-rule k-rule-C\">Les 3 premiers bits sont toujours <b>110<\/b><\/div>\n      <\/div>\n    <\/div>\n\n    <\!-- ADRESSE + STATS -->\n    <div class=\"k-top\">\n      <div class=\"panel k-main\">\n        <div class=\"panel-title\" id=\"slider-title\">Plage de classe A<\/div>\n\n        <div class=\"k-iprow\">\n          <div class=\"ip-input-wrap\" style=\"flex:1;min-width:0\"><input type=\"text\" class=\"ip-field\" id=\"ip-input\"\n            placeholder=\"0.0.0.0\" autocomplete=\"off\" spellcheck=\"false\"\n            oninput=\"onIPInput()\" onkeydown=\"onIPKeydown(event)\"><div class=\"ip-colored\" id=\"ip-colored\"><\/div><\/div>\n          <div id=\"ip-type-wrap\">\n            <span class=\"ip-type-badge ip-type-public\" id=\"ip-type-badge\">PUBLIC<\/span>\n          <\/div>\n        <\/div>\n\n        <div class=\"private-indicator\" id=\"priv-ind\">🔒 Adresse privée<\/div>\n\n        <div class=\"ip-display-big\" id=\"ip-display\">\n          <span class=\"oct\" id=\"o0\">0<\/span><span class=\"sep\">.<\/span><span class=\"oct\" id=\"o1\">0<\/span><span class=\"sep\">.<\/span><span class=\"oct\" id=\"o2\">0<\/span><span class=\"sep\">.<\/span><span class=\"oct\" id=\"o3\">0<\/span>\n        <\/div>\n\n        <div class=\"slider-wrap\">\n          <div class=\"slider-header\">\n            <span class=\"slider-label\" id=\"slider-range-label\">Position<\/span>\n            <span class=\"slider-val\" id=\"slider-pos-val\">—<\/span>\n          <\/div>\n          <input type=\"range\" class=\"ip-range\" id=\"ip-slider\"\n            min=\"0\" max=\"100\" value=\"0\" oninput=\"onSlider()\">\n          <div class=\"slider-ticks\">\n            <span id=\"tick-start\">—<\/span>\n            <span id=\"tick-mid\">—<\/span>\n            <span id=\"tick-end\">—<\/span>\n          <\/div>\n        <\/div>\n\n        <\!-- Class range bar -->\n        <div class=\"range-bar-wrap\">\n          <div class=\"range-labels\">\n            <span id=\"rb-start\">—<\/span><span id=\"rb-end\">—<\/span>\n          <\/div>\n          <div class=\"range-bar\">\n            <div class=\"range-bar-fill\" id=\"rb-fill\" style=\"width:100%\"><\/div>\n            <div class=\"range-bar-cursor\" id=\"rb-cursor\" style=\"left:0%\"><\/div>\n          <\/div>\n          <div class=\"range-labels\">\n            <span style=\"color:var(--text-dim)\">Début classe<\/span>\n            <span style=\"color:var(--text-dim)\">Fin classe<\/span>\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <\!-- STATS -->\n      <div class=\"stats-row k-stats\" id=\"stats-row\">\n        <div class=\"stat-card\" style=\"--sc-accent:var(--net-col)\">\n          <div class=\"stat-label\">Bits NET<\/div>\n          <div class=\"stat-value\" id=\"stat-netbits\">8<\/div>\n          <div class=\"stat-formula net-formula\" id=\"stat-net-formula\">2⁸ = 256 réseaux<\/div>\n        <\/div>\n        <div class=\"stat-card\" style=\"--sc-accent:var(--host-col)\">\n          <div class=\"stat-label\">Bits HOST<\/div>\n          <div class=\"stat-value\" id=\"stat-hostbits\">24<\/div>\n          <div class=\"stat-formula\" id=\"stat-host-formula\">2²⁴ = 16 777 216<\/div>\n        <\/div>\n        <div class=\"stat-card\" style=\"--sc-accent:var(--c-tot)\">\n          <div class=\"stat-label\">Adresses totales<\/div>\n          <div class=\"stat-value\" id=\"stat-total\">16 777 216<\/div>\n          <div class=\"stat-formula net-formula\" id=\"stat-formula\">2²⁴ = 16 777 216<\/div>\n        <\/div>\n        <div class=\"stat-card\" style=\"--sc-accent:var(--yellow)\">\n          <div class=\"stat-label\">Masque par défaut<\/div>\n          <div class=\"stat-value\" id=\"stat-mask\">/8<\/div>\n          <div class=\"stat-sub\" id=\"stat-mask-dec\">255.0.0.0<\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <\!-- BINARY DISPLAY -->\n    <div class=\"binary-panel\">\n      <div class=\"panel-title\">Représentation binaire — 32 bits<\/div>\n      <div class=\"binary-grid\" id=\"binary-grid\">\n        <\!-- Generated by JS -->\n      <\/div>\n      <div class=\"bits-legend\">\n        <div class=\"bl\"><div class=\"bl-dot k-lg-net\"><\/div><span class=\"k-lt-net\">NET<\/span><\/div>\n        <div class=\"bl\"><div class=\"bl-dot k-lg-host\"><\/div><span class=\"k-lt-host\">HOST<\/span><\/div>\n        <div class=\"bl\"><div class=\"bl-dot k-lg-fixed\"><\/div><span class=\"k-lt-fixed\">Bits fixes de classe<\/span><\/div>\n        <div class=\"bl\"><div class=\"bl-dot k-lg-sep\"><\/div><span class=\"k-lt-sep\">Frontière NET/HOST<\/span><\/div>\n      <\/div>\n    <\/div>\n\n    <\!-- PRIVATE ZONES -->\n    <div class=\"private-panel\">\n      <div class=\"panel-title\" style=\"--accent:var(--priv-col)\">🔒 Plages privées<\/div>\n      <button id=\"priv-shortcut-btn\" onclick=\"goToPrivate()\" style=\"\n        display:flex; align-items:center; gap:.5rem;\n        margin-bottom:.75rem; padding:.5rem 1rem;\n        background:var(--priv-bg); border:1px solid var(--priv-border);\n        border-radius:8px; color:var(--priv-col);\n        font-family:'JetBrains Mono',monospace; font-size:.75rem; font-weight:700;\n        cursor:pointer; transition:all .2s;\n      \" onmouseover=\"this.style.opacity='.75'\" onmouseout=\"this.style.opacity='1'\">\n        🔒 Aller à la 1ère adresse privée — <span id=\"priv-shortcut-ip\">—<\/span>\n      <\/button>\n\n      <\!-- Curseur navigation adresses privées -->\n      <div id=\"priv-slider-wrap\" style=\"\n        background:var(--bg3); border:1px solid var(--priv-border);\n        border-radius:10px; padding:.85rem 1rem; margin-bottom:.85rem;\n      \">\n        <div class=\"slider-header\">\n          <span class=\"slider-label\" style=\"color:var(--priv-col)\">🔒 Navigation dans la plage privée<\/span>\n          <span class=\"slider-val\" id=\"priv-slider-val\" style=\"color:var(--priv-col)\">—<\/span>\n        <\/div>\n        <input type=\"range\" class=\"ip-range\" id=\"priv-slider\"\n          min=\"0\" max=\"100\" value=\"0\" oninput=\"onPrivSlider()\"\n          style=\"background:linear-gradient(to right,var(--priv-col) 0%,var(--priv-col) var(--fill,0%),var(--border2) var(--fill,0%),var(--border2) 100%);\">\n        <div class=\"slider-ticks\">\n          <span id=\"priv-tick-start\">—<\/span>\n          <span id=\"priv-tick-end\">—<\/span>\n        <\/div>\n      <\/div>\n\n      <div class=\"priv-zones\" id=\"priv-zones\">\n        <\!-- Generated by JS -->\n      <\/div>\n    <\/div>\n\n  <\/div><\!-- /app -->\n\n<\/div><\!-- /wrapper -->\n\n<script>\n/* ═══════════════════════════════════════════\n   LANDING CANVAS — PARTICLES\n═══════════════════════════════════════════ */\n(function() {\n  const canvas = document.getElementById('landing-canvas');\n  const ctx = canvas.getContext('2d');\n  let W, H, particles = [], animId;\n\n  function resize() {\n    W = canvas.width = window.innerWidth;\n    H = canvas.height = window.innerHeight;\n  }\n  window.addEventListener('resize', resize);\n  resize();\n\n  // Palette: cyan, purple, green\n  const COLORS = ['rgba(0,212,255,', 'rgba(168,85,247,', 'rgba(0,255,157,'];\n\n  function Particle() {\n    this.reset = function() {\n      this.x = Math.random() * W;\n      this.y = Math.random() * H;\n      this.vx = (Math.random() - .5) * .4;\n      this.vy = (Math.random() - .5) * .4;\n      this.r = Math.random() * 1.8 + .5;\n      this.col = COLORS[Math.floor(Math.random() * COLORS.length)];\n      this.a = Math.random() * .5 + .1;\n    };\n    this.reset();\n  }\n\n  for (let i = 0; i < 90; i++) particles.push(new Particle());\n\n  function draw() {\n    ctx.clearRect(0, 0, W, H);\n\n    // Draw connections\n    for (let i = 0; i < particles.length; i++) {\n      for (let j = i + 1; j < particles.length; j++) {\n        const dx = particles[i].x - particles[j].x;\n        const dy = particles[i].y - particles[j].y;\n        const dist = Math.sqrt(dx*dx + dy*dy);\n        if (dist < 130) {\n          ctx.beginPath();\n          ctx.moveTo(particles[i].x, particles[i].y);\n          ctx.lineTo(particles[j].x, particles[j].y);\n          const alpha = (1 - dist / 130) * .12;\n          ctx.strokeStyle = `rgba(0,212,255,${alpha})`;\n          ctx.lineWidth = .5;\n          ctx.stroke();\n        }\n      }\n    }\n\n    // Draw particles\n    for (const p of particles) {\n      ctx.beginPath();\n      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);\n      ctx.fillStyle = p.col + p.a + ')';\n      ctx.fill();\n\n      p.x += p.vx; p.y += p.vy;\n      if (p.x < -10 || p.x > W + 10 || p.y < -10 || p.y > H + 10) p.reset();\n    }\n\n    animId = requestAnimationFrame(draw);\n  }\n  draw();\n\n  window._stopLandingCanvas = function() {\n    cancelAnimationFrame(animId);\n  };\n  window._startLandingCanvas = function() {\n    cancelAnimationFrame(animId); resize(); draw();\n  };\n})();\n\n/* ═══════════════════════════════════════════\n   LAUNCH FROM LANDING\n═══════════════════════════════════════════ */\nfunction launchClass(cls) {\n  const landing = document.getElementById('landing');\n  landing.classList.add('hidden');\n  window._landingHideT = setTimeout(() => {\n    landing.style.display = 'none';\n    if (window._stopLandingCanvas) window._stopLandingCanvas();\n  }, 600);\n  selectClass(cls);\n  try { window.parent.setCoursLabel('Classes'); } catch(e) {}\n}\n\n/* Retour au choix des classes (appelé par le bouton ← de la page principale) */\nfunction showLanding() {\n  const landing = document.getElementById('landing');\n  clearTimeout(window._landingHideT);\n  landing.style.display = '';\n  void landing.offsetWidth;\n  landing.classList.remove('hidden');\n  if (window._startLandingCanvas) window._startLandingCanvas();\n  document.getElementById('app').classList.remove('visible');\n  document.querySelectorAll('.class-btn').forEach(b => b.classList.remove('active'));\n  try { window.parent.setCoursLabel('Accueil'); } catch(e) {}\n}\nwindow.coursBack = function() {\n  const landing = document.getElementById('landing');\n  const onLanding = landing.style.display !== 'none' && !landing.classList.contains('hidden');\n  if (onLanding) return false;\n  showLanding();\n  return true;\n};\n\n/* ═══════════════════════════════════════════\n   STATE\n═══════════════════════════════════════════ */\nconst STATE = {\n  cls: null,\n  ip: [0, 0, 0, 0],\n  prevBits: null,\n};\n\n/* ═══════════════════════════════════════════\n   CLASS CONFIG\n═══════════════════════════════════════════ */\nconst CLASS_CFG = {\n  A: {\n    label: 'Classe A',\n    netBits: 7, hostBits: 24,\n    mask: '/8', maskDec: '255.0.0.0',\n    start: [1,0,0,0], end: [127,255,255,255],\n    startInt: ipToInt([1,0,0,0]), endInt: ipToInt([127,255,255,255]),\n    defaultIP: [10,0,0,0],\n    privRanges: [\n      { name: '10.x.x.x', start:[10,0,0,0], end:[10,255,255,255], label:'10.0.0.0 — 10.255.255.255' }\n    ],\n    accent: '#00d4ff',\n    accentA: '#0088cc', accentB: '#00d4ff',\n  },\n  B: {\n    label: 'Classe B',\n    netBits: 14, hostBits: 16,\n    mask: '/16', maskDec: '255.255.0.0',\n    start: [128,0,0,0], end: [191,255,255,255],\n    startInt: ipToInt([128,0,0,0]), endInt: ipToInt([191,255,255,255]),\n    defaultIP: [172,16,0,0],\n    privRanges: [\n      { name: '172.x.x.x', start:[172,16,0,0], end:[172,31,255,255], label:'172.16.0.0 — 172.31.255.255' }\n    ],\n    accent: '#a855f7',\n    accentA: '#7722cc', accentB: '#a855f7',\n  },\n  C: {\n    label: 'Classe C',\n    netBits: 21, hostBits: 8,\n    mask: '/24', maskDec: '255.255.255.0',\n    start: [192,0,0,0], end: [223,255,255,255],\n    startInt: ipToInt([192,0,0,0]), endInt: ipToInt([223,255,255,255]),\n    defaultIP: [192,168,1,0],\n    privRanges: [\n      { name: '192.168.x.x', start:[192,168,0,0], end:[192,168,255,255], label:'192.168.0.0 — 192.168.255.255' }\n    ],\n    accent: '#00ff9d',\n    accentA: '#22aa55', accentB: '#00ff9d',\n  },\n};\n\n/* ═══════════════════════════════════════════\n   HELPERS\n═══════════════════════════════════════════ */\nfunction ipToInt(arr) {\n  return ((arr[0]<<24)|(arr[1]<<16)|(arr[2]<<8)|arr[3]) >>> 0;\n}\nfunction intToIp(n) {\n  return [(n>>>24)&255,(n>>>16)&255,(n>>>8)&255,n&255];\n}\nfunction ipStr(arr) { return arr.join('.'); }\n\n/* ── Couleurs NET / HOST sur toutes les IP (A:1 octet NET, B:2, C:3) ── */\nfunction ipSpans(parts) {\n  const nc = STATE.cls === 'B' ? 2 : STATE.cls === 'C' ? 3 : STATE.cls === 'A' ? 1 : 3;\n  return parts.map((v, i) => {\n    const t = String(v).replace(/&/g, '&amp;').replace(/<\/g, '&lt;');\n    const dot = i < parts.length - 1 ? `<span class=${i + 1 < nc ? 'ipnd' : 'iphd'}>.<\/span>` : '';\n    return `<span class=${i < nc ? 'ipn' : 'iph'}>${t}<\/span>${dot}`;\n  }).join('');\n}\nfunction ipc(str) {\n  return String(str).replace(/([0-9]+|x)([.]([0-9]+|x)){3}/gi, m => ipSpans(m.split('.')));\n}\nconst IP_COLOR_SELECTORS = '#slider-range-label,#tick-start,#tick-mid,#tick-end,#rb-start,#rb-end,#priv-shortcut-ip,#priv-slider-val,#priv-tick-start,#priv-tick-end,#slider-pos-val,#priv-zones .pz-range,#priv-zones .pz-name,#priv-zones .pz-current';\nfunction colorIPs() {\n  document.querySelectorAll(IP_COLOR_SELECTORS).forEach(el => { el.innerHTML = ipc(el.textContent); });\n  const inp = document.getElementById('ip-input'), ov = document.getElementById('ip-colored');\n  if (inp && ov) ov.innerHTML = ipSpans(inp.value.split('.'));\n}\ndocument.addEventListener('input', e => { if (e.target && e.target.id === 'ip-input') colorIPs(); });\nfunction toBin8(n) { return n.toString(2).padStart(8,'0'); }\n\nfunction formatBig(n) {\n  return n.toLocaleString('fr-FR');\n}\n\nfunction superscript(n) {\n  const sup = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};\n  return String(n).split('').map(c=>sup[c]||c).join('');\n}\n\n/* ═══════════════════════════════════════════\n   CLASS SELECTION\n═══════════════════════════════════════════ */\nfunction selectClass(cls) {\n  STATE.cls = cls;\n  const cfg = CLASS_CFG[cls];\n  document.getElementById('app').dataset.cls = cls;\n  document.body.dataset.cls = cls;\n\n  // Update button styles\n  document.querySelectorAll('.class-btn').forEach(b => b.classList.remove('active'));\n  document.querySelectorAll('.class-btn')[['A','B','C'].indexOf(cls)].classList.add('active');\n\n  // Show app\n  const app = document.getElementById('app');\n  app.classList.add('visible');\n  app.style.animation = 'none';\n  void app.offsetWidth;\n  app.style.animation = 'fadeUp .35s ease';\n\n  // Update accent color for class\n  document.documentElement.style.setProperty('--cbtn-a2', cfg.accentA);\n  document.documentElement.style.setProperty('--cbtn-b2', cfg.accentB);\n\n  // Update labels\n  document.getElementById('class-label-title').textContent = cfg.label;\n  document.getElementById('slider-title').textContent = `Plage de classe ${cls}`;\n  document.getElementById('slider-range-label').textContent = `${ipStr(cfg.start)} → ${ipStr(cfg.end)}`;\n\n  // Tick labels\n  const midInt = Math.floor((cfg.startInt + cfg.endInt) / 2);\n  document.getElementById('tick-start').textContent = ipStr(cfg.start);\n  document.getElementById('tick-mid').textContent = ipStr(intToIp(midInt));\n  document.getElementById('tick-end').textContent = ipStr(cfg.end);\n  document.getElementById('rb-start').textContent = ipStr(cfg.start);\n  document.getElementById('rb-end').textContent = ipStr(cfg.end);\n\n  // Stats\n  document.getElementById('stat-netbits').textContent = cfg.netBits;\n  document.getElementById('stat-hostbits').textContent = cfg.hostBits;\n  const total = Math.pow(2, cfg.hostBits);\n  const totalNet = Math.pow(2, cfg.netBits);\n  document.getElementById('stat-total').textContent = formatBig(total);\n  document.getElementById('stat-formula').textContent = `2${superscript(cfg.hostBits)} = ${formatBig(total)}`;\n  document.getElementById('stat-net-formula').textContent = `2${superscript(cfg.netBits)} = ${formatBig(totalNet)} réseaux`;\n  document.getElementById('stat-host-formula').textContent = `2${superscript(cfg.hostBits)} = ${formatBig(total)} adresses`;\n  document.getElementById('stat-mask').textContent = cfg.mask;\n  document.getElementById('stat-mask-dec').textContent = cfg.maskDec;\n\n  // Private zones\n  renderPrivZones(cls);\n  document.getElementById('priv-shortcut-ip').textContent = ipStr(cfg.privRanges[0].start);\n\n  // Binary grid\n  buildBinaryGrid(cfg.netBits);\n\n  // Set default IP\n  STATE.ip = [...cfg.defaultIP];\n  STATE.prevBits = null;\n  setSliderRange();\n  renderAll();\n}\n\n/* ═══════════════════════════════════════════\n   SLIDER RANGE\n═══════════════════════════════════════════ */\nfunction setSliderRange() {\n  const cfg = CLASS_CFG[STATE.cls];\n  const slider = document.getElementById('ip-slider');\n  slider.min = cfg.startInt;\n  slider.max = cfg.endInt;\n  slider.value = ipToInt(STATE.ip);\n  updateSliderFill();\n}\n\nfunction updateSliderFill() {\n  const cfg = CLASS_CFG[STATE.cls];\n  const slider = document.getElementById('ip-slider');\n  const v = parseInt(slider.value);\n  const pct = (v - cfg.startInt) / (cfg.endInt - cfg.startInt) * 100;\n  slider.style.setProperty('--fill', pct.toFixed(2) + '%');\n\n  // Range bar cursor\n  document.getElementById('rb-cursor').style.left = pct.toFixed(2) + '%';\n  document.getElementById('slider-pos-val').textContent = ipStr(intToIp(v));\n  colorIPs();\n}\n\n/* ═══════════════════════════════════════════\n   BUILD BINARY GRID\n═══════════════════════════════════════════ */\nfunction buildBinaryGrid(netBits) {\n  const grid = document.getElementById('binary-grid');\n  grid.innerHTML = '';\n\n  for (let oct = 0; oct < 4; oct++) {\n    // Dot separator\n    if (oct > 0) {\n      const dot = document.createElement('div');\n      dot.className = 'octet-dot';\n      dot.textContent = '.';\n      grid.appendChild(dot);\n    }\n\n    const group = document.createElement('div');\n    group.className = 'octet-group';\n\n    // Decimal value\n    const dec = document.createElement('div');\n    dec.className = 'octet-dec';\n    dec.id = `dec-${oct}`;\n    dec.textContent = '0';\n    group.appendChild(dec);\n\n    // Bits\n    const bitsRow = document.createElement('div');\n    bitsRow.className = 'octet-bits';\n\n    for (let b = 0; b < 8; b++) {\n      const globalBit = oct * 8 + b;\n      const bit = document.createElement('div');\n      bit.id = `bit-${globalBit}`;\n\n      // Bits fixes de classe :\n      // A  → bit 0 = 0\n      // B  → bit 0 = 1, bit 1 = 0\n      // C  → bit 0 = 1, bit 1 = 1, bit 2 = 0\n      const fixedBits = {\n        A: [{pos:0, val:0}],\n        B: [{pos:0, val:1}, {pos:1, val:0}],\n        C: [{pos:0, val:1}, {pos:1, val:1}, {pos:2, val:0}],\n      };\n      const fixedDefs = fixedBits[STATE.cls];\n      const fixedCount = fixedDefs.length;\n      // La frontière NET/HOST est après (fixedCount + netBits) bits\n      const boundary = fixedCount + netBits;\n\n      const fixed = fixedDefs.find(f => f.pos === globalBit);\n      if (fixed !== undefined) {\n        // Bit fixe de classe → rouge, quelle que soit sa valeur\n        bit.className = 'bit fixed-zero class-fixed';\n        bit.textContent = fixed.val;\n      } else if (globalBit < boundary) {\n        // Bit NET (hors bits fixes)\n        bit.className = 'bit net';\n        bit.textContent = '0';\n      } else {\n        // Bit HOST\n        bit.className = 'bit host';\n        bit.textContent = '0';\n      }\n\n      // Séparateur jaune à la frontière NET/HOST\n      if (globalBit === boundary) bit.classList.add('separator');\n\n      bitsRow.appendChild(bit);\n    }\n\n    group.appendChild(bitsRow);\n    grid.appendChild(group);\n  }\n}\n\n/* ═══════════════════════════════════════════\n   RENDER ALL\n═══════════════════════════════════════════ */\nfunction renderAll() {\n  const ip = STATE.ip;\n  const cfg = CLASS_CFG[STATE.cls];\n  const ipInt = ipToInt(ip);\n\n  // IP display octets\n  for (let i = 0; i < 4; i++) {\n    document.getElementById(`o${i}`).textContent = ip[i];\n    document.getElementById(`dec-${i}`).textContent = ip[i];\n  }\n  // Couleurs NET / HOST sur l'IP (A:1 octet NET, B:2, C:3)\n  const nc = STATE.cls === 'A' ? 1 : STATE.cls === 'B' ? 2 : 3;\n  for (let i = 0; i < 4; i++) {\n    const k = i < nc ? 'o-net' : 'o-host';\n    ['o' + i, 'dec-' + i].forEach(id => {\n      const e = document.getElementById(id);\n      if (e) { e.classList.remove('o-net', 'o-host'); e.classList.add(k); }\n    });\n  }\n  document.querySelectorAll('#ip-display .sep').forEach((s, i) => {\n    s.classList.remove('s-net', 's-host');\n    s.classList.add(i + 1 < nc ? 's-net' : 's-host');\n  });\n\n  // Bits\n  const allBits = ip.flatMap(o => toBin8(o).split('').map(Number));\n  const prev = STATE.prevBits;\n\n  for (let i = 0; i < 32; i++) {\n    const el = document.getElementById(`bit-${i}`);\n    if (!el) continue;\n    const changed = prev && prev[i] !== allBits[i];\n    // Les bits fixes gardent leur valeur affichée (0 ou 1 selon la classe)\n    if (!el.classList.contains('class-fixed')) {\n      el.textContent = allBits[i];\n    }\n    if (changed && !el.classList.contains('class-fixed')) {\n      el.classList.remove('changed');\n      void el.offsetWidth;\n      el.classList.add('changed');\n    }\n  }\n  STATE.prevBits = allBits;\n\n  // Sync slider\n  const slider = document.getElementById('ip-slider');\n  slider.value = ipInt;\n  updateSliderFill();\n\n  // Sync private slider if IP is within private range\n  const privSlider = document.getElementById('priv-slider');\n  if (privSlider && ipInt >= parseInt(privSlider.min) && ipInt <= parseInt(privSlider.max)) {\n    if (document.activeElement !== privSlider) {\n      privSlider.value = ipInt;\n      updatePrivSliderFill();\n    }\n  }\n\n  // Input field\n  const inputEl = document.getElementById('ip-input');\n  if (document.activeElement !== inputEl) {\n    inputEl.value = ipStr(ip);\n    inputEl.classList.remove('invalid');\n  }\n\n  // Private check\n  const isPrivate = checkPrivate(ip, cfg);\n  const display = document.getElementById('ip-display');\n  const badge = document.getElementById('ip-type-badge');\n  const privInd = document.getElementById('priv-ind');\n\n  display.classList.toggle('is-private', isPrivate);\n\n  if (isPrivate) {\n    badge.className = 'ip-type-badge ip-type-private';\n    badge.textContent = '🔒 PRIVÉE';\n    privInd.classList.add('visible');\n  } else {\n    badge.className = 'ip-type-badge ip-type-public';\n    badge.textContent = '🌐 PUBLIQUE';\n    privInd.classList.remove('visible');\n  }\n\n  // Highlight private zones\n  updatePrivZoneHighlights(ip, cfg);\n  colorIPs();\n}\n\n/* ═══════════════════════════════════════════\n   PRIVATE LOGIC\n═══════════════════════════════════════════ */\nfunction checkPrivate(ip, cfg) {\n  const v = ipToInt(ip);\n  for (const r of cfg.privRanges) {\n    if (v >= ipToInt(r.start) && v <= ipToInt(r.end)) return true;\n  }\n  return false;\n}\n\nfunction renderPrivZones(cls) {\n  const cfg = CLASS_CFG[cls];\n  const container = document.getElementById('priv-zones');\n  container.innerHTML = '';\n\n  // Setup private slider using first private range\n  const firstPriv = cfg.privRanges[0];\n  const privSlider = document.getElementById('priv-slider');\n  const privStart = ipToInt(firstPriv.start);\n  const privEnd = ipToInt(firstPriv.end);\n  privSlider.min = privStart;\n  privSlider.max = privEnd;\n  privSlider.value = privStart;\n  document.getElementById('priv-slider-val').textContent = ipStr(firstPriv.start);\n  document.getElementById('priv-tick-start').textContent = ipStr(firstPriv.start);\n  document.getElementById('priv-tick-end').textContent = ipStr(firstPriv.end);\n  updatePrivSliderFill();\n\n  cfg.privRanges.forEach((r, i) => {\n    const div = document.createElement('div');\n    div.className = 'priv-zone';\n    div.id = `priv-zone-${i}`;\n    div.innerHTML = `\n      <div class=\"pz-progress\" id=\"pz-prog-${i}\"><\/div>\n      <div class=\"pz-name\">${r.name}<\/div>\n      <div style=\"display:flex;flex-direction:column;gap:.15rem;flex:1;\">\n        <div class=\"pz-range\">${r.label}<\/div>\n        <div class=\"pz-current\" id=\"pz-cur-${i}\" style=\"font-size:.65rem;color:var(--priv-col);font-weight:700;opacity:0;transition:opacity .3s;\"><\/div>\n      <\/div>\n      <div class=\"pz-badge\" id=\"pz-badge-${i}\">Public<\/div>\n    `;\n    container.appendChild(div);\n  });\n}\n\nfunction updatePrivZoneHighlights(ip, cfg) {\n  const v = ipToInt(ip);\n  cfg.privRanges.forEach((r, i) => {\n    const zone = document.getElementById(`priv-zone-${i}`);\n    const badge = document.getElementById(`pz-badge-${i}`);\n    const prog = document.getElementById(`pz-prog-${i}`);\n    const curEl = document.getElementById(`pz-cur-${i}`);\n    if (!zone) return;\n\n    const sInt = ipToInt(r.start), eInt = ipToInt(r.end);\n    const inRange = v >= sInt && v <= eInt;\n    zone.classList.toggle('highlighted', inRange);\n\n    if (inRange) {\n      badge.textContent = '🔒 Privée';\n      const pct = ((v - sInt) / (eInt - sInt) * 100).toFixed(1);\n      prog.style.right = (100 - pct) + '%';\n      if (curEl) { curEl.textContent = '▶ ' + ipStr(ip); curEl.style.opacity = '1'; }\n    } else {\n      badge.textContent = 'Public';\n      prog.style.right = '100%';\n      if (curEl) { curEl.style.opacity = '0'; }\n    }\n  });\n}\n\n/* ═══════════════════════════════════════════\n   EVENTS\n═══════════════════════════════════════════ */\nfunction onSlider() {\n  if (!STATE.cls) return;\n  const v = parseInt(document.getElementById('ip-slider').value);\n  STATE.ip = intToIp(v);\n  updateSliderFill();\n  renderAll();\n}\n\nfunction onIPInput() {\n  if (!STATE.cls) return;\n  const raw = document.getElementById('ip-input').value.trim();\n  const parts = raw.split('.').map(p => parseInt(p));\n  const cfg = CLASS_CFG[STATE.cls];\n\n  if (parts.length === 4 && parts.every((p,i) => !isNaN(p) && p >= 0 && p <= 255)) {\n    const v = ipToInt(parts);\n    if (v >= cfg.startInt && v <= cfg.endInt) {\n      document.getElementById('ip-input').classList.remove('invalid');\n      STATE.ip = parts;\n      renderAll();\n    } else {\n      document.getElementById('ip-input').classList.add('invalid');\n    }\n  } else {\n    document.getElementById('ip-input').classList.add('invalid');\n  }\n}\n\nfunction onIPKeydown(e) {\n  if (e.key === 'ArrowUp') {\n    e.preventDefault(); nudgeIP(1);\n  } else if (e.key === 'ArrowDown') {\n    e.preventDefault(); nudgeIP(-1);\n  }\n}\n\nfunction nudgeIP(delta) {\n  if (!STATE.cls) return;\n  const cfg = CLASS_CFG[STATE.cls];\n  const v = ipToInt(STATE.ip) + delta;\n  if (v >= cfg.startInt && v <= cfg.endInt) {\n    STATE.ip = intToIp(v);\n    renderAll();\n  }\n}\n\nfunction goToPrivate() {\n  if (!STATE.cls) return;\n  const firstPriv = CLASS_CFG[STATE.cls].privRanges[0];\n  STATE.ip = [...firstPriv.start];\n  renderAll();\n  // Sync private slider\n  document.getElementById('priv-slider').value = ipToInt(firstPriv.start);\n  updatePrivSliderFill();\n}\n\nfunction updatePrivSliderFill() {\n  const slider = document.getElementById('priv-slider');\n  const v = parseInt(slider.value);\n  const min = parseInt(slider.min);\n  const max = parseInt(slider.max);\n  const pct = ((v - min) / (max - min) * 100).toFixed(2);\n  slider.style.setProperty('--fill', pct + '%');\n  document.getElementById('priv-slider-val').textContent = ipStr(intToIp(v));\n  colorIPs();\n}\n\nfunction onPrivSlider() {\n  if (!STATE.cls) return;\n  const v = parseInt(document.getElementById('priv-slider').value);\n  STATE.ip = intToIp(v);\n  updatePrivSliderFill();\n  renderAll();\n}\n\n/* ═══════════════════════════════════════════\n   THEME\n═══════════════════════════════════════════ */\nfunction toggleTheme() {\n  const body = document.body;\n  const isLight = body.classList.toggle('light');\n  document.getElementById('theme-icon').textContent = isLight ? '🌙' : '☀️';\n  document.getElementById('theme-label').textContent = isLight ? 'Mode sombre' : 'Mode clair';\n}\n\n/* ═══════════════════════════════════════════\n   SECRET CODE — frappe \"0000\" n'importe où\n═══════════════════════════════════════════ */\n(function() {\n  const SECRET = 'ip';\n  let buffer = '';\n\n  document.addEventListener('keydown', function(e) {\n    buffer += e.key;\n    if (buffer.length > SECRET.length) {\n      buffer = buffer.slice(-SECRET.length);\n    }\n    if (buffer === SECRET) {\n      buffer = '';\n      showSecretPage();\n    }\n  });\n\n  function showSecretPage() {\n    const overlay = document.getElementById('secret-overlay');\n    overlay.classList.add('active');\n    // Reset l'animation du texte\n    const crawl = document.getElementById('sw-crawl');\n    crawl.style.animation = 'none';\n    void crawl.offsetWidth;\n    crawl.style.animation = '';\n    // Démarrer le son\n    if (window._startSecretAudio) window._startSecretAudio();\n  }\n\n  window.closeSecret = function() {\n    document.getElementById('secret-overlay').classList.remove('active');\n    if (window.stopSwMusic) window.stopSwMusic();\n  };\n})();\n<\/script>\n\n<\!-- ══════════════════════════════════════════\n     PAGE SECRÈTE — STAR WARS CREDITS\n══════════════════════════════════════════ -->\n<div id=\"secret-overlay\">\n  <button class=\"sw-close\" onclick=\"playSaberClose(); closeSecret();\">✕ Fermer<\/button>\n  <button class=\"sw-audio-btn\" id=\"sw-audio-btn\" onclick=\"toggleSwMusic()\">🔇 Musique OFF<\/button>\n\n  <div class=\"sw-stars\" id=\"sw-stars\"><\/div>\n\n  <div class=\"sw-scene\">\n    <div class=\"sw-intro-text\" id=\"sw-intro\">\n      <p>Il y a bien longtemps, dans une galaxy très très lointaine...<\/p>\n    <\/div>\n\n    <div class=\"sw-logo-wrap\" id=\"sw-logo\">\n      <div class=\"sw-logo\">IP<span>VERSE<\/span><\/div>\n    <\/div>\n\n    <div class=\"sw-perspective\">\n      <div class=\"sw-crawl\" id=\"sw-crawl\">\n\n        <div class=\"sw-title-block\">\n          <p class=\"sw-episode\">Épisode I<\/p>\n          <p class=\"sw-ep-title\">L'ORIGINE DU CODE<\/p>\n        <\/div>\n\n        <p>\n          Dans les confins obscurs du réseau, une application\n          fut forgée pour éclairer les apprentis sur les mystères\n          de l'adressage IPv4 par classes.\n        <\/p>\n\n        <p>\n          Cette odyssée numérique, née de la curiosité et de la passion\n          pour les réseaux informatiques, fut rendue possible grâce à\n          une alliance de forces créatrices hors du commun.\n        <\/p>\n\n        <div class=\"sw-section-title\">— Les Outils de la Force —<\/div>\n\n        <p>\n          <span class=\"sw-highlight\">Claude (Anthropic)<\/span> fut convoqué\n          pour écrire chaque ligne de code HTML, CSS et JavaScript.\n          Son intelligence artificielle sculpta l'interface, les animations\n          et la logique binaire avec une précision redoutable.\n        <\/p>\n\n        <p>\n          <span class=\"sw-highlight\">ChatGPT (OpenAI)<\/span> prit en charge\n          la rédaction des prompts stratégiques, guidant la conception\n          de l'application avec une vision claire et des instructions\n          précises comme un sabre laser.\n        <\/p>\n\n        <p>\n          <span class=\"sw-highlight\">Visual Studio Code<\/span> servit\n          d'arène pour l'assemblage final — éditeur de code légendaire,\n          témoin silencieux de chaque commit et de chaque correction.\n        <\/p>\n\n        <div class=\"sw-section-title\">— Le Maître Jedi —<\/div>\n\n        <p>\n          Derrière tout grand projet se trouve un grand artisan.\n          Cette application fut imaginée, dirigée et façonnée par\n          un seul être humain dont la volonté de partager le savoir\n          ne connaît aucune limite.\n        <\/p>\n\n        <div class=\"sw-creator\">NATHAN BADUEL<\/div>\n\n        <p class=\"sw-creator-title\">Créateur · Architecte du Réseau · Padawan du Code<\/p>\n\n        <p>\n          Que la Force du réseau soit avec toi.\n          Que tes masques soient toujours justes,\n          tes plages d'adresses bien calculées,\n          et tes paquets correctement routés.\n        <\/p>\n\n        <div class=\"sw-section-title\">— Technologies Utilisées —<\/div>\n\n        <p>\n          Ce projet fut entièrement réalisé en\n          <span class=\"sw-highlight\">HTML · CSS · JavaScript<\/span>\n          — trois disciplines fondamentales du côté lumineux du\n          développement web. Aucun framework. Aucune dépendance.\n          Juste du code pur, comme à l'ère ancienne.\n        <\/p>\n\n        <p>\n          Les polices <span class=\"sw-highlight\">JetBrains Mono<\/span> et\n          <span class=\"sw-highlight\">Syne<\/span> accompagnèrent chaque\n          caractère affiché, apportant élégance et lisibilité\n          à cet univers binaire.\n        <\/p>\n\n        <div class=\"sw-section-title\">— Remerciements —<\/div>\n\n        <p>\n          À tous ceux qui cherchent à comprendre comment fonctionne\n          Internet, à ceux qui ont eu la curiosité de taper\n          <span class=\"sw-highlight\">0000<\/span> pour découvrir\n          cette page cachée — vous êtes des êtres d'exception.\n        <\/p>\n\n        <p>\n          L'apprentissage des réseaux est un voyage sans fin.\n          Chaque classe IP, chaque masque de sous-réseau,\n          chaque adresse privée est une étoile dans un univers\n          infiniment vaste.\n        <\/p>\n\n        <p class=\"sw-final\">\n          Que la paix et la connaissance règnent<br>\n          dans tous les sous-réseaux de la galaxie.\n        <\/p>\n\n        <div class=\"sw-end-logo\">✦ FIN ✦<\/div>\n\n      <\/div>\n    <\/div>\n  <\/div>\n<\/div>\n\n<style>\n/* ══════════ SECRET OVERLAY ══════════ */\n#secret-overlay {\n  display: none;\n  position: fixed;\n  inset: 0;\n  z-index: 9999;\n  background: #000;\n  overflow: hidden;\n  font-family: 'JetBrains Mono', monospace;\n}\n#secret-overlay.active { display: block; }\n\n.sw-close {\n  position: absolute;\n  top: 1.2rem; right: 1.5rem;\n  z-index: 10000;\n  background: rgba(255,232,31,0.15);\n  border: 2px solid rgba(255,232,31,0.6);\n  color: #ffe81f;\n  font-family: 'JetBrains Mono', monospace;\n  font-size: .85rem;\n  font-weight: 700;\n  letter-spacing: .15em;\n  padding: .6rem 1.4rem;\n  border-radius: 20px;\n  cursor: pointer;\n  transition: all .2s;\n  text-shadow: 0 0 10px rgba(255,232,31,.5);\n}\n.sw-close:hover {\n  background: rgba(255,232,31,0.3);\n  box-shadow: 0 0 20px rgba(255,232,31,0.5);\n}\n\n/* ══════════ STARS ══════════ */\n.sw-stars {\n  position: absolute;\n  inset: 0;\n  pointer-events: none;\n}\n\n/* ══════════ SCENE STRUCTURE ══════════ */\n.sw-scene {\n  position: absolute;\n  inset: 0;\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  justify-content: center;\n}\n\n/* ══════════ INTRO TEXT ══════════ */\n.sw-intro-text {\n  position: absolute;\n  inset: 0;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  z-index: 5;\n  animation: swIntroFade 5s ease forwards;\n}\n.sw-intro-text p {\n  color: #4fc3f7;\n  font-size: clamp(1.3rem, 3.5vw, 2.2rem);\n  letter-spacing: .08em;\n  text-align: center;\n  font-style: italic;\n  opacity: 0;\n  animation: swIntroText 5s ease forwards;\n  text-shadow:\n    0 0 20px rgba(79,195,247,.7),\n    2px 2px 0 #000,\n    3px 3px 0 #001a2e;\n}\n@keyframes swIntroText {\n  0%   { opacity: 0; }\n  20%  { opacity: 1; }\n  70%  { opacity: 1; }\n  100% { opacity: 0; }\n}\n@keyframes swIntroFade {\n  0%,80% { pointer-events: auto; }\n  100%   { pointer-events: none; opacity: 0; }\n}\n\n/* ══════════ LOGO FLASH ══════════ */\n.sw-logo-wrap {\n  position: absolute;\n  inset: 0;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  z-index: 4;\n  pointer-events: none;\n  animation: swLogoAnim 3s 4.5s ease forwards;\n  opacity: 0;\n}\n.sw-logo {\n  font-family: sans-serif;\n  font-size: clamp(5rem, 18vw, 13rem);\n  font-weight: 900;\n  color: #ffe81f;\n  letter-spacing: -.02em;\n  text-shadow:\n    /* Contour noir épais 3D */\n    -4px -4px 0 #000,\n     4px -4px 0 #000,\n    -4px  4px 0 #000,\n     4px  4px 0 #000,\n    -6px -6px 0 #111,\n     6px -6px 0 #111,\n    -6px  6px 0 #111,\n     6px  6px 0 #111,\n    /* Profondeur 3D */\n    8px 8px 0 #332200,\n    10px 10px 0 #221800,\n    /* Glow */\n    0 0 50px rgba(255,232,31,.9),\n    0 0 100px rgba(255,232,31,.6),\n    0 0 200px rgba(255,232,31,.3);\n}\n.sw-logo span {\n  color: #fff;\n  text-shadow:\n    -4px -4px 0 #000,\n     4px -4px 0 #000,\n    -4px  4px 0 #000,\n     4px  4px 0 #000,\n    -6px -6px 0 #111,\n     6px -6px 0 #111,\n    -6px  6px 0 #111,\n     6px  6px 0 #111,\n    8px 8px 0 #222,\n    10px 10px 0 #111,\n    0 0 50px rgba(255,255,255,.7),\n    0 0 100px rgba(79,195,247,.4);\n}\n\n@keyframes swLogoAnim {\n  0%   { opacity: 0; transform: scale(1.8); }\n  25%  { opacity: 1; transform: scale(1); }\n  65%  { opacity: 1; transform: scale(.55); }\n  100% { opacity: 0; transform: scale(.1); }\n}\n\n/* ══════════ PERSPECTIVE CRAWL ══════════ */\n.sw-perspective {\n  position: absolute;\n  inset: 0;\n  perspective: 500px;\n  perspective-origin: 50% 88%;\n  overflow: hidden;\n}\n\n.sw-crawl {\n  position: absolute;\n  top: 100%;\n  left: 50%;\n  width: clamp(320px, 72vw, 900px);\n  color: #ffe81f;\n  text-align: center;\n  line-height: 2;\n  padding: 0 2rem 80vh;\n  transform: translateX(-50%) rotateX(25deg);\n  transform-origin: 50% 100%;\n  animation: swCrawl 65s 8.5s linear forwards;\n  opacity: 0;\n}\n\n@keyframes swCrawl {\n  0%   { opacity: 1; top: 100%; }\n  100% { opacity: 1; top: -420%; }\n}\n\n/* ══════════ TEXTE 3D AVEC CONTOUR ══════════ */\n.sw-crawl p {\n  font-size: clamp(1.4rem, 2.8vw, 2rem);\n  margin-bottom: 1.8em;\n  letter-spacing: .05em;\n  text-shadow:\n    /* Contour noir net */\n    -2px -2px 0 #000,\n     2px -2px 0 #000,\n    -2px  2px 0 #000,\n     2px  2px 0 #000,\n    /* Profondeur 3D */\n    4px  4px 0 #332200,\n    6px  6px 2px rgba(0,0,0,.8),\n    /* Glow subtil */\n    0 0 20px rgba(255,232,31,.25);\n}\n\n.sw-title-block {\n  margin: 0 auto 3rem;\n}\n\n.sw-episode {\n  font-size: clamp(1.4rem, 3vw, 2.2rem);\n  letter-spacing: .4em;\n  text-transform: uppercase;\n  margin-bottom: .6rem;\n  opacity: .9;\n  text-shadow:\n    -2px -2px 0 #000,  2px -2px 0 #000,\n    -2px  2px 0 #000,   2px  2px 0 #000,\n    4px 4px 0 #332200;\n}\n\n.sw-ep-title {\n  font-family: sans-serif;\n  font-size: clamp(3rem, 6vw, 5rem);\n  font-weight: 900;\n  letter-spacing: .1em;\n  line-height: 1.15;\n  margin-bottom: 2.5rem;\n  color: #ffe81f;\n  text-shadow:\n    /* Contour noir épais */\n    -3px -3px 0 #000,  3px -3px 0 #000,\n    -3px  3px 0 #000,   3px  3px 0 #000,\n    -5px -5px 0 #111,  5px -5px 0 #111,\n    -5px  5px 0 #111,   5px  5px 0 #111,\n    /* Relief 3D */\n    6px  6px 0 #332200,\n    8px  8px 0 #221800,\n    10px 10px 4px rgba(0,0,0,.9),\n    /* Glow */\n    0 0 30px rgba(255,232,31,.4);\n}\n\n.sw-section-title {\n  font-family: sans-serif;\n  font-size: clamp(1.4rem, 3vw, 2.2rem);\n  font-weight: 800;\n  letter-spacing: .25em;\n  color: #fff;\n  margin: 3rem 0 2rem;\n  text-transform: uppercase;\n  text-shadow:\n    -2px -2px 0 #000,  2px -2px 0 #000,\n    -2px  2px 0 #000,   2px  2px 0 #000,\n    4px 4px 0 #222,\n    6px 6px 2px rgba(0,0,0,.8),\n    0 0 25px rgba(255,255,255,.3);\n}\n\n.sw-highlight {\n  color: #fff;\n  font-weight: 800;\n  text-shadow:\n    -2px -2px 0 #000,  2px -2px 0 #000,\n    -2px  2px 0 #000,   2px  2px 0 #000,\n    3px 3px 0 #222,\n    0 0 15px rgba(255,255,255,.6);\n}\n\n.sw-creator {\n  font-family: sans-serif;\n  font-size: clamp(3rem, 8vw, 7rem);\n  font-weight: 900;\n  letter-spacing: .12em;\n  color: #fff;\n  text-shadow:\n    /* Contour noir épais */\n    -4px -4px 0 #000,  4px -4px 0 #000,\n    -4px  4px 0 #000,   4px  4px 0 #000,\n    -6px -6px 0 #111,  6px -6px 0 #111,\n    -6px  6px 0 #111,   6px  6px 0 #111,\n    /* Relief 3D profond */\n    7px  7px 0 #1a1a1a,\n    9px  9px 0 #111,\n    11px 11px 4px rgba(0,0,0,.9),\n    /* Glow */\n    0 0 40px rgba(255,255,255,.8),\n    0 0 80px rgba(79,195,247,.5);\n  margin: 1.5rem 0 .75rem;\n}\n\n.sw-creator-title {\n  font-size: clamp(1.3rem, 2.8vw, 2rem);\n  letter-spacing: .22em;\n  color: #4fc3f7;\n  margin-bottom: 2.5rem !important;\n  text-shadow:\n    -2px -2px 0 #000,  2px -2px 0 #000,\n    -2px  2px 0 #000,   2px  2px 0 #000,\n    3px 3px 0 #001a2e,\n    0 0 20px rgba(79,195,247,.5);\n}\n\n.sw-final {\n  font-size: clamp(1.4rem, 3vw, 2.2rem);\n  font-style: italic;\n  color: #fff;\n  opacity: .9;\n  line-height: 2.2 !important;\n  text-shadow:\n    -2px -2px 0 #000,  2px -2px 0 #000,\n    -2px  2px 0 #000,   2px  2px 0 #000,\n    4px 4px 0 #222,\n    0 0 20px rgba(255,255,255,.2);\n}\n\n.sw-end-logo {\n  font-family: sans-serif;\n  font-size: clamp(2.5rem, 6vw, 4.5rem);\n  font-weight: 900;\n  letter-spacing: .45em;\n  color: #ffe81f;\n  text-shadow:\n    -3px -3px 0 #000,  3px -3px 0 #000,\n    -3px  3px 0 #000,   3px  3px 0 #000,\n    5px 5px 0 #332200,\n    7px 7px 3px rgba(0,0,0,.8),\n    0 0 40px rgba(255,232,31,.6);\n  margin-top: 4rem;\n}\n\n/* ══════════ AUDIO CONTROLS ══════════ */\n.sw-audio-btn {\n  position: absolute;\n  top: 1.2rem; left: 1.5rem;\n  z-index: 10000;\n  background: rgba(255,232,31,0.15);\n  border: 2px solid rgba(255,232,31,0.6);\n  color: #ffe81f;\n  font-family: 'JetBrains Mono', monospace;\n  font-size: .85rem;\n  font-weight: 700;\n  letter-spacing: .1em;\n  padding: .6rem 1.2rem;\n  border-radius: 20px;\n  cursor: pointer;\n  transition: all .2s;\n  text-shadow: 0 0 10px rgba(255,232,31,.5);\n}\n.sw-audio-btn:hover {\n  background: rgba(255,232,31,0.3);\n  box-shadow: 0 0 20px rgba(255,232,31,0.5);\n}\n<\/style>\n\n<script>\n/* ══════════ GENERATE STARS (TWINKLING) ══════════ */\n(function() {\n  const container = document.getElementById('sw-stars');\n  if (!container) return;\n  const canvas = document.createElement('canvas');\n  canvas.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;';\n  container.appendChild(canvas);\n\n  let stars = [];\n\n  function initStars() {\n    canvas.width = window.innerWidth;\n    canvas.height = window.innerHeight;\n    stars = [];\n    for (let i = 0; i < 350; i++) {\n      stars.push({\n        x: Math.random() * canvas.width,\n        y: Math.random() * canvas.height,\n        r: Math.random() * 1.8 + 0.2,\n        alpha: Math.random(),\n        speed: Math.random() * 0.015 + 0.003,\n        dir: Math.random() > 0.5 ? 1 : -1,\n      });\n    }\n  }\n\n  function animStars() {\n    const ctx = canvas.getContext('2d');\n    ctx.clearRect(0, 0, canvas.width, canvas.height);\n    stars.forEach(s => {\n      s.alpha += s.speed * s.dir;\n      if (s.alpha >= 1 || s.alpha <= 0.05) s.dir *= -1;\n      ctx.beginPath();\n      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);\n      ctx.fillStyle = `rgba(255,255,255,${s.alpha.toFixed(2)})`;\n      ctx.fill();\n    });\n    requestAnimationFrame(animStars);\n  }\n\n  initStars();\n  animStars();\n  window.addEventListener('resize', initStars);\n})();\n<\/script>\n\n<script>\n/* ══════════ STAR WARS MUSIC + SFX via Web Audio API ══════════ */\n(function() {\n  let audioCtx = null;\n  let musicNodes = [];\n  let musicPlaying = false;\n  let musicScheduled = false;\n\n  function getCtx() {\n    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();\n    return audioCtx;\n  }\n\n  /* ── Bruitage : whoosh d'ouverture ── */\n  function playWhoosh() {\n    const ctx = getCtx();\n    const bufLen = ctx.sampleRate * 1.2;\n    const buf = ctx.createBuffer(1, bufLen, ctx.sampleRate);\n    const data = buf.getChannelData(0);\n    for (let i = 0; i < bufLen; i++) {\n      const t = i / ctx.sampleRate;\n      const env = Math.exp(-t * 3.5) * (1 - Math.exp(-t * 60));\n      data[i] = (Math.random() * 2 - 1) * env;\n    }\n    const src = ctx.createBufferSource();\n    src.buffer = buf;\n    const filter = ctx.createBiquadFilter();\n    filter.type = 'bandpass';\n    filter.frequency.setValueAtTime(800, ctx.currentTime);\n    filter.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 1.2);\n    filter.Q.value = 2;\n    const gain = ctx.createGain();\n    gain.gain.setValueAtTime(0.5, ctx.currentTime);\n    gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 1.2);\n    src.connect(filter);\n    filter.connect(gain);\n    gain.connect(ctx.destination);\n    src.start();\n  }\n\n  /* ── Note helper ── */\n  function playNote(freq, startTime, duration, gain, type = 'sawtooth') {\n    const ctx = getCtx();\n    const osc = ctx.createOscillator();\n    const gainNode = ctx.createGain();\n    const filter = ctx.createBiquadFilter();\n\n    osc.type = type;\n    osc.frequency.setValueAtTime(freq, startTime);\n\n    filter.type = 'lowpass';\n    filter.frequency.value = 2200;\n    filter.Q.value = 1;\n\n    gainNode.gain.setValueAtTime(0, startTime);\n    gainNode.gain.linearRampToValueAtTime(gain, startTime + 0.04);\n    gainNode.gain.setValueAtTime(gain, startTime + duration - 0.08);\n    gainNode.gain.linearRampToValueAtTime(0, startTime + duration);\n\n    // Légère reverb simulée\n    const delay = ctx.createDelay(0.3);\n    delay.delayTime.value = 0.18;\n    const delayGain = ctx.createGain();\n    delayGain.gain.value = 0.18;\n\n    osc.connect(filter);\n    filter.connect(gainNode);\n    gainNode.connect(ctx.destination);\n    gainNode.connect(delay);\n    delay.connect(delayGain);\n    delayGain.connect(ctx.destination);\n\n    osc.start(startTime);\n    osc.stop(startTime + duration + 0.1);\n\n    musicNodes.push(osc);\n  }\n\n  /* ── Thème principal Star Wars (mélodie + harmonies) ── */\n  function scheduleSWTheme(startOffset) {\n    const ctx = getCtx();\n    const t0 = ctx.currentTime + startOffset;\n\n    // Fréquences (Do Majeur transposé)\n    const C4=261.63, D4=293.66, E4=329.63, F4=349.23,\n          G4=392.00, A4=440.00, B4=493.88,\n          C5=523.25, D5=587.33, E5=659.25, F5=698.46,\n          G5=783.99, A5=880.00,\n          G3=196.00, C3=130.81, F3=174.61;\n\n    // Mélodie principale — thème Star Wars simplifié\n    const melody = [\n      // Fanfare intro\n      [G4, 0,    0.35], [G4, 0.38, 0.35], [G4, 0.76, 0.35],\n      [C5, 1.14, 0.7],  [G5, 1.88, 0.55],\n      [F5, 2.5,  0.25], [E5, 2.78, 0.25], [D5, 3.06, 0.25], [C5, 3.34, 0.7],\n      [G5, 4.1,  0.55],\n      [F5, 4.7,  0.25], [E5, 4.98, 0.25], [D5, 5.26, 0.25], [C5, 5.54, 0.7],\n      [G5, 6.3,  0.55],\n      [F5, 6.9,  0.25], [E5, 7.18, 0.25], [F5, 7.46, 0.25], [D5, 7.74, 0.9],\n      // Deuxième phrase\n      [G4, 8.8,  0.35], [G4, 9.18, 0.35], [G4, 9.56, 0.35],\n      [C5, 9.94, 0.7],  [G5, 10.68, 0.55],\n      [F5, 11.28, 0.25],[E5, 11.56, 0.25],[D5, 11.84, 0.25],[C5, 12.12, 0.7],\n      [G5,
