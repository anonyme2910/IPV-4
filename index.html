<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPv4 — Accueil</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#050810;font-family:'JetBrains Mono',monospace;color:#e8f0ff}

/* ───────── ACCUEIL ───────── */
#home{
  position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2.8rem;padding:1.5rem;overflow:auto;
  background:
    radial-gradient(ellipse 60% 55% at 15% 15%,rgba(0,136,204,.28) 0%,transparent 70%),
    radial-gradient(ellipse 55% 55% at 88% 85%,rgba(119,34,204,.30) 0%,transparent 70%),
    radial-gradient(ellipse 40% 40% at 50% 50%,rgba(0,255,157,.06) 0%,transparent 70%),
    #050810;
}
#bg{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#home .hero,#home .choices{position:relative;z-index:1}
#home.hidden{display:none}
.hero{text-align:center}
.tag{font-size:.62rem;letter-spacing:.4em;color:#ffb020;text-transform:uppercase;margin-bottom:.8rem;opacity:.85}
.title{font-family:sans-serif;font-size:clamp(3rem,10vw,6rem);font-weight:800;letter-spacing:-.03em;line-height:.95;color:#fff}
.title span{color:#ffb020;text-shadow:0 0 40px rgba(255,176,32,.5)}
.sub{font-size:.78rem;color:#8aabcc;letter-spacing:.05em;margin-top:1rem}
.line{width:120px;height:1px;background:linear-gradient(90deg,transparent,#ffb020,transparent);margin:1rem auto 0}

.choices{display:grid;grid-template-columns:1fr 1fr;gap:1.4rem;width:100%;max-width:760px}
@media(max-width:620px){.choices{grid-template-columns:1fr}}
.choice{
  position:relative;overflow:hidden;cursor:pointer;text-align:left;font-family:inherit;color:inherit;
  background:#0a0f1e;border:1px solid #1a2540;border-radius:18px;padding:2rem 1.8rem;
  display:flex;flex-direction:column;gap:.7rem;
  transition:transform .3s,border-color .3s,box-shadow .3s;
}
.choice::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--a),var(--b));opacity:.07;transition:opacity .3s}
.choice::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--b),transparent)}
.choice:hover{transform:translateY(-6px);border-color:var(--b);box-shadow:0 22px 50px rgba(0,0,0,.5),0 0 34px var(--g)}
.choice:hover::before{opacity:.16}
.choice>*{position:relative;z-index:1}
.c-cours{--a:#00a86b;--b:#00e5a0;--g:rgba(0,229,160,.22)}
.c-quiz{--a:#c2185b;--b:#ff4d8d;--g:rgba(255,77,141,.22)}
.c-icon{font-size:2.6rem;line-height:1}
.c-name{font-family:sans-serif;font-size:2.2rem;font-weight:900;letter-spacing:.04em;color:var(--b)}
.c-desc{font-size:.72rem;line-height:1.6;color:#8aabcc}
.c-go{margin-top:.4rem;font-size:.68rem;font-weight:700;letter-spacing:.18em;color:var(--b)}

/* ───────── PAGES COURS / QUIZ ───────── */
.page{position:fixed;inset:0;display:none;background:#050810}
.page.on{display:block}
/* fine bande à gauche : la page ne perd que de la largeur (jamais de hauteur) */
.rail{position:absolute;top:0;left:0;bottom:0;width:46px;display:flex;flex-direction:column;align-items:center;padding-top:8px;gap:10px;background:#050810;border-right:1px solid #1a2540}
.back{
  width:34px;height:34px;border-radius:50%;cursor:pointer;border:1px solid #243050;background:#0a0f1e;color:#e8f0ff;
  font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s,border-color .15s;
}
.back:hover{background:#00d4ff;color:#050810;border-color:#00d4ff}
.rail-label{writing-mode:vertical-rl;transform:rotate(180deg);font-size:.6rem;letter-spacing:.3em;color:#5a7399;text-transform:uppercase;user-select:none}
.page iframe{position:absolute;top:0;left:46px;width:calc(100% - 46px);height:100%;border:0;background:#050810}

/* ───────── MULTIJOUEUR ───────── */
.c-multi{--a:#d98a00;--b:#ffb020;--g:rgba(255,176,32,.22);grid-column:1/-1;flex-direction:row;align-items:center;gap:1.2rem;padding:1.3rem 1.8rem}
@media(max-width:620px){.c-multi{flex-direction:column;align-items:flex-start}}
.c-multi .c-name{font-size:1.6rem}
.c-multi .c-txt{display:flex;flex-direction:column;gap:.35rem;flex:1}
.c-multi .c-go{margin-top:0;white-space:nowrap}
#mp-modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(3,6,14,.78)}
#mp-modal.show{display:flex}
.mp-box{width:100%;max-width:400px;background:#0a0f1e;border:1px solid #243050;border-radius:18px;padding:1.6rem;display:flex;flex-direction:column;gap:.9rem;box-shadow:0 22px 60px rgba(0,0,0,.6);font-family:'JetBrains Mono',monospace}
.mp-title{font-family:sans-serif;font-size:1.4rem;font-weight:900;color:#ffb020;letter-spacing:.04em}
.mp-txt{font-size:.74rem;line-height:1.6;color:#8aabcc}
.mp-btn{font-family:inherit;font-size:.8rem;font-weight:700;cursor:pointer;border-radius:12px;border:1px solid #243050;background:#0f1730;color:#e8f0ff;padding:.85rem 1rem;transition:background .15s,border-color .15s}
.mp-btn:hover{background:#16224a;border-color:#ffb020}
.mp-btn.main{background:#ffb020;color:#050810;border-color:#ffb020}
.mp-btn.main:hover{background:#ffc552}
.mp-btn:disabled{opacity:.45;cursor:default}
.mp-input{font-family:inherit;font-size:1rem;font-weight:700;border-radius:10px;border:1px solid #243050;background:#050810;color:#e8f0ff;padding:.7rem .9rem;width:100%}
.mp-input:focus{outline:none;border-color:#ffb020}
.mp-input.code{text-align:center;letter-spacing:.15em;text-transform:uppercase;font-size:1.1rem}
.mp-code{font-size:1.7rem;font-weight:700;letter-spacing:.18em;text-align:center;word-break:break-all;color:#ffb020;background:#050810;border:1px dashed #6b4a00;border-radius:12px;padding:.8rem .5rem;cursor:pointer;user-select:all}
.mp-players{display:flex;flex-direction:column;gap:.35rem;max-height:150px;overflow:auto}
.mp-player{font-size:.78rem;font-weight:700;background:rgba(255,255,255,.05);border-radius:8px;padding:.4rem .7rem;color:#cfe3f5}
.mp-err{font-size:.72rem;font-weight:700;color:#ff8a8a;min-height:1em}
.mp-row{display:flex;gap:.6rem}.mp-row>*{flex:1}

/* ───────── MODE SURVEILLÉ / RÉSULTATS ───────── */
.mp-box.wide{max-width:980px}
#mp-res{position:fixed;inset:0;z-index:61;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(3,6,14,.78)}
#mp-res.show{display:flex}
#mp-resbtn{position:fixed;left:4px;bottom:12px;z-index:55;width:38px;height:38px;border-radius:50%;border:1px solid #6b4a00;background:#0a0f1e;color:#ffb020;font-size:1.1rem;cursor:pointer;display:none;align-items:center;justify-content:center}
#mp-resbtn:hover{background:#16224a}
#mp-badge{position:fixed;top:6px;left:50%;transform:translateX(-50%);z-index:55;display:none;background:rgba(10,15,30,.92);border:1px solid #6b4a00;color:#ffb020;font:700 .68rem 'JetBrains Mono',monospace;padding:.35rem .8rem;border-radius:999px;pointer-events:none;white-space:nowrap}
#mp-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:70;display:none;max-width:90%;background:#3a1010;border:1px solid #ff8a8a;color:#ffd0d0;font:700 .75rem 'JetBrains Mono',monospace;padding:.7rem 1rem;border-radius:12px;text-align:center}
.mp-tbl-wrap{overflow-x:auto}
.mp-tbl{width:100%;border-collapse:collapse;font-size:.7rem;color:#cfe3f5}
.mp-tbl th{text-align:left;color:#8aabcc;font-weight:700;padding:.4rem .5rem;border-bottom:1px solid #243050;white-space:nowrap}
.mp-tbl td{padding:.45rem .5rem;border-bottom:1px solid #131c36;white-space:nowrap}
.mp-tbl td.bad{color:#ff8a8a;font-weight:700}
.mp-chk{display:flex;gap:.6rem;align-items:flex-start;font-size:.72rem;color:#cfe3f5;line-height:1.5;cursor:pointer}
.mp-chk span{color:#8aabcc}

.mp-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:.45rem;vertical-align:middle}
.mp-cell{display:inline-block;font-weight:700;border-radius:8px;padding:.35rem .6rem;text-align:left}
.mp-sub{display:block;font-size:.62rem;font-weight:600;opacity:.92;margin-top:.15rem}
.mp-cell small{opacity:.8;font-weight:600;margin-left:.3rem}

#mp-res.full{padding:0;background:#050810}
#mp-res.full>.mp-box{max-width:none;width:100%;height:100%;border-radius:0;border:0;box-shadow:none;overflow:auto;padding:1.2rem 1.8rem}
#mp-res.full .mp-tbl-wrap{flex:1}
#mp-res.full #mp-resbox .mp-title{font-size:1.9rem}
#mp-res.full #mp-resbox .mp-txt{font-size:.85rem}
#mp-res.full .mp-tbl{font-size:1rem}
#mp-res.full .mp-tbl th{padding:.8rem .9rem;font-size:.85rem}
#mp-res.full .mp-tbl td{padding:.75rem .9rem}
#mp-res.full .mp-cell{font-size:1.05rem;padding:.5rem 1rem}
.mp-head{display:flex;align-items:center;justify-content:space-between;gap:.8rem;flex-wrap:wrap}
.mp-tools{display:flex;gap:.5rem;flex-wrap:wrap}
.mp-tools .mp-btn{padding:.55rem .9rem;white-space:nowrap}

/* ───────── EXPORT (flèche) + EXPULSION ───────── */
.mp-split{display:flex}
.mp-tools .mp-split .mp-btn:first-child{border-radius:12px 0 0 12px}
.mp-tools .mp-split .mp-arrow{border-radius:0 12px 12px 0;border-left:1px solid #6b4a00;padding:.55rem .65rem}
.mp-kick{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;margin-left:.6rem;padding:0;border:1px solid #ff6b6b;border-radius:8px;background:rgba(255,80,80,.14);color:#ff8a8a;cursor:pointer;vertical-align:middle}
.mp-kick:hover{background:#ff5050;color:#fff}
.mp-tools .mp-dlgo{border-color:#ffb020;color:#ffb020}
.mp-tools .mp-dlgo:hover{background:#ffb020;color:#050810}
.mp-player.has-kick{display:flex;align-items:center;justify-content:space-between}

.mp-tools .mp-gear{display:inline-flex;align-items:center;justify-content:center;padding:.55rem .7rem}
.mp-tools .mp-gear.on{border-color:#ffb020;color:#ffb020;background:rgba(255,176,32,.14)}
.mp-frz{margin-left:.8rem;font-size:.7rem;font-weight:800;color:#050810;background:#ffb020;border-radius:999px;padding:.25rem .7rem;vertical-align:middle;letter-spacing:.04em;font-family:'JetBrains Mono',monospace}

/* ───────── DÉFI FLASH ───────── */
@keyframes mpFlashPop{0%{opacity:0;transform:scale(.6)}12%{opacity:1;transform:scale(1.08)}22%{transform:scale(1)}85%{opacity:1}100%{opacity:0;transform:scale(1)}}
@keyframes mpFlashPulse{0%,100%{box-shadow:0 0 6px rgba(255,176,32,.4)}50%{box-shadow:0 0 22px rgba(255,176,32,.95)}}
#mp-flashsplash{position:fixed;inset:0;z-index:450;display:flex;align-items:center;justify-content:center;pointer-events:none;background:rgba(5,8,16,.55)}
#mp-flashsplash .fs-box{text-align:center;padding:1.6rem 2rem;max-width:90%;border:2px solid #ffb020;border-radius:20px;background:rgba(10,15,30,.96);box-shadow:0 0 60px rgba(255,176,32,.55);font-family:'JetBrains Mono',monospace;animation:mpFlashPop 4s ease forwards}
#mp-flashsplash .fs-ic{font-size:3.4rem;line-height:1}
#mp-flashsplash .fs-t{font-family:sans-serif;font-size:2rem;font-weight:900;color:#ffb020;letter-spacing:.06em;margin:.4rem 0}
#mp-flashsplash .fs-s{font-size:.95rem;font-weight:700;line-height:1.6;color:#e8f0ff}
#mp-flashbar{position:fixed;top:34px;left:50%;transform:translateX(-50%);z-index:56;max-width:92%;text-align:center;background:rgba(10,15,30,.95);border:1px solid #ffb020;color:#ffb020;font:700 .72rem 'JetBrains Mono',monospace;padding:.4rem .9rem;border-radius:999px;pointer-events:none;animation:mpFlashPulse 1.2s ease-in-out infinite}
#mp-flashbar.win{border-color:#5ca03a;color:#a8e08a;animation:none}

.c-quiz2{--a:#6d28d9;--b:#a78bfa;--g:rgba(167,139,250,.25)}
.c-quiz3{--a:#0f766e;--b:#2dd4bf;--g:rgba(45,212,191,.25)}
.hubwrap{position:absolute;top:0;bottom:0;left:46px;right:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2rem;padding:1.5rem;overflow:auto;
  background:radial-gradient(ellipse 60% 55% at 15% 15%,rgba(255,77,141,.16) 0%,transparent 70%),radial-gradient(ellipse 55% 55% at 88% 85%,rgba(119,34,204,.28) 0%,transparent 70%),#050810}
.hubchoices{max-width:900px}
.choice:disabled{opacity:.4;cursor:not-allowed;filter:grayscale(.8)}
.choice:disabled:hover{transform:none;box-shadow:none}
.mp-quizopts{display:flex;flex-direction:column;gap:.5rem;padding:.7rem .8rem;border:1px solid #243050;border-radius:12px;background:#0c1224}

.admin-btn{position:absolute;top:10px;right:12px;z-index:20;font-family:'JetBrains Mono',monospace;font-size:.62rem;font-weight:700;letter-spacing:.08em;color:#6f87a8;background:rgba(10,15,30,.6);border:1px solid #243050;border-radius:8px;padding:.28rem .6rem;cursor:pointer;opacity:.7;transition:opacity .15s,border-color .15s,color .15s}
.admin-btn:hover{opacity:1;border-color:#7c3aed;color:#c4b5fd}
.admin-btn.on{opacity:1;color:#86efac;border-color:#22c55e;background:rgba(34,197,94,.12)}
#adm-modal{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(3,6,14,.8)}
#adm-modal.show{display:flex}
.adm-box{width:100%;max-width:320px;background:#0a0f1e;border:1px solid #243050;border-radius:16px;padding:1.3rem;display:flex;flex-direction:column;gap:.8rem;box-shadow:0 22px 60px rgba(0,0,0,.6)}
.adm-title{font-family:sans-serif;font-size:1.1rem;font-weight:900;color:#c4b5fd}
.adm-err{min-height:1rem;font-size:.72rem;color:#ff6b7d;font-family:'JetBrains Mono',monospace}
.adm-row{display:flex;gap:.6rem}.adm-row .mp-btn{flex:1;padding:.6rem}

/* ───────── ADAPTATION MOBILE ───────── */
#home{justify-content:flex-start}
#home .hero{margin-top:auto}
#home .choices{margin-bottom:auto}
.hubwrap{justify-content:flex-start}
.hubwrap>:first-child{margin-top:auto}.hubwrap>:last-child{margin-bottom:auto}
.mp-dev{display:inline-block;margin-right:.35rem;font-size:.95em}
@media(max-width:700px){
  #home{padding:3.2rem 1rem 1.2rem;gap:1.6rem}
  .choice{padding:1.3rem 1.2rem;gap:.5rem}
  .c-name{font-size:1.8rem}.c-icon{font-size:2.1rem}
  .c-multi{padding:1.1rem 1.2rem}.c-multi .c-name{font-size:1.4rem}
  .title{font-size:clamp(2.6rem,13vw,4rem)}
  .tag{letter-spacing:.25em}
  /* la bande latérale devient une barre en haut */
  .rail{right:0;bottom:auto;width:auto;height:44px;flex-direction:row;align-items:center;padding:0 10px;gap:12px;border-right:0;border-bottom:1px solid #1a2540}
  .rail-label{writing-mode:horizontal-tb;transform:none;letter-spacing:.25em}
  .page iframe{top:44px;left:0;width:100%;height:calc(100% - 44px)}
  .hubwrap{left:0;top:44px;padding:1rem}
  .hubchoices{grid-template-columns:1fr}
  #mp-modal,#mp-res{padding:10px;align-items:flex-start;overflow:auto}
  .mp-box{padding:1.2rem;max-width:none}
  #mp-res.full>.mp-box{padding:.8rem}
  #mp-resbtn{bottom:70px}
}
</style>
</head>
<body>

<!-- ACCUEIL -->
<div id="home">
  <canvas id="bg"></canvas>
  <button type="button" class="admin-btn" id="admin-btn" onclick="adminClick()">Admin</button>
  <div class="hero">
    <p class="tag">Réseaux · Adressage IPv4</p>
    <h1 class="title">IP<span>v4</span></h1>
    <p class="sub">Choisis ce que tu veux faire</p>
    <div class="line"></div>
  </div>

  <div class="choices">
    <button class="choice c-cours" onclick="openPage('cours')">
      <div class="c-icon">🛜 🧑‍🏫</div>
      <div class="c-name">COURS</div>
      <div class="c-desc">Classes A, B, C, binaire, masques, adresses privées — explore tout de façon interactive.</div>
      <div class="c-go">OUVRIR →</div>
    </button>
    <button class="choice c-quiz" onclick="openQuiz()">
      <div class="c-icon">🧑‍💻 🪪</div>
      <div class="c-name">QUIZ</div>
      <div class="c-desc">Deux quiz : 🌐 Adressage IP &amp; Classes · 🧮 Subnetting &amp; ET Logique — 3 niveaux chacun.</div>
      <div class="c-go">COMMENCER →</div>
    </button>
    <button class="choice c-multi" onclick="mpOpen()">
      <div class="c-icon">👥</div>
      <div class="c-txt">
        <div class="c-name">MULTIJOUEUR</div>
        <div class="c-desc">Crée une partie et partage le code, ou rejoins celle d'un ami avec son code.</div>
      </div>
      <div class="c-go">CRÉER / REJOINDRE →</div>
    </button>
  </div>
</div>

<!-- MULTIJOUEUR -->
<div id="adm-modal"><div class="adm-box">
  <div class="adm-title">🛠 Mode Admin</div>
  <input id="adm-in" class="mp-input" type="password" inputmode="numeric" autocomplete="off" placeholder="Code" onkeydown="if(event.key==='Enter')admSubmit();if(event.key==='Escape')admClose()">
  <div id="adm-err" class="adm-err"></div>
  <div class="adm-row"><button class="mp-btn" onclick="admClose()">Annuler</button><button class="mp-btn main" onclick="admSubmit()">Valider</button></div>
</div></div>
<div id="mp-modal"><div class="mp-box" id="mp-box"></div></div>
<div id="mp-res"><div class="mp-box wide" id="mp-resbox"></div></div>
<button id="mp-resbtn" title="Résultats des joueurs" onclick="mpResOpen()">📊</button>
<div id="mp-badge"></div>
<div id="mp-toast"></div>

<!-- COURS -->
<div class="page" id="page-cours">
  <div class="rail"><button class="back" id="back-cours" onclick="backCours()" title="Retour à l'accueil">←</button><span class="rail-label" id="label-cours">Accueil</span></div>
  <iframe id="f-cours" title="Cours IPv4"></iframe>
</div>

<!-- QUIZ -->
<div class="page" id="page-quiz">
  <div class="rail"><button class="back" onclick="backQuiz()" title="Retour à l'accueil">←</button><span class="rail-label">Accueil</span></div>
  <iframe id="f-quiz" title="Quiz IPv4"></iframe>
</div>


<!-- MENU DES QUIZ -->
<div class="page" id="page-quizhub">
  <div class="rail"><button class="back" onclick="backHub()" title="Retour à l'accueil">←</button><span class="rail-label">Accueil</span></div>
  <div class="hubwrap">
    <div class="hero">
      <p class="tag">Entraînement</p>
      <h1 class="title" style="font-size:clamp(2.6rem,8vw,4.6rem)">QU<span>IZ</span></h1>
      <p class="sub">Choisis ton quiz</p>
      <div class="line"></div>
    </div>
    <div class="choices hubchoices">
      <button class="choice c-quiz" id="hub-ip" onclick="hubGo('ip')">
        <div class="c-name" style="font-size:1.45rem">🌐 Adressage IP &amp; Classes</div>
        <div class="c-desc">Classe, masque, réseau, broadcast, premier et dernier hôte. Facile · Moyen · Difficile.</div>
        <div class="c-go">COMMENCER →</div>
      </button>
      <button class="choice c-quiz2" id="hub-sub" onclick="hubGo('sub')">
        <div class="c-name" style="font-size:1.45rem">🧮 Subnetting &amp; ET Logique</div>
        <div class="c-desc">Les tableaux « ET logique » et « BILAN » avec aide calcul et calculatrice. Facile · Moyen · Difficile.</div>
        <div class="c-go">COMMENCER →</div>
      </button>
      <button class="choice c-quiz3" id="hub-res" style="grid-column:1/-1" onclick="hubGo('res')">
        <div class="c-name" style="font-size:1.45rem">⚡ Résistances équivalentes</div>
        <div class="c-desc">Calcule la résistance équivalente de montages série, dérivation et mixtes. 40 exercices en 6 paliers, du plus simple au plus difficile.</div>
        <div class="c-go">COMMENCER →</div>
      </button>
    </div>
  </div>
</div>

<!-- QUIZ 2 : SUBNETTING & ET LOGIQUE -->
<div class="page" id="page-quiz2">
  <div class="rail"><button class="back" onclick="backQuiz2()" title="Retour">←</button><span class="rail-label">Quiz</span></div>
  <iframe id="f-quiz2" title="Quiz Subnetting"></iframe>
</div>

<!-- QUIZ 3 : RÉSISTANCES ÉQUIVALENTES -->
<div class="page" id="page-quiz3">
  <div class="rail"><button class="back" onclick="backQuiz3()" title="Retour au menu des quiz">←</button><span class="rail-label">Quiz</span></div>
  <iframe id="f-quiz3" title="Quiz Résistances équivalentes"></iframe>
</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
/* ───────── MULTIJOUEUR : créer / rejoindre une partie avec un code ───────── */
const MP_PREFIX='ipv4quiz-';
const MP_CHARS='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const MP_OPTS={debug:0,config:{iceServers:[
  {urls:'stun:stun.l.google.com:19302'},
  {urls:'stun:global.stun.twilio.com:3478'},
  {urls:'turn:openrelay.metered.ca:80',username:'openrelayproject',credential:'openrelayproject'},
  {urls:'turn:openrelay.metered.ca:443',username:'openrelayproject',credential:'openrelayproject'},
  {urls:'turn:openrelay.metered.ca:443?transport=tcp',username:'openrelayproject',credential:'openrelayproject'},
  {urls:'turn:staticauth.openrelay.metered.ca:80',username:'openrelayproject',credential:'openrelayprojectsecret'},
  {urls:'turn:staticauth.openrelay.metered.ca:443',username:'openrelayproject',credential:'openrelayprojectsecret'},
  {urls:'turn:staticauth.openrelay.metered.ca:443?transport=tcp',username:'openrelayproject',credential:'openrelayprojectsecret'},
  {urls:'turns:staticauth.openrelay.metered.ca:443?transport=tcp',username:'openrelayproject',credential:'openrelayprojectsecret'},
  {urls:'turn:freestun.net:3478',username:'free',credential:'free'},
  {urls:'turns:freestun.net:5349',username:'free',credential:'free'}
]}};
const MY_DEV=(function(){
  try{
    const ua=navigator.userAgent||'',touch=matchMedia('(pointer:coarse)').matches,small=Math.min(screen.width,screen.height)<820;
    if(/Android|iPhone|iPod|Mobile|Windows Phone/i.test(ua))return 'm';
    if(/iPad|Macintosh/i.test(ua)&&navigator.maxTouchPoints>1&&small)return 'm';
    return (touch&&small)?'m':'pc';
  }catch(e){return 'pc';}
})();
function mpDevIcon(d){return '<span class="mp-dev" title="'+(d==='m'?'Mobile':'Ordinateur')+'">'+(d==='m'?'📱':'💻')+'</span>';}
function mpDevTxt(d){return d==='m'?' · Mobile':(d==='pc'?' · PC':'');}
let mp={quizzes:['ip','sub'],peer:null,role:null,code:'',name:'',conns:[],hostConn:null,players:[],results:{},exam:false,started:false,exits:0,away:0,hiddenAt:0,tick:null,done:{},lv:{},curLevel:null,hiddenLevel:null,state:'salon',lastSig:'',lastSend:0,forceSend:false,kicked:{},frozen:false};

function mpBox(h){document.getElementById('mp-box').innerHTML=h;}
function mpEsc(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function mpNorm(t){return String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,20);}
function mpGenCode(){let c='';for(let i=0;i<5;i++)c+=MP_CHARS[Math.floor(Math.random()*MP_CHARS.length)];return c;}
function mpClean(){
  try{clearInterval(mp.tick);}catch(e){}
  mpConfirmClose();mpDlClose();mpGuestFreeze(false);mpSettingsClose();mpFlashClear();
  try{mp.conns.forEach(c=>c.close());}catch(e){}
  try{if(mp.hostConn)mp.hostConn.close();}catch(e){}
  try{if(mp.peer)mp.peer.destroy();}catch(e){}
  mp={quizzes:mp.quizzes||['ip','sub'],peer:null,role:null,code:'',name:mp.name,wanted:mp.wanted,conns:[],hostConn:null,players:[],results:{},exam:false,started:false,exits:0,away:0,hiddenAt:0,tick:null,done:{},lv:{},curLevel:null,hiddenLevel:null,state:'salon',lastSig:'',lastSend:0,forceSend:false,kicked:{},frozen:false};
  mpUi();
}
function mpOpen(){
  document.getElementById('mp-modal').classList.add('show');
  if(mp.started){mpRunning();return;}
  mpClean();
  mpMenu();
}
function mpHide(){document.getElementById('mp-modal').classList.remove('show');}
function mpRunning(){
  if(mp.role==='host'){
    mpBox(`<div class="mp-title">🎮 Partie ${mp.code}</div>
      <div class="mp-txt">Partie en cours — ${mp.conns.length} joueur(s) connecté(s). Mode surveillé : <b>${mp.exam?'activé':'désactivé'}</b>.</div>
      <button class="mp-btn main" onclick="mpHide();mpResOpen()">📊 Voir les résultats</button>
      <button class="mp-btn" onclick="mpClose()">⛔ Terminer la partie (déconnecte tout le monde)</button>
      <button class="mp-btn" onclick="mpHide();openQuiz()">🎮 Rejoindre la partie</button>
      <button class="mp-btn" onclick="mpHide()">Fermer</button>`);
  }else{
    const locked=mpLocked();
    mpBox(`<div class="mp-title">🎮 Partie ${mp.code}</div>
      <div class="mp-txt">${locked?'🔒 Mode surveillé : tu ne peux pas quitter la partie avant d\'avoir terminé le Quiz.':'Tu es connecté à la partie.'}</div>
      ${locked?'':'<button class="mp-btn" onclick="mpClose()">Quitter la partie</button>'}
      <button class="mp-btn" onclick="mpHide()">Fermer</button>`);
  }
}
function mpClose(){mpClean();document.getElementById('mp-modal').classList.remove('show');}
function mpMenu(err){
  mpBox(`<div class="mp-title">👥 Multijoueur</div>
    <div class="mp-txt">Que veux-tu faire ?</div>
    <div class="mp-err" id="mp-err">${err?mpEsc(err):''}</div>
    <button class="mp-btn main" onclick="mpCreateForm()">➕ Créer une partie</button>
    <button class="mp-btn" onclick="mpJoinForm()">🔑 Rejoindre une partie</button>
    <button class="mp-btn" onclick="mpClose()">Annuler</button>`);
}
function mpCreateForm(err){
  mpBox(`<div class="mp-title">➕ Créer une partie</div>
    <div class="mp-txt">Choisis ton pseudo :</div>
    <input class="mp-input" id="mp-name" maxlength="16" placeholder="Ton pseudo" value="${mpEsc(mp.name||'')}">
    <div class="mp-txt">Crée le code de ta partie (3 à 20 lettres/chiffres, espaces et accents ignorés) ou laisse vide pour un code automatique :</div>
    <input class="mp-input code" id="mp-gamename" maxlength="30" placeholder="Code de la partie" autocomplete="off" value="${mpEsc(mp.wanted||'')}" onkeydown="if(event.key==='Enter')mpCreate()">
    <div class="mp-err" id="mp-err">${err?mpEsc(err):''}</div>
    <button class="mp-btn main" onclick="mpCreate()">Créer la partie</button>
    <button class="mp-btn" onclick="mpMenu()">← Retour</button>`);
}
function mpGetName(){
  const v=(document.getElementById('mp-name')||{}).value||'';
  mp.name=v.trim()||'Joueur'+Math.floor(Math.random()*90+10);
  return mp.name;
}
function mpErr(t){const e=document.getElementById('mp-err');if(e)e.textContent=t;}


/* ───────── MODE SURVEILLÉ + RÉSULTATS + NIVEAUX UNIQUES ───────── */
const MP_Q=`(function(){
 if(typeof diff==='undefined')return null;
 if(!diff)return{state:'menu'};
 const done=won||finished;
 const baseline=Math.round(20/diff.gain);
 const extra=Math.max(0,coups-baseline);
 const penalty=diff.noteLoss*Math.floor(extra/diff.notePer);
 const reached=score>=20;
 const note=reached?Math.max(0,20-penalty):fmt(Math.round(score*2)/2);
 return{state:done?'done':'run',level:diff.label,score:score,coups:coups,note:done?note:null,time:getElapsed(),locked:lockedIn};
})()`;
let MP_LEVELS=['Facile','Moyen','Difficile'];
function mpSetLevels(){
  const q=(mp.quizzes&&mp.quizzes.length)?mp.quizzes:['ip','sub'];
  MP_LEVELS=[];
  ['Facile','Moyen','Difficile'].forEach(l=>{if(q.indexOf('ip')>=0)MP_LEVELS.push(l);});
  ['Facile','Moyen','Difficile'].forEach(l=>{if(q.indexOf('sub')>=0)MP_LEVELS.push('S·'+l);});
}
function mpLvLabel(k){
  k=String(k);
  const sub=k.indexOf('S·')===0,base=sub?k.slice(2):k;
  if(!(mp.quizzes&&mp.quizzes.length>1)||k==='-')return base;
  return (sub?'Subnetting':'Adressage IP')+' – '+base;
}
function mpQW(){const f=document.getElementById(QZ==='sub'?'f-quiz2':'f-quiz');return f.contentWindow;}
const MP_PAL=[
  {bg:'#8b5cf6',fg:'#ffffff'},{bg:'#22c55e',fg:'#052e14'},{bg:'#3b82f6',fg:'#ffffff'},{bg:'#f97316',fg:'#2a1200'},
  {bg:'#ec4899',fg:'#ffffff'},{bg:'#06b6d4',fg:'#03262d'},{bg:'#eab308',fg:'#2a2000'},{bg:'#ef4444',fg:'#ffffff'}
];
const MP_LBL={salon:'Au salon',menu:'Au menu',run:'En cours',done:'Niveau terminé'};
function mpFmt(ms){const s=Math.floor((ms||0)/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function mpRead(){
  if(QZ==='hub')return {state:'menu'};
  if(QZ!=='ip'&&QZ!=='sub')return null;
  try{
    const r=mpQW().eval(MP_Q);
    if(r&&r.level&&QZ==='sub')r.level='S·'+r.level;
    return r;
  }catch(e){return null;}
}
function mpToast(t){const e=document.getElementById('mp-toast');if(!e)return;e.textContent=t;e.style.display='block';clearTimeout(mpToast._t);mpToast._t=setTimeout(()=>{e.style.display='none';},3500);}
function mpDoneCount(){return Object.keys(mp.done).length;}
/* surveillé = verrouillé tant qu'un niveau est en cours, ou tant qu'aucun niveau n'a été terminé */
function mpIsLocked(){return !(mpDoneCount()>0&&mp.state!=='run');}
function mpLocked(){
  if(!(mp.role==='guest'&&mp.started&&mp.exam))return false;
  mpScan();
  return mpIsLocked();
}
function mpUi(){
  const rb=document.getElementById('mp-resbtn');
  if(rb)rb.style.display=(mp.role==='host'&&mp.started)?'flex':'none';
  const b=document.getElementById('mp-badge');
  if(b){
    const on=mp.role==='guest'&&mp.started&&mp.exam;
    b.style.display=on?'block':'none';
    if(on)b.textContent=mpIsLocked()?'🔒 Mode surveillé · sorties de page : '+mp.exits:'✅ '+mpDoneCount()+' niveau(x) terminé(s) · sorties de page : '+mp.exits;
  }
}

/* ----- invité : un niveau = une seule fois, pas de changement après validation ----- */
function mpGuard(){
  if(mp.role!=='guest'||!mp.started)return;
  mpGuardOne('f-quiz','');mpGuardOne('f-quiz2','S·');
}
function mpGuardOne(fid,pre){
  let w;try{w=document.getElementById(fid).contentWindow;}catch(e){return;}
  if(!w||typeof w.chooseDiff!=='function'||!w.document||!w.document.getElementById('app'))return;
  if(!w.__mpg){
    w.__mpg=true;
    const oc=w.chooseDiff,ol=w.changeLevel;
    w.chooseDiff=function(d){
      if(mp.role==='guest'&&mp.started&&d&&mp.done[pre+d.label]){mpToast('Tu as déjà fait le niveau '+d.label+' : choisis un autre niveau.');return;}
      return oc.apply(this,arguments);
    };
    w.changeLevel=function(){
      if(mp.role==='guest'&&mp.started){
        let lk=false;try{lk=!!w.eval('lockedIn&&!won&&!finished');}catch(e){}
        if(lk){mpToast('Tu as déjà validé une réponse : impossible de changer de niveau.');return;}
      }
      return ol.apply(this,arguments);
    };
    const ov=w.validate;
    w.validate=function(){
      let before=true;try{before=!!w.eval('validated');}catch(e){}
      const r=ov.apply(this,arguments);
      try{
        if(!before&&mp.role==='guest'&&mp.started&&mp.flash&&mp.flash.active&&!mp.flash.claimed&&w.eval('validated&&roundResult&&roundResult.allOk'))mpFlashClaim();
      }catch(e){}
      return r;
    };
    try{new w.MutationObserver(()=>mpMark(w,pre)).observe(w.document.getElementById('app'),{childList:true,subtree:true});}catch(e){}
  }
  mpMark(w,pre);
}
function mpMark(w,pre){
  try{
    if(!(mp.role==='guest'&&mp.started))return;
    w.document.querySelectorAll('.diff-btn').forEach(b=>{
      const nm=b.querySelector('.diff-name');
      const d=nm&&mp.done[(pre||'')+nm.textContent.trim()];
      if(!d)return;
      b.style.opacity='.4';b.style.cursor='not-allowed';b.style.filter='grayscale(1)';
      if(!b.querySelector('.mp-done-tag')){
        const t=w.document.createElement('span');
        t.className='mp-done-tag';
        t.style.cssText='font-size:11px;font-weight:800;color:#a8e08a;margin-top:4px';
        t.textContent='✔ Déjà fait · '+d.note+' / 20';
        b.appendChild(t);
      }
    });
  }catch(e){}
}
function mpScan(){
  const r=mpRead();
  if(r){
    mp.state=r.state;
    mp.curLevel=(r.state==='run')?r.level:null;
    if(r.state==='done'&&r.level&&!mp.done[r.level]){
      const x=mp.lv[r.level]||{n:0,away:0};
      mp.done[r.level]={note:r.note,time:r.time,coups:r.coups,score:r.score,exits:x.n,away:x.away};
      mp.forceSend=true;
    }
  }
  return r;
}
function mpGuestStart(exam,quizzes){
  if(mp.started)return;
  mp.quizzes=(quizzes&&quizzes.length)?quizzes:['ip','sub'];
  mp.exam=exam;mp.started=true;mp.exits=0;mp.away=0;mp.hiddenAt=0;mp.done={};mp.lv={};mp.curLevel=null;mp.hiddenLevel=null;mp.state='menu';mp.lastSig='';mp.forceSend=false;
  document.getElementById('mp-modal').classList.remove('show');
  openQuiz();
  clearInterval(mp.tick);
  mp.tick=setInterval(()=>mpTick(false),500);
  mpTick(true);mpUi();
}
function mpTick(force){
  if(mp.role!=='guest'||!mp.started)return;
  mpGuard();
  const r=mpScan()||{state:'menu'};
  if(!mp.hostConn||!mp.hostConn.open){mpUi();return;}
  const away=mp.away+(mp.hiddenAt?Date.now()-mp.hiddenAt:0);
  const st={t:'status',state:r.state,level:r.level||'-',score:r.score||0,coups:r.coups||0,note:r.note==null?null:r.note,time:r.time||0,exits:mp.exits,away:away,levels:mp.done};
  const sig=[st.state,st.level,st.score,st.coups,st.note,st.exits,Math.floor(away/2000),mpDoneCount()].join('|');
  const now=Date.now();
  if(force||mp.forceSend||sig!==mp.lastSig||now-mp.lastSend>5000){
    try{mp.hostConn.send(st);mp.lastSig=sig;mp.lastSend=now;mp.forceSend=false;}catch(e){}
  }
  mpUi();
}
document.addEventListener('visibilitychange',()=>{
  if(mp.role!=='guest'||!mp.started||!mp.exam)return;
  if(document.hidden){
    if(!mp.frozen&&mpLocked()){
      mp.exits++;mp.hiddenAt=Date.now();mp.hiddenLevel=mp.curLevel;
      if(mp.curLevel){const x=mp.lv[mp.curLevel]||(mp.lv[mp.curLevel]={n:0,away:0});x.n++;}
      mpTick(true);
    }
  }else if(mp.hiddenAt){
    const dur=Date.now()-mp.hiddenAt;
    mp.away+=dur;mp.hiddenAt=0;
    if(mp.hiddenLevel&&mp.lv[mp.hiddenLevel])mp.lv[mp.hiddenLevel].away+=dur;
    mp.hiddenLevel=null;mpTick(true);
  }
});
window.addEventListener('beforeunload',e=>{if(mpLocked()){e.preventDefault();e.returnValue='';}});

/* ----- créateur : tableau des résultats ----- */
function mpEntry(conn){
  return mp.results[conn.peer]||(mp.results[conn.peer]={id:conn.peer,name:conn._name||'Joueur',pi:Object.keys(mp.results).length,state:'salon',level:'-',score:0,coups:0,note:null,time:0,exits:0,away:0,levels:{},disc:false});
}
let mpResFull=true;
function mpResFs(on){
  const m=document.getElementById('mp-res');
  try{
    if(on){if(!document.fullscreenElement&&m.requestFullscreen){const r=m.requestFullscreen();if(r&&r.catch)r.catch(()=>{});}}
    else if(document.fullscreenElement&&document.exitFullscreen){const r=document.exitFullscreen();if(r&&r.catch)r.catch(()=>{});}
  }catch(e){}
}
function mpResOpen(){
  mpResFull=true;
  const m=document.getElementById('mp-res');
  m.classList.add('show','full');
  mpRenderRes();
  mpResFs(true);
}
function mpResClose(){
  mpConfirmClose();mpDlClose();mpSettingsClose();
  mpResFs(false);
  document.getElementById('mp-res').classList.remove('show','full');
}
function mpResToggle(){
  mpResFull=!mpResFull;
  document.getElementById('mp-res').classList.toggle('full',mpResFull);
  mpResFs(mpResFull);
  mpRenderRes();
}
function mpResRows(){
  return Object.values(mp.results).map(e=>{
    const lv=e.levels||{};
    let st=MP_LBL[e.state]||e.state;
    if(e.state==='run')st+=' ('+mpLvLabel(e.level)+')';
    if(e.disc)st+=' ⚠ déconnecté';
    return {
      name:e.name,dev:e.dev,pal:MP_PAL[e.pi%MP_PAL.length],state:st,
      cells:MP_LEVELS.map(l=>lv[l]?{note:lv[l].note,time:lv[l].time,exits:lv[l].exits||0,away:lv[l].away||0}:null),
      exits:mp.exam?(e.exits+(e.away?' ('+mpFmt(e.away)+' hors page)':'')):'—',
      bad:mp.exam&&e.exits>0
    };
  });
}
function mpTint(c){const h=c.replace('#','');let o='';for(let i=0;i<3;i++){const v=parseInt(h.substr(i*2,2),16);o+=Math.round(v+(255-v)*0.78).toString(16).padStart(2,'0');}return '#'+o;}
function mpRenderRes(){
  const m=document.getElementById('mp-res');
  if(!m||!m.classList.contains('show'))return;
  const ex=!!mp.exam,rs=ex?2:1;
  const sortieTxt=n=>n+' sortie'+(n>1?'s':'')+' de page';
  const list=Object.values(mp.results);
  const body=list.length?list.map(e=>{
    const pal=MP_PAL[e.pi%MP_PAL.length],lv=e.levels||{},tint=mpTint(pal.bg);
    let st=MP_LBL[e.state]||e.state;
    if(e.state==='run')st+=' ('+mpLvLabel(e.level)+')';
    if(e.disc)st+=' ⚠ déconnecté';
    const cs=(txt,bg,fg)=>`<td><span class="mp-cell" style="background:${bg};color:${fg}">${mpEsc(txt)}</span></td>`;
    let r1=`<tr><td rowspan="${rs}" oncontextmenu="event.preventDefault();mpAskKick('${mpEsc(e.id)}')"><span class="mp-dot" style="background:${pal.bg}"></span>${mpDevIcon(e.dev)}<b>${mpEsc(e.name)}</b><button class="mp-kick" title="Expulser ce joueur" onclick="mpAskKick('${mpEsc(e.id)}')"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/></svg></button></td><td rowspan="${rs}">${mpEsc(st)}</td>`;
    let r2='<tr>';
    MP_LEVELS.forEach(l=>{
      const d=lv[l];
      if(d){
        r1+=cs(d.note+' / 20',pal.bg,pal.fg)+cs(mpFmt(d.time),pal.bg,pal.fg);
        r2+=cs(sortieTxt(d.exits||0),tint,'#1f2937')+cs(mpFmt(d.away||0)+' hors page',tint,'#1f2937');
      }else{r1+='<td></td><td></td>';r2+='<td></td><td></td>';}
    });
    r1+=`<td rowspan="${rs}" class="${ex&&e.exits>0?'bad':''}">${ex?e.exits:'—'}</td><td rowspan="${rs}">${ex?mpFmt(e.away):'—'}</td></tr>`;
    r2+='</tr>';
    return r1+(ex?r2:'');
  }).join(''):'<tr><td colspan="'+(MP_LEVELS.length*2+4)+'">Aucun joueur pour le moment.</td></tr>';
  const head='<th>Joueur</th><th>État</th>'+MP_LEVELS.map(l=>'<th>'+mpLvLabel(l)+' – note /20</th><th>'+mpLvLabel(l)+' – temps</th>').join('')+'<th>Total sorties de page</th><th>Total temps hors page</th>';
  const _html=`<div class="mp-head"><div class="mp-title">📊 Résultats — partie ${mp.code}${mp.frozen?'<span class="mp-frz">⏸ PARTIE GELÉE</span>':''}${mp.flash&&mp.flash.active?'<span class="mp-frz" style="background:#ff4d8d;color:#fff">⚡ DÉFI FLASH EN COURS</span>':''}</div>
    <div class="mp-tools"><button class="mp-btn mp-gear${mp.frozen?' on':''}" title="Paramètres de la partie" onclick="mpSettings(event)">${MP_GEAR}</button><button class="mp-btn" onclick="mpResToggle()">${mpResFull?'⤡ Réduire':'⤢ Plein écran'}</button><button class="mp-btn" id="mp-copybtn" onclick="mpResCopy()">📋 Copier</button><button class="mp-btn" title="Choisir le format" onclick="mpDlMenu(event)">${mpDlFmt==='pdf'?'📕 PDF':'📗 Excel (.xlsx)'} ▾</button><button class="mp-btn mp-dlgo" onclick="mpDlRun()">⬇ Télécharger</button><button class="mp-btn main" onclick="mpResClose()">✕ Fermer</button></div></div>
    <div class="mp-txt">Mode surveillé : <b>${ex?'activé':'désactivé'}</b> · mise à jour en direct · une couleur par joueur · sous chaque note : nombre de sorties de page et temps hors page.</div>
    <div class="mp-tbl-wrap"><table class="mp-tbl"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
  mpSetRes(_html);
}
/* Met à jour le tableau SANS remonter en haut : on garde le défilement (vertical + horizontal) */
function mpSetRes(html){
  const box=document.getElementById('mp-resbox');
  if(box._html===html)return;               /* rien n'a changé : on ne touche à rien */
  const w=box.querySelector('.mp-tbl-wrap');
  const s={bt:box.scrollTop,bl:box.scrollLeft,wt:w?w.scrollTop:0,wl:w?w.scrollLeft:0};
  box.innerHTML=html; box._html=html;
  const w2=box.querySelector('.mp-tbl-wrap');
  box.scrollTop=s.bt; box.scrollLeft=s.bl;
  if(w2){w2.scrollTop=s.wt;w2.scrollLeft=s.wl;}
}
function mpResCopy(){
  const t=mpResRows().map(r=>r.name+mpDevTxt(r.dev)+' | '+r.state+' | '+MP_LEVELS.map((l,i)=>mpLvLabel(l)+' : '+(r.cells[i]?r.cells[i].note+'/20 ('+mpFmt(r.cells[i].time)+(mp.exam?', '+r.cells[i].exits+' sortie(s), '+mpFmt(r.cells[i].away)+' hors page':'')+')':'—')).join(' | ')+' | sorties : '+r.exits).join('\n');
  try{navigator.clipboard.writeText(t);mpToast('Résultats copiés ✓');const b=document.getElementById('mp-copybtn');if(b){b.textContent='✔ Copié';setTimeout(()=>{const c=document.getElementById('mp-copybtn');if(c)c.textContent='📋 Copier';},1200);}}catch(e){}
}


/* ----- export Excel (.xlsx) sans bibliothèque ----- */
let _mpCrcT=null;
function mpCrc(u8){
  if(!_mpCrcT){_mpCrcT=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;_mpCrcT[n]=c>>>0;}}
  let crc=0xFFFFFFFF;
  for(let i=0;i<u8.length;i++)crc=_mpCrcT[(crc^u8[i])&255]^(crc>>>8);
  return (crc^0xFFFFFFFF)>>>0;
}
function mpZip(files){
  const enc=new TextEncoder(),parts=[],cen=[];let off=0;
  const now=new Date();
  const dt=(now.getHours()<<11)|(now.getMinutes()<<5)|(now.getSeconds()>>1);
  const dd=((now.getFullYear()-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate();
  files.forEach(f=>{
    const nm=enc.encode(f.name),data=enc.encode(f.text),crc=mpCrc(data),sz=data.length;
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);
    h.setUint16(10,dt,true);h.setUint16(12,dd,true);h.setUint32(14,crc,true);h.setUint32(18,sz,true);h.setUint32(22,sz,true);
    h.setUint16(26,nm.length,true);h.setUint16(28,0,true);
    parts.push(new Uint8Array(h.buffer),nm,data);
    const c=new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);
    c.setUint16(12,dt,true);c.setUint16(14,dd,true);c.setUint32(16,crc,true);c.setUint32(20,sz,true);c.setUint32(24,sz,true);
    c.setUint16(28,nm.length,true);c.setUint16(30,0,true);c.setUint16(32,0,true);c.setUint16(34,0,true);c.setUint16(36,0,true);
    c.setUint32(38,0,true);c.setUint32(42,off,true);
    cen.push(new Uint8Array(c.buffer),nm);
    off+=30+nm.length+sz;
  });
  const cenSize=cen.reduce((a,b)=>a+b.length,0);
  const e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(4,0,true);e.setUint16(6,0,true);
  e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);
  e.setUint32(12,cenSize,true);e.setUint32(16,off,true);e.setUint16(20,0,true);
  return new Blob(parts.concat(cen,[new Uint8Array(e.buffer)]),{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

/* ----- export PDF (même présentation que l'Excel, sans bibliothèque) ----- */
const MP_HW=[278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584];
function mpPdfClean(t){return String(t).replace(/[^\x20-\x7E\u00A0-\u00FF\u2013\u2014\u2019\u2026]/g,'');}
function mpPdfEsc(t){
  const map={0x2013:0x96,0x2014:0x97,0x2019:0x92,0x2026:0x85};
  let o='';
  for(const ch of mpPdfClean(t)){
    let c=ch.charCodeAt(0);if(map[c])c=map[c];
    if(c===40||c===41||c===92)o+='\\'+ch;
    else if(c>126||c<32)o+='\\'+c.toString(8).padStart(3,'0');
    else o+=ch;
  }
  return o;
}
function mpPdfW(t,size,bold){
  let w=0;
  for(const ch of mpPdfClean(t)){const c=ch.charCodeAt(0);w+=(c>=32&&c<=126)?MP_HW[c-32]:(c>=192&&c<=222?640:556);}
  return w*size/1000*(bold?1.06:1);
}
function mpPdfWrap(t,size,bold,maxw){
  const words=mpPdfClean(t).split(' '),lines=[];let cur='';
  words.forEach(w=>{
    const test=cur?cur+' '+w:w;
    if(mpPdfW(test,size,bold)<=maxw||!cur)cur=test;else{lines.push(cur);cur=w;}
  });
  if(cur)lines.push(cur);
  return lines;
}
function mpPdfFit(t,size,bold,maxw){
  t=mpPdfClean(t);
  if(mpPdfW(t,size,bold)<=maxw)return t;
  while(t.length>1&&mpPdfW(t+'...',size,bold)>maxw)t=t.slice(0,-1);
  return t+'...';
}
function mpPdf(){
  const PW=842,PH=595,M=20;
  const rgb=h=>{h=h.replace('#','');return [0,2,4].map(i=>(parseInt(h.substr(i,2),16)/255).toFixed(3)).join(' ');};
  const NL=MP_LEVELS.length,LX=2+NL*2;
  const colW=NL>3?[66,90].concat(Array(NL*2).fill(46),[44,44]):[80,112,78,78,78,78,78,78,71,71];
  const colX=[];let ax=M;colW.forEach(w=>{colX.push(ax);ax+=w;});
  const ex=!!mp.exam;
  const pages=[];let cmds=null,y=0;
  const cell=(c0,c1,top,h,fill)=>{
    const x=colX[c0],w=colX[c1]+colW[c1]-x;
    cmds.push((fill?rgb(fill)+' rg ':'1 1 1 rg ')+x+' '+(PH-top-h)+' '+w+' '+h+' re f');
    cmds.push('0.75 G 0.5 w '+x+' '+(PH-top-h)+' '+w+' '+h+' re S');
  };
  const text=(t,c0,c1,top,h,size,bold,color)=>{
    const x=colX[c0],w=colX[c1]+colW[c1]-x;
    const lines=mpPdfWrap(t,size,bold,w-8).slice(0,3);
    const lh=size*1.2,start=top+h/2-(lines.length*lh)/2;
    lines.forEach((ln,k)=>{
      const tw=mpPdfW(ln,size,bold);
      cmds.push('BT /'+(bold?'F2':'F1')+' '+size+' Tf '+rgb(color)+' rg '+(x+(w-tw)/2).toFixed(2)+' '+(PH-(start+k*lh+size*0.95)).toFixed(2)+' Td ('+mpPdfEsc(ln)+') Tj ET');
    });
  };
  const header=()=>{
    const h=32;
    const names=['Joueur','État'];
    MP_LEVELS.forEach(l=>names.push(mpLvLabel(l)+' – note /20',mpLvLabel(l)+' – temps'));
    names.push('Total sorties de page','Total temps hors page');
    names.forEach((n,i)=>{cell(i,i,y,h,'#1f2937');text(n,i,i,y,h,8,true,'#ffffff');});
    y+=h;
  };
  const newPage=()=>{
    cmds=[];pages.push(cmds);
    cmds.push('BT /F2 16 Tf 0.07 0.09 0.15 rg '+M+' '+(PH-M-14)+' Td ('+mpPdfEsc('Résultats – partie '+mp.code)+') Tj ET');
    const sub='Mode surveillé : '+(ex?'activé':'désactivé')+'   ·   généré le '+new Date().toLocaleString('fr-FR');
    cmds.push('BT /F1 9 Tf 0.4 0.45 0.5 rg '+M+' '+(PH-M-30)+' Td ('+mpPdfEsc(sub)+') Tj ET');
    y=M+42;header();
  };
  newPage();
  const sortieTxt=n=>n+' sortie'+(n>1?'s':'')+' de page';
  Object.values(mp.results).forEach(e=>{
    const h1=ex?22:26,h2=ex?18:0,H=h1+h2;
    if(y+H>PH-M)newPage();
    const pal=MP_PAL[e.pi%MP_PAL.length],tint=mpTint(pal.bg),lv=e.levels||{};
    let st=MP_LBL[e.state]||e.state;
    if(e.state==='run')st+=' ('+mpLvLabel(e.level)+')';
    if(e.disc)st+=' - déconnecté';
    cell(0,0,y,H,pal.bg);text(e.name+mpDevTxt(e.dev),0,0,y,H,10,true,pal.fg);
    cell(1,1,y,H,'#ffffff');text(st,1,1,y,H,8.5,false,'#1f2937');
    MP_LEVELS.forEach((l,i)=>{
      const c=2+i*2,d=lv[l];
      if(d){
        cell(c,c,y,h1,pal.bg);text(String(d.note),c,c,y,h1,10,true,pal.fg);
        cell(c+1,c+1,y,h1,pal.bg);text(mpFmt(d.time),c+1,c+1,y,h1,10,true,pal.fg);
        if(ex){
          cell(c,c,y+h1,h2,tint);text(sortieTxt(d.exits||0),c,c,y+h1,h2,7.5,false,'#1f2937');
          cell(c+1,c+1,y+h1,h2,tint);text(mpFmt(d.away||0)+' hors page',c+1,c+1,y+h1,h2,7.5,false,'#1f2937');
        }
      }else{
        cell(c,c,y,h1,'#ffffff');cell(c+1,c+1,y,h1,'#ffffff');
        if(ex){cell(c,c,y+h1,h2,'#ffffff');cell(c+1,c+1,y+h1,h2,'#ffffff');}
      }
    });
    cell(LX,LX,y,H,'#ffffff');text(ex?String(e.exits||0):'—',LX,LX,y,H,10,true,'#1f2937');
    cell(LX+1,LX+1,y,H,'#ffffff');text(ex?mpFmt(e.away||0):'—',LX+1,LX+1,y,H,10,true,'#1f2937');
    y+=H;
  });
  /* assemblage du fichier PDF */
  let out='%PDF-1.4\n';const offs=[];
  const add=body=>{offs.push(out.length);out+=offs.length+' 0 obj\n'+body+'\nendobj\n';};
  const kids=pages.map((_,k)=>(5+2*k)+' 0 R').join(' ');
  add('<< /Type /Catalog /Pages 2 0 R >>');
  add('<< /Type /Pages /Kids ['+kids+'] /Count '+pages.length+' >>');
  add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
  add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
  pages.forEach((cm,k)=>{
    const content=cm.join('\n');
    add('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+PW+' '+PH+'] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents '+(6+2*k)+' 0 R >>');
    add('<< /Length '+content.length+' >>\nstream\n'+content+'\nendstream');
  });
  const xr=out.length;
  out+='xref\n0 '+(offs.length+1)+'\n0000000000 65535 f \n'+offs.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('');
  out+='trailer\n<< /Size '+(offs.length+1)+' /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF';
  const u8=new Uint8Array(out.length);for(let i=0;i<out.length;i++)u8[i]=out.charCodeAt(i)&255;
  return new Blob([u8],{type:'application/pdf'});
}

    document.body.appendChild(a);a.click();

  o.style.cssText='position:fixed;inset:0;z-index:96;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(3,6,14,.75)';

}
function mpKick(id){
  if(mp.role!=='host')return;
  const c=mp.conns.find(x=>x.peer===id);
  const name=c?c._name:((mp.results[id]||{}).name||'');

  if(c){
    try{c.send({t:'kick'});}catch(e){}
    mp.conns=mp.conns.filter(x=>x!==c);
    setTimeout(()=>{try{c.close();}catch(e){}},300);

  mpRenderRes();
}
function mpKicked(){

/* ----- DÉFI FLASH : le 1er joueur qui valide une IP entièrement juste gagne +2 pts (dans le Quiz uniquement) ----- */
const MP_FLASH_PTS=2;
function mpFlashSettingsHtml(){
  const f=mp.flash,on=!!(f&&f.active);
  let h='<div style="border-top:1px solid #243050"></div>'
    +'<div class="mp-title" style="font-size:1rem">⚡ Défi Flash</div>';

}
function mpFlashStart(){
  if(mp.role!=='host'||!mp.started||mp.frozen)return;
  if(mp.flash&&mp.flash.active)return;
  mp.flash={id:Date.now(),active:true,pts:MP_FLASH_PTS,winner:null};

}
function mpFlashCancel(){
  if(mp.role!=='host'||!mp.flash||!mp.flash.active)return;
  mp.flash.active=false;
  mp.conns.forEach(c=>{try{c.send({t:'flashend'});}catch(e){}});
  mpSettingsRender();mpResLast='';mpRenderRes();
}
/* hôte : arbitre — le premier message valide gagne */
function mpFlashOnClaim(conn,d){
  const f=mp.flash;
  if(mp.role!=='host'||!f||!f.active||d.id!==f.id)return;
  f.active=false;f.winner=conn._name||'Joueur';
  mp.conns.forEach(c=>{try{c.send({t:'flashwin',id:f.id,pid:conn.peer,name:f.winner,pts:f.pts});}catch(e){}});
  mpToast('🏆 '+f.winner+' remporte le Défi Flash (+'+f.pts+' pts)');
  mpSettingsRender();mpResLast='';mpRenderRes();
}
/* joueur */
let mpFlashT1=null,mpFlashT2=null;
function mpFlashClear(){
  clearTimeout(mpFlashT1);clearTimeout(mpFlashT2);
  ['mp-flashsplash','mp-flashbar'].forEach(i=>{const e=document.getElementById(i);if(e)e.remove();});
}
function mpFlashShow(d){
  if(mp.role!=='guest'||!mp.started)return;
  mpFlashClear();
  mp.flash={id:d.id,active:true,pts:d.pts||MP_FLASH_PTS,claimed:false};
  const sp=document.createElement('div');sp.id='mp-flashsplash';
  sp.innerHTML='<div class="fs-box"><div class="fs-ic">⚡</div><div class="fs-t">DÉFI FLASH !</div><div class="fs-s">Prochaine IP : le premier à valider<br>avec <b style="color:#ffb020">toutes les réponses justes</b><br>gagne <b style="color:#ffb020">+'+mp.flash.pts+' pts</b> bonus !</div></div>';
  document.body.appendChild(sp);
  mpFlashT1=setTimeout(()=>{const e=document.getElementById('mp-flashsplash');if(e)e.remove();},4000);
  const bar=document.createElement('div');bar.id='mp-flashbar';
  bar.textContent='⚡ DÉFI FLASH · le 1er à valider tout juste gagne +'+mp.flash.pts+' pts';
  document.body.appendChild(bar);
}
function mpFlashClaim(){
  const f=mp.flash;
  if(!f||!f.active||f.claimed||!mp.hostConn||!mp.hostConn.open)return;
  f.claimed=true;
  try{mp.hostConn.send({t:'flashclaim',id:f.id});}catch(e){}
}
function mpFlashWin(d){
  if(mp.role!=='guest'||!mp.started)return;
  const mine=!!(mp.peer&&d.pid===mp.peer.id);
  mp.flash=null;
  clearTimeout(mpFlashT1);clearTimeout(mpFlashT2);
  const sp=document.getElementById('mp-flashsplash');if(sp)sp.remove();
  let bar=document.getElementById('mp-flashbar');
  if(!bar){bar=document.createElement('div');bar.id='mp-flashbar';document.body.appendChild(bar);}
  bar.className='win';
  bar.textContent=mine?'🏆 Bravo ! Tu remportes le Défi Flash : +'+d.pts+' pts':'🏆 '+d.name+' remporte le Défi Flash (+'+d.pts+' pts)';
  mpFlashT2=setTimeout(()=>{const e=document.getElementById('mp-flashbar');if(e)e.remove();},6000);
  if(mine)mpFlashApply(d.pts);
}
function mpFlashApply(pts){
  try{

}
function mpFlashEnd(){

}

/* côté joueur : écran de pause + chronomètre gelé */
let mpFzTimer=null,mpFzLast=0,mpFzInert=[];
function mpFzShift(){
  const now=Date.now(),dt=now-mpFzLast;mpFzLast=now;
  if(dt<=0)return;
  ['f-quiz','f-quiz2'].forEach(id=>{try{document.getElementById(id).contentWindow.eval('if(typeof timerRunning!=="undefined"&&timerRunning)startTime+='+dt);}catch(e){}});

function mpGuestFreeze(on){

    o.innerHTML='<div style="font-size:64px;line-height:1">⏸</div><div style="font-size:1.6rem;font-weight:900;color:#ffb020;letter-spacing:.04em">PARTIE EN PAUSE</div><div style="max-width:420px;font-size:.85rem;line-height:1.7;color:#8aabcc">Le créateur de la partie fait une explication.<br>Ton chronomètre est gelé : tu reprendras exactement là où tu t\'es arrêté.</div>';
    document.body.appendChild(o);
    mpFzInert=[];
    Array.from(document.body.children).forEach(el=>{if(el===o||el.tagName==='SCRIPT')return;if(!el.inert){el.inert=true;mpFzInert.push(el);}});
    try{if(document.activeElement)document.activeElement.blur();}catch(e){}
    ['f-quiz','f-quiz2'].forEach(id=>{try{document.getElementById(id).contentWindow.document.activeElement.blur();}catch(e){}});
    mpFzLast=Date.now();
    clearInterval(mpFzTimer);
    mpFzTimer=setInterval(mpFzShift,200);
  }else{
    if(old)mpFzShift();
    clearInterval(mpFzTimer);mpFzTimer=null;
    if(old)old.remove();
    mpFzInert.forEach(el=>{el.inert=false;});mpFzInert=[];
    mp.frozen=false;
  }
}

/* ----- CRÉER ----- */
function mpCreate(tries){
  if(typeof Peer==='undefined'){mpErr("Connexion impossible : vérifie ta connexion internet.");return;}
  mpGetName();
  const gn=document.getElementById('mp-gamename');
  if(gn)mp.wanted=gn.value;
  const custom=mpNorm(mp.wanted);
  if((mp.wanted||'').trim()&&custom.length<3){mpErr('Le nom doit faire au moins 3 lettres ou chiffres.');return;}
  const keepName=mp.name,keepWanted=mp.wanted;
  mpClean();mp.name=keepName;mp.wanted=keepWanted;
  tries=tries||0;
  const code=custom||mpGenCode();
  const peer=new Peer(MP_PREFIX+code,MP_OPTS);
  peer.on('disconnected',()=>{try{if(!peer.destroyed)peer.reconnect();}catch(e){}});
  mp.peer=peer;mp.role='host';mp.code=code;mp.players=[mp.name];
  peer.on('open',()=>mpHostLobby());
  peer.on('error',e=>{
    if(e.type==='unavailable-id'){
      if(custom){mpCreateForm('Ce code est déjà utilisé par une autre partie, choisis-en un autre.');return;}
      if(tries<5){mpCreate(tries+1);return;}
    }
    mpCreateForm("Impossible de créer la partie ("+e.type+").");
  });
  peer.on('connection',conn=>{
    conn.on('data',d=>{
      if(!d)return;
      if(d.t==='hello'){
        conn._name=String(d.name||'Joueur').slice(0,16);conn._dev=d.dev==='m'?'m':'pc';
        if(mp.kicked[conn._name.toLowerCase()]){try{conn.send({t:'kick'});}catch(x){}setTimeout(()=>{try{conn.close();}catch(x){}},300);return;}
        if(mp.conns.indexOf(conn)<0)mp.conns.push(conn);
        const e=mpEntry(conn);e.name=conn._name;e.dev=conn._dev;e.disc=false;
        if(mp.started){try{conn.send({t:'start',exam:!!mp.exam,quizzes:mp.quizzes});}catch(x){}}
        if(mp.started&&mp.frozen){try{conn.send({t:'freeze',on:true});}catch(x){}}
        if(mp.started&&mp.flash&&mp.flash.active){try{conn.send({t:'flash',id:mp.flash.id,pts:mp.flash.pts});}catch(x){}}
        mpBroadcastPlayers();mpRenderRes();
      }else if(d.t==='flashclaim'){
        mpFlashOnClaim(conn,d);
      }else if(d.t==='status'){
        const e=mpEntry(conn);
        Object.assign(e,{state:d.state,level:d.level,score:d.score,coups:d.coups,note:d.note,time:d.time,exits:d.exits,away:d.away,levels:d.levels||{}});
        mpRenderRes();
      }
    });
    conn.on('close',()=>{
      mp.conns=mp.conns.filter(c=>c!==conn);
      if(mp.results[conn.peer])mp.results[conn.peer].disc=true;
      mpBroadcastPlayers();mpRenderRes();
    });
  });
}
function mpBroadcastPlayers(){
  mp.players=[mp.name].concat(mp.conns.map(c=>c._name));
  mp.devs=[MY_DEV].concat(mp.conns.map(c=>c._dev||'pc'));
  mp.conns.forEach(c=>{try{c.send({t:'players',list:mp.players,devs:mp.devs});}catch(e){}});
  mpHostLobby();
}
function mpHostLobby(){
  if(mp.role!=='host'||mp.started)return;
  mpBox(`<div class="mp-title">🎮 Ta partie</div>
    <div class="mp-txt">Donne ce code à tes amis (clique dessus pour le copier) :</div>
    <div class="mp-code" onclick="mpCopy()" id="mp-code">${mp.code}</div>
    <div class="mp-txt">Joueurs connectés (${mp.players.length}) :</div>
    <div class="mp-players">${mp.players.map((n,i)=>{const c=i>0?mp.conns[i-1]:null;return `<div class="mp-player has-kick"${c?` oncontextmenu="event.preventDefault();mpAskKick('${mpEsc(c.peer)}')"`:''}><span>${i===0?'👑 ':'🧑 '}${mpDevIcon((mp.devs||[])[i])}${mpEsc(n)}</span>${c?`<button class="mp-kick" title="Expulser ce joueur" onclick="mpAskKick('${mpEsc(c.peer)}')"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/></svg></button>`:''}</div>`;}).join('')}</div>
    <label class="mp-chk"><input type="checkbox" ${mp.exam?'checked':''} onchange="mp.exam=this.checked"><div>🔒 Mode surveillé <span>— les joueurs ne peuvent pas quitter le Quiz avant d'avoir fini, et chaque sortie de la page est comptée.</span></div></label>
    <div class="mp-quizopts">
      <div class="mp-txt" style="margin:0">📚 Quiz accessibles aux joueurs (coche 1 ou les 2) :</div>
      <label class="mp-chk"><input type="checkbox" ${mp.quizzes.indexOf('ip')>=0?'checked':''} onchange="mpToggleQuiz('ip',this)"><div>🌐 Adressage IP &amp; Classes</div></label>
      <label class="mp-chk"><input type="checkbox" ${mp.quizzes.indexOf('sub')>=0?'checked':''} onchange="mpToggleQuiz('sub',this)"><div>🧮 Subnetting &amp; ET Logique <span>— si un seul est coché, les joueurs arrivent directement dedans.</span></div></label>
    </div>
    <button class="mp-btn main" onclick="mpStart()">▶ Lancer le Quiz pour tout le monde</button>
    <button class="mp-btn" onclick="mpClose()">Annuler la partie</button>`);
}
function mpToggleQuiz(k,el){
  const list=(mp.quizzes||[]).filter(x=>x!==k);
  if(el.checked)list.push(k);
  if(!list.length){el.checked=true;mpToast('Coche au moins un quiz.');return;}
  mp.quizzes=['ip','sub'].filter(x=>list.indexOf(x)>=0);
}
function mpCopy(){try{navigator.clipboard.writeText(mp.code);const e=document.getElementById('mp-code');if(e){e.textContent='Copié ✓';setTimeout(()=>{if(document.getElementById('mp-code'))e.textContent=mp.code;},900);}}catch(e){}}
function mpStart(){
  mp.started=true;mpSetLevels();
  mp.conns.forEach(c=>{mpEntry(c).state='menu';try{c.send({t:'start',exam:!!mp.exam,quizzes:mp.quizzes});}catch(e){}});
  mpUi();
  mpRunning();
}

/* ----- REJOINDRE ----- */
function mpJoinForm(err){
  mpBox(`<div class="mp-title">🔑 Rejoindre une partie</div>
    <div class="mp-txt">Choisis ton pseudo :</div>
    <input class="mp-input" id="mp-name" maxlength="16" placeholder="Ton pseudo" value="${mpEsc(mp.name||'')}">
    <div class="mp-txt">Entre le code de la partie (donné par son créateur) :</div>
    <input class="mp-input code" id="mp-codein" maxlength="30" placeholder="Code de la partie" autocomplete="off" onkeydown="if(event.key==='Enter')mpJoin()">
    <div class="mp-err" id="mp-err">${err?mpEsc(err):''}</div>
    <button class="mp-btn main" onclick="mpJoin()">Rejoindre</button>
    <button class="mp-btn" onclick="mpMenu()">← Retour</button>`);
}
function mpJoin(){
  mpGetName();
  if(typeof Peer==='undefined'){mpErr("Connexion impossible : vérifie ta connexion internet.");return;}
  const code=mpNorm(document.getElementById('mp-codein').value);
  if(code.length<3){mpErr('Entre le nom/code de la partie (3 caractères minimum).');return;}
  const keep=mp.name;mpClean();mp.name=keep;
  mpErr('Connexion…');
  const peer=new Peer(undefined,MP_OPTS);
  mp.peer=peer;mp.role='guest';mp.code=code;
  let ok=false;
  const fail=m=>{if(!ok){const n=mp.name;mpClean();mp.name=n;mpJoinForm(m);}};
  const timer=setTimeout(()=>fail('Connexion impossible (réseau bloqué ?). Vérifie le nom, que la partie est toujours ouverte, et réessaie.'),25000);
  peer.on('error',e=>{clearTimeout(timer);fail(e.type==='peer-unavailable'?'Partie introuvable. Vérifie le code.':'Erreur de connexion ('+e.type+').');});
  peer.on('open',()=>{
    const conn=peer.connect(MP_PREFIX+code,{reliable:true});
    mp.hostConn=conn;
    conn.on('open',()=>{
      ok=true;clearTimeout(timer);
      conn.send({t:'hello',name:mp.name,dev:MY_DEV});
      mpGuestLobby();
    });
    conn.on('data',d=>{
      if(!d)return;
      if(d.t==='players'){mp.players=d.list||[];mp.devs=d.devs||[];mpGuestLobby();}
      else if(d.t==='start'){mpGuestStart(!!d.exam,d.quizzes);}
      else if(d.t==='kick'){mpKicked();}
      else if(d.t==='freeze'){mpGuestFreeze(!!d.on);}
      else if(d.t==='flash'){mpFlashShow(d);}
      else if(d.t==='flashwin'){mpFlashWin(d);}
      else if(d.t==='flashend'){mpFlashEnd();}
    });
    conn.on('close',()=>{
      if(mp.hostConn!==conn)return;
      const n=mp.name;mpClean();mp.name=n;
      if(document.getElementById('mp-modal').classList.contains('show'))mpMenu('La partie a été fermée par le créateur.');
      else mpToast('La partie a été fermée par le créateur.');
    });
  });
}
function mpGuestLobby(){
  mpBox(`<div class="mp-title">⏳ Partie ${mp.code}</div>
    <div class="mp-txt">Tu as rejoint la partie. En attente du lancement par le créateur…</div>
    <div class="mp-txt">Joueurs connectés (${mp.players.length}) :</div>
    <div class="mp-players">${mp.players.map((n,i)=>`<div class="mp-player">${i===0?'👑 ':'🧑 '}${mpDevIcon((mp.devs||[])[i])}${mpEsc(n)}</div>`).join('')}</div>
    <button class="mp-btn" onclick="mpClose()">Quitter la partie</button>`);
}
</script>
<script>
/* Les deux pages d'origine sont intégrées telles quelles (aucune modification de leurs scripts). */
const SRC_COURS = "<!DOCTYPE html>\n<html lang=\"fr\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>IPv4 — Adressage par Classes<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&family=Syne:wght@400;600;700;800&display=swap\" rel=\"stylesheet\">\n<style>\n*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }\n\n/* ── THEME VARS ── */\n:root {\n  --bg:#050810; --bg2:#0a0f1e; --bg3:#0f1627;\n  --border:#1a2540; --border2:#243050;\n  --text:#e8f0ff; --text-dim:#8aabcc;\n  --accent:#00d4ff; --accent2:#0088cc;\n  --green:#00ff9d; --yellow:#ffcc00;\n  --red:#ff4466; --purple:#a855f7;\n  --orange:#ff9f40;\n  --glow:0 0 20px rgba(0,212,255,0.3);\n  /* NET/HOST colors */\n  --net-bg:rgba(0,136,204,.22); --net-col:#60c8ff; --net-border:rgba(0,136,204,.4);\n  --host-bg:rgba(0,255,157,.14); --host-col:#00ff9d; --host-border:rgba(0,255,157,.3);\n  /* Private */\n  --priv-bg:rgba(255,159,64,.18); --priv-col:#ff9f40; --priv-border:rgba(255,159,64,.4);\n}\n\nbody.light {\n  --bg:#f0f4ff; --bg2:#ffffff; --bg3:#e8eef8;\n  --border:#d0dcf0; --border2:#b8ccee;\n  --text:#0a1428; --text-dim:#5570a0;\n  --accent:#0077cc; --accent2:#0055aa;\n  --green:#008844; --yellow:#cc8800;\n  --red:#cc0033; --purple:#7722cc;\n  --orange:#cc5500;\n  --glow:0 0 20px rgba(0,119,204,0.2);\n  --net-bg:rgba(0,85,170,.15); --net-col:#0044aa; --net-border:rgba(0,85,170,.35);\n  --host-bg:rgba(0,136,68,.12); --host-col:#007744; --host-border:rgba(0,136,68,.3);\n  --priv-bg:rgba(204,85,0,.12); --priv-col:#994400; --priv-border:rgba(204,85,0,.35);\n}\n\nhtml { scroll-behavior:smooth; }\n\nbody {\n  font-family:'JetBrains Mono',monospace;\n  background:var(--bg); color:var(--text);\n  min-height:100vh; overflow-x:hidden;\n  transition:background .3s, color .3s;\n}\n\nbody:not(.light)::before {\n  content:''; position:fixed; inset:0;\n  background-image:linear-gradient(rgba(0,212,255,.025) 1px,transparent 1px),\n    linear-gradient(90deg,rgba(0,212,255,.025) 1px,transparent 1px);\n  background-size:40px 40px; pointer-events:none; z-index:0;\n}\nbody:not(.light)::after {\n  content:''; position:fixed; inset:0;\n  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.06) 2px,rgba(0,0,0,.06) 4px);\n  pointer-events:none; z-index:0;\n}\n\n.wrapper { position:relative; z-index:1; max-width:1200px; margin:0 auto; padding:2rem 1.5rem 5rem; }\n\n/* ── HEADER ── */\nheader { text-align:center; padding:2rem 0 1.5rem; position:relative; }\n.header-tag { font-size:.65rem; letter-spacing:.3em; color:var(--accent); text-transform:uppercase; margin-bottom:.6rem; opacity:.8; }\nh1 { font-family:sans-serif; font-size:clamp(2rem,6vw,3rem); font-weight:800; letter-spacing:-.02em; color:#fff; }\nbody.light h1 { color:var(--text); }\nh1 span { color:var(--accent); text-shadow:var(--glow); }\n.subtitle { font-size:.75rem; color:var(--text-dim); letter-spacing:.04em; margin-top:.4rem; }\n.header-line { width:80px; height:2px; background:linear-gradient(90deg,transparent,var(--accent),transparent); margin:1rem auto 0; }\n\n/* ── THEME TOGGLE ── */\n.theme-btn {\n  position:absolute; top:2rem; right:0;\n  background:var(--bg2); border:1px solid var(--border); border-radius:20px;\n  padding:.4rem .9rem; font-family:'JetBrains Mono',monospace; font-size:.68rem;\n  color:var(--text-dim); cursor:pointer; transition:all .2s;\n  display:flex; align-items:center; gap:.4rem;\n}\n.theme-btn:hover { border-color:var(--accent); color:var(--accent); }\n\n/* ── CLASS SELECTOR (kept for active state in app) ── */\n.class-selector {\n  display:flex; gap:.75rem; justify-content:center;\n  margin:1.5rem 0; flex-wrap:wrap;\n}\n.class-btn {\n  font-family:sans-serif; font-size:1.1rem; font-weight:800;\n  padding:.8rem 2.5rem; border:2px solid var(--border); border-radius:12px;\n  background:var(--bg2); color:var(--text-dim); cursor:pointer;\n  transition:all .25s; letter-spacing:.04em; position:relative; overflow:hidden;\n  min-width:160px;\n}\n.class-btn::before {\n  content:''; position:absolute; inset:0;\n  background:linear-gradient(135deg, var(--cbtn-a), var(--cbtn-b));\n  opacity:0; transition:opacity .25s;\n}\n.class-btn span { position:relative; z-index:1; }\n.class-btn:hover { border-color:var(--cbtn-b,var(--accent)); color:var(--text); transform:translateY(-2px); }\n.class-btn:hover::before { opacity:.08; }\n.class-btn.active { border-color:var(--cbtn-b); color:#fff; transform:translateY(-2px); box-shadow:0 8px 24px rgba(0,0,0,.3); }\nbody.light .class-btn.active { color:var(--text); }\n.class-btn.active::before { opacity:1; }\n\n.cbtn-a { --cbtn-a:#8f0f26; --cbtn-b:#d11a38; }\n.cbtn-b { --cbtn-a:#106b2c; --cbtn-b:#1fa84a; }\n.cbtn-c { --cbtn-a:#143f85; --cbtn-b:#2478d6; }\n\n.class-badge { font-size:.55rem; display:block; font-weight:400; letter-spacing:.1em; margin-top:.2rem; opacity:.8; }\n\n/* ── LANDING SCREEN ── */\n#landing {\n  position:fixed; inset:0; z-index:100;\n  display:flex; flex-direction:column; align-items:center; justify-content:center;\n  background:var(--bg);\n  transition:opacity .55s ease, transform .55s ease;\n  overflow:hidden;\n}\n#landing.hidden {\n  opacity:0; transform:translateY(-24px); pointer-events:none;\n}\n#landing canvas {\n  position:absolute; inset:0; width:100%; height:100%; pointer-events:none;\n}\n\n.landing-inner {\n  position:relative; z-index:2;\n  display:flex; flex-direction:column; align-items:center;\n  gap:2.5rem; padding:2rem 1.5rem; width:100%; max-width:1060px;\n}\n\n.landing-hero { text-align:center; }\n.landing-tag {\n  font-size:.6rem; letter-spacing:.4em; color:var(--accent);\n  text-transform:uppercase; margin-bottom:.75rem; opacity:0;\n  animation:fadeUp .6s .1s ease forwards;\n}\n.landing-title {\n  font-family:sans-serif; font-size:clamp(3rem,9vw,5.5rem);\n  font-weight:800; letter-spacing:-.03em; line-height:.95;\n  color:#fff; opacity:0; animation:fadeUp .6s .25s ease forwards;\n}\nbody.light .landing-title { color:var(--text); }\n.landing-title .accent-word { color:#ffd23f; text-shadow:0 0 40px rgba(255,210,63,.5); }\nbody.light .landing-title .accent-word { color:#cc8800; text-shadow:0 0 40px rgba(204,136,0,.3); }\n.landing-title .dim-word { color:var(--text-dim); font-weight:300; }\n.landing-sub {\n  font-size:.78rem; color:var(--text-dim); letter-spacing:.05em;\n  margin-top:.9rem; opacity:0; animation:fadeUp .6s .4s ease forwards;\n}\n.landing-line {\n  width:0; height:1px;\n  background:linear-gradient(90deg,transparent,var(--accent),transparent);\n  margin:.75rem auto 0; opacity:0;\n  animation:lineGrow .8s .6s ease forwards;\n}\n@keyframes lineGrow { to { width:120px; opacity:.7; } }\n\n/* ── CLASS CARDS ── */\n.class-cards {\n  display:grid; grid-template-columns:repeat(3,1fr); gap:1.25rem;\n  width:100%; opacity:0; animation:fadeUp .6s .55s ease forwards;\n}\n@media(max-width:680px){ .class-cards { grid-template-columns:1fr; } }\n\n.class-card {\n  position:relative; border-radius:16px; overflow:hidden;\n  border:1px solid var(--border); background:var(--bg2);\n  cursor:pointer; transition:transform .3s, border-color .3s, box-shadow .3s;\n  padding:1.75rem 1.5rem 1.5rem;\n  display:flex; flex-direction:column; gap:.55rem;\n}\n.class-card::before {\n  content:''; position:absolute; inset:0;\n  background:linear-gradient(135deg, var(--cc-a), var(--cc-b));\n  opacity:.06; transition:opacity .3s;\n}\n.class-card::after {\n  content:''; position:absolute; top:0; left:0; right:0; height:2px;\n  background:linear-gradient(90deg,transparent,var(--cc-b),transparent);\n  opacity:.8;\n}\n.class-card:hover {\n  transform:translateY(-7px);\n  border-color:var(--cc-b);\n  box-shadow:0 24px 55px rgba(0,0,0,.5), 0 0 35px var(--cc-glow);\n}\n.class-card:hover::before { opacity:.14; }\n\n.cc-a { --cc-a:#8f0f26; --cc-b:#d11a38; --cc-glow:rgba(209,26,56,.3); }\n.cc-b { --cc-a:#106b2c; --cc-b:#1fa84a; --cc-glow:rgba(31,168,74,.3); }\n.cc-c { --cc-a:#143f85; --cc-b:#2478d6; --cc-glow:rgba(36,120,214,.3); }\n\n.cc-letter {\n  font-family:sans-serif; font-size:4rem; font-weight:900;\n  line-height:1; color:var(--cc-b);\n  text-shadow:0 0 40px var(--cc-glow);\n  position:relative; z-index:1;\n  transition:transform .3s, text-shadow .3s;\n}\n.class-card:hover .cc-letter {\n  transform:scale(1.1);\n  text-shadow:0 0 60px var(--cc-glow), 0 0 100px var(--cc-glow);\n}\n\n.cc-title {\n  font-family:sans-serif; font-size:.6rem; font-weight:700;\n  letter-spacing:.22em; text-transform:uppercase;\n  color:var(--text-dim); position:relative; z-index:1;\n}\n.cc-range {\n  font-family:'JetBrains Mono',monospace; font-size:.68rem; font-weight:600;\n  color:var(--text); opacity:.65; position:relative; z-index:1;\n  background:rgba(0,0,0,.2); border-radius:6px; padding:.3rem .6rem;\n  border:1px solid var(--border); display:inline-block;\n}\nbody.light .cc-range { background:rgba(0,0,0,.05); }\n\n.cc-stats {\n  display:flex; flex-direction:column; gap:.35rem;\n  margin-top:.3rem; position:relative; z-index:1;\n}\n.cc-stat {\n  display:flex; justify-content:space-between; align-items:center;\n  font-size:.58rem; color:var(--text-dim);\n}\n.cc-stat-val {\n  font-family:'JetBrains Mono',monospace; font-weight:700;\n  color:var(--cc-b); font-size:.6rem;\n}\n.cc-divider {\n  height:1px; background:var(--border); margin:.3rem 0;\n  position:relative; z-index:1;\n}\n.cc-mask-row {\n  display:flex; align-items:center; justify-content:space-between;\n  position:relative; z-index:1;\n}\n.cc-mask-label { font-size:.52rem; letter-spacing:.14em; color:var(--text-dim); text-transform:uppercase; }\n.cc-mask-val {\n  font-family:'JetBrains Mono',monospace; font-weight:700;\n  font-size:.9rem; color:var(--cc-b);\n}\n\n/* Bottom glow sweep on hover */\n.cc-sweep {\n  position:absolute; bottom:0; left:-100%; width:100%; height:1px;\n  background:linear-gradient(90deg,transparent,var(--cc-b),transparent);\n  transition:left .4s ease;\n}\n.class-card:hover .cc-sweep { left:0; }\n\n/* Landing hint */\n.landing-hint {\n  font-size:.58rem; letter-spacing:.16em; color:var(--text-dim); opacity:0;\n  animation:fadeUp .6s .75s ease forwards; text-align:center;\n}\n.landing-hint span { color:var(--accent); }\n\n@keyframes fadeUp {\n  from { opacity:0; transform:translateY(14px); }\n  to   { opacity:1; transform:translateY(0); }\n}\n\n/* ── PANEL ── */\n.panel {\n  background:var(--bg2); border:1px solid var(--border); border-radius:14px;\n  padding:1.5rem 1.75rem; position:relative; overflow:hidden; transition:border-color .3s;\n}\n.panel::before {\n  content:''; position:absolute; top:0; left:0; right:0; height:1px;\n  background:linear-gradient(90deg,transparent,var(--accent2),transparent); opacity:.5;\n}\n.panel:hover { border-color:var(--border2); }\n.panel-title {\n  font-family:sans-serif; font-size:.68rem; font-weight:700;\n  letter-spacing:.2em; text-transform:uppercase; color:var(--accent);\n  margin-bottom:1.25rem; display:flex; align-items:center; gap:.5rem;\n}\n.panel-title::before {\n  content:''; width:6px; height:6px; background:var(--accent);\n  border-radius:50%; box-shadow:0 0 8px var(--accent); flex-shrink:0;\n}\n\n/* ── MAIN APP (hidden until class selected) ── */\n#app { display:none; animation:fadeUp .35s ease; }\n#app.visible { display:block; }\n\n/* ── IP INPUT SECTION ── */\n.ip-section {\n  display:grid; grid-template-columns:1fr 2fr; gap:1.5rem;\n  margin-bottom:1.5rem; align-items:start;\n}\n@media(max-width:700px){ .ip-section{grid-template-columns:1fr;} }\n\n.ip-input-wrap { position:relative; }\n.ip-field {\n  width:100%; background:var(--bg3); border:1px solid var(--border);\n  border-radius:10px; padding:.85rem 1.1rem;\n  font-family:'JetBrains Mono',monospace; font-size:1.2rem; font-weight:600;\n  color:var(--text); outline:none; transition:border-color .2s, box-shadow .2s;\n  letter-spacing:.05em; text-align:center;\n}\n.ip-field:focus { border-color:var(--accent2); box-shadow:0 0 0 3px rgba(0,136,204,.15); }\n.ip-field.invalid { border-color:var(--red); box-shadow:0 0 0 3px rgba(255,68,102,.1); }\n\n.ip-display-big {\n  font-family:sans-serif; font-size:clamp(1.6rem,4vw,2.8rem);\n  font-weight:800; text-align:center; letter-spacing:-.01em; line-height:1;\n  padding:1rem; background:var(--bg3); border-radius:10px;\n  border:1px solid var(--border); transition:all .2s;\n}\n.ip-display-big .oct { color:var(--text); display:inline; transition:color .2s; }\n.ip-display-big .sep { color:var(--text-dim); }\n.ip-display-big.is-private .oct { color:var(--priv-col); }\n\n/* ── SLIDER ── */\n.slider-wrap { margin-top:1rem; }\n.slider-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:.6rem; }\n.slider-label { font-size:.6rem; letter-spacing:.15em; color:var(--text-dim); text-transform:uppercase; }\n.slider-val { font-family:sans-serif; font-size:.85rem; font-weight:800; color:var(--yellow); }\n\n.ip-range {\n  -webkit-appearance:none; appearance:none;\n  width:100%; height:7px; border-radius:4px; outline:none; border:none; cursor:pointer;\n  background:linear-gradient(to right,var(--accent) 0%,var(--accent) var(--fill,0%),var(--border2) var(--fill,0%),var(--border2) 100%);\n  transition:background .05s;\n}\n.ip-range::-webkit-slider-thumb {\n  -webkit-appearance:none; width:22px; height:22px; border-radius:50%;\n  background:var(--yellow); box-shadow:0 0 14px rgba(247,208,96,.6);\n  cursor:pointer; border:2px solid rgba(255,255,255,.2);\n  transition:transform .1s;\n}\n.ip-range::-webkit-slider-thumb:hover { transform:scale(1.15); }\n.slider-ticks { display:flex; justify-content:space-between; margin-top:.35rem; font-size:.55rem; color:var(--text-dim); }\n\n/* Private badge on slider */\n.private-indicator {\n  display:inline-flex; align-items:center; gap:.4rem;\n  padding:.3rem .8rem; border-radius:20px;\n  background:var(--priv-bg); border:1px solid var(--priv-border);\n  color:var(--priv-col); font-size:.68rem; font-weight:700;\n  opacity:0; transform:translateY(4px); transition:all .3s;\n}\n.private-indicator.visible { opacity:1; transform:translateY(0); }\n.private-indicator::before { content:''; width:7px; height:7px; border-radius:50%; background:var(--priv-col); animation:pulse 1.2s infinite; }\n\n/* ── BINARY DISPLAY ── */\n.binary-panel {\n  background:var(--bg2); border:1px solid var(--border); border-radius:14px;\n  padding:1.5rem 1.75rem; margin-bottom:1.5rem;\n}\n.binary-grid {\n  display:flex; gap:4px; flex-wrap:nowrap; margin-top:1rem;\n}\n@media(max-width:600px){\n  .binary-grid { flex-wrap:wrap; }\n  .octet-group { width:calc(50% - 4px); }\n}\n.octet-group {\n  flex:1; display:flex; flex-direction:column; gap:3px;\n  background:var(--bg3); border-radius:10px; padding:.5rem;\n  border:1px solid var(--border);\n}\n.octet-dec {\n  text-align:center; font-size:.7rem; font-weight:600;\n  color:var(--text); padding:.2rem .4rem;\n  background:var(--bg2); border-radius:5px; border:1px solid var(--border);\n  transition:color .2s;\n}\n.octet-bits { display:flex; gap:2px; }\n.bit {\n  flex:1; height:38px; border-radius:6px; display:flex; align-items:center;\n  justify-content:center; font-size:.85rem; font-weight:700;\n  transition:background .15s, color .15s, transform .1s;\n  position:relative; cursor:default;\n}\n.bit.net { background:var(--net-bg); color:var(--net-col); box-shadow:inset 0 0 0 1px var(--net-border); }\n.bit.host { background:var(--host-bg); color:var(--host-col); box-shadow:inset 0 0 0 1px var(--host-border); }\n.bit.changed { animation:bitflash .18s ease; }\n\n/* ── FIXED CLASS BITS ── */\n/* Bit fixe à 0 → rouge (le bit \"zéro\" qui définit la classe) */\n.bit.fixed-zero {\n  background:rgba(255,50,80,.22) !important;\n  color:#ff4466 !important;\n  box-shadow:inset 0 0 0 2px rgba(255,50,80,.75), 0 0 12px rgba(255,50,80,.4) !important;\n  font-weight:900 !important;\n  cursor:not-allowed;\n}\nbody.light .bit.fixed-zero {\n  background:rgba(220,0,40,.14) !important;\n  color:#cc0033 !important;\n  box-shadow:inset 0 0 0 2px rgba(220,0,40,.55) !important;\n}\n\n/* Bit fixe à 1 → vert/cyan selon classe */\n.bit.fixed-one {\n  background:rgba(0,255,157,.20) !important;\n  color:#00ff9d !important;\n  box-shadow:inset 0 0 0 2px rgba(0,255,157,.7), 0 0 12px rgba(0,255,157,.35) !important;\n  font-weight:900 !important;\n  cursor:not-allowed;\n}\nbody.light .bit.fixed-one {\n  background:rgba(0,136,68,.14) !important;\n  color:#007744 !important;\n  box-shadow:inset 0 0 0 2px rgba(0,136,68,.55) !important;\n}\n\n/* Légende dot mise à jour */\n.bl-fixed-zero { background:rgba(255,50,80,.22); border:2px solid rgba(255,50,80,.75); box-shadow:0 0 6px rgba(255,50,80,.4); }\n.bl-fixed-one  { background:rgba(0,255,157,.20);  border:2px solid rgba(0,255,157,.7);  box-shadow:0 0 6px rgba(0,255,157,.35); }\n\n/* Legend dot for fixed bits */\n.bl-fixed { background:rgba(255,204,0,.22); border:2px solid rgba(255,204,0,.7); box-shadow:0 0 6px rgba(255,204,0,.4); }\n\n/* separator line between NET/HOST */\n.bit.separator::after {\n  content:''; position:absolute; left:-3px; top:4px; bottom:4px;\n  width:2px; background:var(--yellow); border-radius:1px;\n  box-shadow:0 0 8px var(--yellow);\n}\n\n/* octet separator (dots) */\n.octet-dot {\n  display:flex; align-items:center; color:var(--text-dim); font-size:1.1rem;\n  font-weight:700; padding:.2rem 0; margin-top:2rem;\n  flex-shrink:0;\n}\n\n/* ── LEGEND ── */\n.bits-legend {\n  display:flex; gap:1.2rem; flex-wrap:wrap; margin-top:1rem; font-size:.68rem;\n}\n.bl { display:flex; align-items:center; gap:.4rem; }\n.bl-dot { width:14px; height:14px; border-radius:4px; flex-shrink:0; }\n.bl-net { background:var(--net-bg); border:1px solid var(--net-border); }\n.bl-host { background:var(--host-bg); border:1px solid var(--host-border); }\n.bl-priv { background:var(--priv-bg); border:1px solid var(--priv-border); }\n\n/* ── STATS ROW ── */\n.stats-row
