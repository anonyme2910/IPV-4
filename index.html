:100%}\n.pw-input:focus{outline:none;border-color:#3B82C4}\n.pw-err{font-size:12px;font-weight:700;color:#F0A0A0;min-height:14px}\n.pw-actions{display:flex;justify-content:flex-end;gap:8px}\n.pw-cancel{font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;cursor:pointer;background:#143E5C;color:#9FD0F5;border:none;border-radius:99px;padding:8px 18px}\n.pw-ok{font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;cursor:pointer;background:#1BA8C7;color:#06121F;border:none;border-radius:99px;padding:8px 22px}\n<\/style>\n<\/head>\n<body>\n<div id=\"app\"><\/div>\n<div id=\"devtools-block\">\n  <div class=\"dtb-lock\">🔒<\/div>\n  <div class=\"dtb-title\">Accès non autorisé<\/div>\n  <div class=\"dtb-sub\">Les outils de développement sont désactivés sur cette application.<br>Fermez-les pour reprendre.<\/div>\n<\/div>\n<div id=\"pw-modal\">\n  <div class=\"pw-box\">\n    <div class=\"pw-title\"><i class=\"ti ti-lock\"><\/i> <span id=\"pw-title-txt\">Réinitialiser la partie<\/span><\/div>\n    <div class=\"pw-sub\">Mot de passe :<\/div>\n    <input id=\"pw-input\" type=\"password\" class=\"pw-input\" autocomplete=\"off\" onkeydown=\"if(event.key==='Enter'){submitPw()}else if(event.key==='Escape'){closePwModal()}\">\n    <div id=\"pw-err\" class=\"pw-err\"><\/div>\n    <div class=\"pw-actions\">\n      <button class=\"pw-cancel\" onclick=\"closePwModal()\">Annuler<\/button>\n      <button class=\"pw-ok\" onclick=\"submitPw()\">OK<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n<script>\n// Écran \"Accès non autorisé\" lorsqu'on tente d'ouvrir / utiliser les outils de développement\nfunction showBlock(){var b=document.getElementById('devtools-block');if(b)b.style.display='flex';}\nfunction hideBlock(){var b=document.getElementById('devtools-block');if(b)b.style.display='none';}\n\ndocument.addEventListener('contextmenu',e=>e.preventDefault());\nvar keyLockUntil=0;\ndocument.addEventListener('keydown',function(e){\n  const k=(e.key||'').toUpperCase();\n  // F12 / Ctrl+Maj+I / J / C : on bloque la touche ET on affiche l'écran de blocage\n  if(k==='F12'\n    ||((e.ctrlKey||e.metaKey)&&e.shiftKey&&(k==='I'||k==='J'||k==='C'))\n    ||(e.metaKey&&e.altKey&&(k==='I'||k==='J'||k==='C'))){\n    e.preventDefault();e.stopPropagation();\n    keyLockUntil=Date.now()+2000;\n    showBlock();\n    return false;\n  }\n  // Ctrl+U (code source) / Ctrl+S (enregistrer) : on bloque\n  if(((e.ctrlKey||e.metaKey)&&k==='U')||((e.ctrlKey||e.metaKey)&&k==='S')){\n    e.preventDefault();e.stopPropagation();return false;\n  }\n  // F5 / Ctrl+R / Ctrl+Maj+R : actualisation protégée par mot de passe\n  if(k==='F5'||((e.ctrlKey||e.metaKey)&&k==='R')){\n    e.preventDefault();e.stopPropagation();\n    if(typeof askRefresh==='function')askRefresh();\n    return false;\n  }\n});\n\n// Actualisation clavier protégée par mot de passe (voir keydown ci-dessus)\nlet allowReload=false;\n\n// Surveillance continue : affiche l'écran tant que les outils sont ouverts, le masque dès qu'ils sont refermés\nsetInterval(function(){\n  var seuil=160;\n  var ouvert=(window.outerWidth-window.innerWidth>seuil)||(window.outerHeight-window.innerHeight>seuil);\n  if(ouvert||Date.now()<keyLockUntil)showBlock();else hideBlock();\n},600);\n\nconst DIFFS=[\n  {key:'d1',label:'Facile',gain:1,perte:1,icon:'ti-mood-smile',desc:'+1 pt si tout juste\\n-1 pt si erreur',notePer:5,noteLoss:2},\n  {key:'d2',label:'Moyen',gain:0.5,perte:0.5,icon:'ti-mood-neutral',desc:'+0.5 pt si tout juste\\n-0.5 pt si erreur',notePer:5,noteLoss:2},\n  {key:'d3',label:'Difficile',gain:0.25,perte:0.25,icon:'ti-mood-sad',desc:'+0.25 pt si tout juste\\n-0.25 pt si erreur',notePer:10,noteLoss:5},\n];\nconst QUESTIONS=[\n  {id:'classe',label:'Classe du réseau',hint:'A, B ou C'},\n  {id:'masque',label:'Masque par défaut',hint:'ex: 255.0.0.0'},\n  {id:'reseau',label:'Adresse réseau',hint:'ex: 10.0.0.0'},\n  {id:'broadcast',label:'Adresse broadcast',hint:'ex: 10.255.255.255'},\n  {id:'premier',label:'Premier hôte',hint:'ex: 10.0.0.1'},\n  {id:'dernier',label:'Dernier hôte',hint:'ex: 10.255.255.254'},\n];\nconst QCOLORS={\n  classe:{u:'#143A58',ub:'#3E92C8',ut:'#A8D8F5'},\n  masque:{u:'#143A58',ub:'#3E92C8',ut:'#A8D8F5'},\n  reseau:{u:'#3C1C30',ub:'#9A4A6E',ut:'#F2A8C2'},\n  broadcast:{u:'#3C1C30',ub:'#9A4A6E',ut:'#F2A8C2'},\n  premier:{u:'#13473A',ub:'#3FA47C',ut:'#A8ECD5'},\n  dernier:{u:'#13473A',ub:'#3FA47C',ut:'#A8ECD5'},\n};\n\nfunction ri(a,b){return Math.floor(Math.random()*(b-a+1))+a}\nfunction genIP(){\n  const t=ri(0,2);\n  if(t===0)return{oct:[ri(1,126),ri(0,255),ri(0,255),ri(0,255)],cls:'A'};\n  if(t===1)return{oct:[ri(128,191),ri(0,255),ri(0,255),ri(0,255)],cls:'B'};\n  return{oct:[ri(192,223),ri(0,255),ri(0,255),ri(0,255)],cls:'C'};\n}\nfunction getMask(c){return c==='A'?'255.0.0.0':c==='B'?'255.255.0.0':'255.255.255.0'}\nfunction getNetwork(o,c){return c==='A'?o[0]+'.0.0.0':c==='B'?o[0]+'.'+o[1]+'.0.0':o[0]+'.'+o[1]+'.'+o[2]+'.0'}\nfunction getBroadcast(o,c){return c==='A'?o[0]+'.255.255.255':c==='B'?o[0]+'.'+o[1]+'.255.255':o[0]+'.'+o[1]+'.'+o[2]+'.255'}\nfunction getFirst(o,c){return c==='A'?o[0]+'.0.0.1':c==='B'?o[0]+'.'+o[1]+'.0.1':o[0]+'.'+o[1]+'.'+o[2]+'.1'}\nfunction getLast(o,c){return c==='A'?o[0]+'.255.255.254':c==='B'?o[0]+'.'+o[1]+'.255.254':o[0]+'.'+o[1]+'.'+o[2]+'.254'}\nfunction getCIDR(c){return c==='A'?'/8':c==='B'?'/16':'/24'}\nfunction isPrivate(o){\n  if(o[0]===10)return true;\n  if(o[0]===172&&o[1]>=16&&o[1]<=31)return true;\n  if(o[0]===192&&o[1]===168)return true;\n  return false;\n}\nfunction getVisibilite(o){return isPrivate(o)?'privée':'publique'}\nfunction getNthHost(o,c,n){\n  if(c==='A'){const b=o[0]*16777216;const a=b+n;return[(a>>>24)&255,(a>>>16)&255,(a>>>8)&255,a&255].join('.');}\n  if(c==='B'){const b=o[0]*16777216+o[1]*65536;const a=b+n;return[(a>>>24)&255,(a>>>16)&255,(a>>>8)&255,a&255].join('.');}\n  const b=o[0]*16777216+o[1]*65536+o[2]*256;const a=b+n;return[(a>>>24)&255,(a>>>16)&255,(a>>>8)&255,a&255].join('.');\n}\nfunction getAnswers(ip){return{\n  classe:ip.cls,masque:getMask(ip.cls),reseau:getNetwork(ip.oct,ip.cls),\n  broadcast:getBroadcast(ip.oct,ip.cls),premier:getFirst(ip.oct,ip.cls),dernier:getLast(ip.oct,ip.cls),\n  cidr:getCIDR(ip.cls),visibilite:getVisibilite(ip.oct)\n};}\nfunction fmt(n){return parseFloat(n.toFixed(2))}\nfunction coloredIP(ip){\n  const netCount=ip.cls==='A'?1:ip.cls==='B'?2:3;\n  return ip.oct.map((v,i)=>`<span class=\"ip-${i<netCount?'net':'host'}\">${v}<\/span>`).join('<span class=\"ip-dot\">.<\/span>');\n}\n\nlet diff=null,score=0,ip=null,answers=null,inputs={},bonusInput='',bonusN=200,coups=0;\nlet validated=false,roundResult=null,won=false,lockedIn=false,finished=false;\n\nlet startTime=Date.now(),timerRunning=false,finalTime=0;\nfunction getElapsed(){return timerRunning?Date.now()-startTime:finalTime;}\nfunction fmtTime(ms){const s=Math.floor(ms/1000);const m=Math.floor(s/60);return String(m).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}\nfunction resetTimer(){startTime=Date.now();timerRunning=true;finalTime=0;}\nfunction menuTimer(){startTime=Date.now();timerRunning=false;finalTime=0;}\nfunction stopTimer(){if(timerRunning){finalTime=Date.now()-startTime;timerRunning=false;}}\nfunction updateTimer(){const t=fmtTime(getElapsed());document.querySelectorAll('.timer-val,.dt-val').forEach(e=>e.textContent=t);}\nsetInterval(updateTimer,1000);\n\nfunction allFilled(){\n  const base=QUESTIONS.every(q=>(inputs[q.id]||'').trim());\n  if(!base)return false;\n  if(!diff||diff.key==='d1')return true;\n  if(diff.key==='d3'&&(!(inputs.cidr||'').trim()||!(inputs.visibilite||'').trim()))return false;\n  return !!bonusInput.trim();\n}\n\nfunction nextIP(){\n  ip=genIP();answers=getAnswers(ip);\n  inputs={};bonusInput='';bonusN=ip.cls==='C'?ri(2,253):ri(200,280);\n  validated=false;roundResult=null;\n  render();\n}\n\nfunction newIP(){\n  coups++;\n  score=Math.max(0,fmt(score-diff.perte));\n  nextIP();\n}\n\nfunction chooseDiff(d){diff=d;score=0;coups=0;won=false;lockedIn=false;finished=false;resetTimer();nextIP();}\nfunction goBack(){if(lockedIn)return;diff=null;menuTimer();render();saveState();}\nfunction finishGame(){finished=true;stopTimer();render();}\n\nconst RH=[189,29,88,107,7,110,242,123,155,130,151,106,69,170,82,167,199,172,114,45,204,192,223,4,203,38,198,172,233,4,152,180];\nlet _pwAction=null;\nfunction openPwModal(title,action){\n  _pwAction=action;\n  document.getElementById('pw-title-txt').textContent=title;\n  const inp=document.getElementById('pw-input');\n  document.getElementById('pw-err').textContent='';\n  inp.value='';\n  document.getElementById('pw-modal').classList.add('show');\n  setTimeout(()=>inp.focus(),50);\n}\nfunction closePwModal(){document.getElementById('pw-modal').classList.remove('show');_pwAction=null;}\nasync function submitPw(){\n  const inp=document.getElementById('pw-input');\n  const err=document.getElementById('pw-err');\n  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(inp.value));\n  const h=Array.from(new Uint8Array(buf));\n  if(h.length===RH.length&&h.every((b,i)=>b===RH[i])){const a=_pwAction;closePwModal();if(a)a();}\n  else{err.textContent='Mot de passe incorrect.';inp.value='';inp.focus();}\n}\nconst STORAGE_KEY='quizIpState_v1';\nfunction saveState(){\n  try{\n    sessionStorage.setItem(STORAGE_KEY,JSON.stringify({\n      diff,score,ip,answers,inputs,bonusInput,bonusN,coups,\n      validated,roundResult,won,lockedIn,finished,\n      startTime,timerRunning,finalTime\n    }));\n  }catch(e){}\n}\nfunction loadState(){\n  try{\n    const raw=sessionStorage.getItem(STORAGE_KEY);\n    if(!raw)return false;\n    const s=JSON.parse(raw);\n    diff=s.diff;score=s.score;ip=s.ip;answers=s.answers;inputs=s.inputs||{};\n    bonusInput=s.bonusInput||'';bonusN=s.bonusN;coups=s.coups||0;\n    validated=s.validated;roundResult=s.roundResult;won=s.won;lockedIn=s.lockedIn;finished=s.finished;\n    startTime=s.startTime;timerRunning=s.timerRunning;finalTime=s.finalTime;\n    return true;\n  }catch(e){return false;}\n}\n// Avertissement natif du navigateur avant tout départ de la page (rechargement via le bouton\n// du navigateur, fermeture d'onglet, etc.) — la touche clavier F5/Ctrl+R reste, elle, bloquée\n// en amont par mot de passe (voir keydown plus haut), donc on ignore l'avertissement dans ce cas.\nwindow.addEventListener('beforeunload',function(e){\n  if(allowReload)return;\n  e.preventDefault();\n  e.returnValue='';\n});\nfunction changeLevel(){doReset();saveState();}\nfunction askReset(){openPwModal('Réinitialiser la partie',doReset);}\nfunction askRefresh(){openPwModal('Actualiser la page',function(){allowReload=true;location.reload();});}\nfunction doReset(){\n  diff=null;score=0;coups=0;won=false;lockedIn=false;finished=false;\n  inputs={};bonusInput='';validated=false;roundResult=null;\n  menuTimer();render();\n}\n\nfunction upInput(id,val){inputs[id]=val;refreshValidateBtn();}\nfunction upBonus(val){bonusInput=val;refreshValidateBtn();}\nfunction chooseVis(v){if(validated)return;inputs.visibilite=v;render();}\nfunction refreshValidateBtn(){\n  const btn=document.getElementById('vbtn');\n  if(btn)btn.disabled=!allFilled();\n}\n\nfunction validate(){\n  if(!allFilled()||validated)return;\n  validated=true;\n  coups++;\n  lockedIn=true;\n  const isFacile=diff.key==='d1';\n  const bonusCorrect=getNthHost(ip.oct,ip.cls,bonusN);\n  let allOk=true;\n  const details={};\n  QUESTIONS.forEach(q=>{\n    const ok=(inputs[q.id]||'').trim().toUpperCase().replace(/\\s/g,'')===answers[q.id].toUpperCase().replace(/\\s/g,'');\n    details[q.id]=ok;if(!ok)allOk=false;\n  });\n  let extraErr=0;\n  if(diff.key==='d3'){\n    const cidrIn=(inputs.cidr||'').trim().replace(/\\s/g,'').replace(/^\\//,'');\n    const cidrOk=cidrIn===answers.cidr.replace(/^\\//,'');\n    details.cidr=cidrOk;if(!cidrOk){allOk=false;extraErr++;}\n    const visIn=(inputs.visibilite||'').trim().toLowerCase();\n    const visTok=visIn.startsWith('priv')?'priv':visIn.startsWith('pub')?'pub':'';\n    const visOk=(visTok==='priv'&&answers.visibilite==='privée')||(visTok==='pub'&&answers.visibilite==='publique');\n    details.visibilite=visOk;if(!visOk){allOk=false;extraErr++;}\n  }\n  let bok=true;\n  if(!isFacile){\n    bok=(bonusInput||'').trim().replace(/\\s/g,'')===bonusCorrect;\n    if(!bok)allOk=false;\n    details.bonus=bok;\n  }\n  const errCount=QUESTIONS.filter(q=>!details[q.id]).length+extraErr+((!isFacile&&!bok)?1:0);\n  roundResult={allOk,details,bonusCorrect,errCount};\n  if(allOk){score=fmt(score+diff.gain);if(score>=20){won=true;stopTimer();}}\n  else{score=Math.max(0,fmt(score-diff.perte));}\n  render();\n}\n\nfunction hkey(e){if(e.key==='Enter'){const b=document.getElementById('vbtn');if(b&&!b.disabled)validate();}}\n\nfunction render(){\n  const app=document.getElementById('app');\n\n  if(!diff){\n    app.innerHTML=`<div class=\"diff-screen\">\n      <div class=\"diff-title\"><i class=\"ti ti-network\"><\/i> Quiz Adressage IP<\/div>\n      <div class=\"diff-sub\">Choisis ta difficulté — elle sera verrouillée pour toute la partie<\/div>\n      <div class=\"diff-timer\"><i class=\"ti ti-clock\"><\/i> Temps : <span class=\"dt-val\">${fmtTime(getElapsed())}<\/span><\/div>\n      <div class=\"diff-grid\">${DIFFS.map(d=>`\n        <button class=\"diff-btn ${d.key}\" onclick=\"chooseDiff(${JSON.stringify(d).replace(/\"/g,'&quot;')})\">\n          <i class=\"ti ${d.icon} diff-icon\"><\/i>\n          <span class=\"diff-name\">${d.label}<\/span>\n          <span class=\"diff-info\">${d.desc.replace('\\n','<br>')}<\/span>\n        <\/button>`).join('')}\n      <\/div>\n    <\/div>`;\n    return;\n  }\n\n  if(won||finished){\n    const baseline=Math.round(20/diff.gain);\n    const extra=Math.max(0,coups-baseline);\n    const penalty=diff.noteLoss*Math.floor(extra/diff.notePer);\n    const reached=score>=20;\n    const note=reached?Math.max(0,20-penalty):fmt(Math.round(score*2)/2);\n    app.innerHTML=`<div class=\"win-panel\">\n      <div style=\"font-size:3rem\">${reached?'🎉':'🏁'}<\/div>\n      <div class=\"win-title\">Note : ${note} / 20<\/div>\n      <div class=\"win-sub\">${reached?`Objectif atteint en <strong>${coups} coups<\/strong> — objectif : ${baseline} coups`:`Partie terminée — <strong>${score.toFixed(2)} pt<\/strong> en ${coups} coups`} (mode <strong>${diff.label}<\/strong>)<\/div>\n      <div class=\"win-sub\" style=\"color:#5FD0E8\"><i class=\"ti ti-clock\"><\/i> Temps : <strong>${fmtTime(getElapsed())}<\/strong><\/div>\n      ${reached?`<div class=\"win-sub\" style=\"color:#7FA3C4\">−${diff.noteLoss} pt par tranche de ${diff.notePer} coups au-delà de l'objectif<\/div>`:''}\n      <button class=\"restart-btn\" onclick=\"diff=null;menuTimer();render();saveState()\"><i class=\"ti ti-refresh\"><\/i> Rejouer<\/button>\n      <button class=\"reset-btn\" style=\"width:auto;padding:8px 18px\" onclick=\"askReset()\"><i class=\"ti ti-lock\"><\/i> Réinitialiser<\/button>\n    <\/div>`;\n    return;\n  }\n\n  const pct=Math.min(100,(score/20)*100);\n  const ipStr=ip.oct.join('.');\n  const ipHtml=diff.key==='d1'?coloredIP(ip):ipStr;\n  const bonusCorrect=getNthHost(ip.oct,ip.cls,bonusN);\n  const done=validated;\n  const dk=diff.key;\n  const dcolor=dk==='d1'?'#5CA03A':dk==='d2'?'#C79A3A':'#E24B4A';\n  const dbg=dk==='d1'?'#16301A':dk==='d2'?'#33260D':'#361616';\n  const dtc=dk==='d1'?'#A8E08A':dk==='d2'?'#F5C77A':'#F09595';\n\n  let qCards=QUESTIONS.map(q=>{\n    const col=QCOLORS[q.id];\n    const val=(inputs[q.id]||'');\n    let cc,inputClass='q-input',ic='',hint='';\n    if(!done){\n      cc=val?'q-card filled':'q-card unanswered neon';\n      inputClass=val?'q-input filled':'q-input';\n    } else {\n      const ok=roundResult.details[q.id];\n      cc=ok?'q-card correct':'q-card wrong';\n      ic=ok?'✓ ':'✗ ';\n      inputClass=ok?'q-input correct':'q-input wrong';\n      if(!ok)hint=`<div class=\"q-hint\">→ ${answers[q.id]}<\/div>`;\n    }\n    const style=!done?`background:${col.u};border-color:${col.ub};--glow:${col.ub}`:'';\n    const titleStyle=!done?`color:${col.ut}`:'';\n    let qlabel=q.label,cidrInput='',cidrHint='',rowStyle='';\n    if(q.id==='masque'&&diff.key==='d3'){\n      qlabel='Masque par défaut';\n      rowStyle='align-items:center';\n      const cval=(inputs.cidr||'');\n      let cClass='q-input';\n      if(!done){cClass=cval?'q-input filled':'q-input';}\n      else{const cok=roundResult.details.cidr;cClass=cok?'q-input correct':'q-input wrong';if(!cok)cidrHint=`<div class=\"q-hint\">→ CIDR ${answers.cidr}<\/div>`;}\n      cidrInput=`<input class=\"${cClass}\" type=\"text\" placeholder=\"\" value=\"${cval}\" ${done?'disabled':''} style=\"width:64px;flex:0 0 auto;text-align:center\" oninput=\"upInput('cidr',this.value)\" onkeydown=\"hkey(event)\">`;\n    }\n    const cidrBlock = (q.id==='masque'&&diff.key==='d3') ? `<div style=\"position:relative;flex:0 0 auto\"><span class=\"cidr-lbl\" style=\"${titleStyle};position:absolute;left:50%;top:-13px;transform:translateX(-50%);white-space:nowrap\">CIDR<\/span>${cidrInput}<\/div>` : '';\n    return `<div class=\"${cc}\" style=\"${style}\">\n      <div class=\"q-title\" style=\"${titleStyle}\">${ic}${qlabel}<\/div>\n      <div class=\"q-row\" style=\"${rowStyle||'align-items:center'}\">\n        <input class=\"${inputClass}\" type=\"text\" placeholder=\"${diff.key==='d1'?q.hint:''}\" value=\"${val}\" ${done?'disabled':''} oninput=\"upInput('${q.id}',this.value)\" onkeydown=\"hkey(event)\">${cidrBlock}\n      <\/div>${hint}${cidrHint}\n    <\/div>`;\n  }).join('');\n\n  let bonusCard='';\n  if(diff.key!=='d1'){\n    const bval=bonusInput||'';\n    let bcc,bInputClass='q-input',bic='',bhint='';\n    if(!done){\n      bcc=bval?'q-card bonus filled':'q-card bonus unanswered neon';\n      bInputClass=bval?'q-input filled':'q-input';\n    } else {\n      const bok=roundResult.details.bonus;\n      bcc=bok?'q-card bonus correct':'q-card bonus wrong';\n      bic=bok?'✓ ':'✗ ';\n      bInputClass=bok?'q-input correct':'q-input wrong';\n      if(!bok&&diff.key==='d2')bhint=`<div class=\"q-hint\">→ ${bonusCorrect}<\/div>`;\n    }\n    bonusCard=`<div class=\"${bcc}\" style=\"${!done&&!bval?'--glow:#9A4A6E':''}\">\n      <div class=\"q-title\" style=\"${!done?'color:#F5C77A':''}\">${bic}${bonusN}ème hôte utilisable ?<\/div>\n      <div class=\"q-row\">\n        <input class=\"${bInputClass}\" type=\"text\" placeholder=\"\" value=\"${bval}\" ${done?'disabled':''} oninput=\"upBonus(this.value)\" onkeydown=\"hkey(event)\">\n      <\/div>${bhint}\n    <\/div>`;\n  }\n\n  let visCard='';\n  if(diff.key==='d3'){\n    const vval=(inputs.visibilite||'');\n    let vcc='q-card bonus unanswered',vic='',pubCls='vis-opt',privCls='vis-opt';\n    if(!done){\n      vcc=vval?'q-card bonus filled':'q-card bonus unanswered neon';\n      if(vval==='publique')pubCls+=' sel';\n      if(vval==='privée')privCls+=' sel';\n    } else {\n      const vok=roundResult.details.visibilite;\n      vcc=vok?'q-card bonus correct':'q-card bonus wrong';\n      vic=vok?'✓ ':'✗ ';\n      const correct=answers.visibilite;\n      if(vval==='publique')pubCls+=(correct==='publique'?' correct':' wrong');\n      if(vval==='privée')privCls+=(correct==='privée'?' correct':' wrong');\n      if(!vok){if(correct==='publique')pubCls+=' correct';else privCls+=' correct';}\n    }\n    const dis=done?'disabled':'';\n    visCard=`<div class=\"${vcc}\" style=\"${!done&&!vval?'--glow:#9A4A6E':''}\">\n      <div class=\"q-title\" style=\"${!done?'color:#7FB8F0':''}\">${vic}Adresse publique ou privée ?<\/div>\n      <div class=\"vis-choice\">\n        <button class=\"${pubCls}\" ${dis} onclick=\"chooseVis('publique')\">Publique<\/button>\n        <button class=\"${privCls}\" ${dis} onclick=\"chooseVis('privée')\">Privée<\/button>\n      <\/div>\n    <\/div>`;\n  }\n\n  let bottomHtml='';\n  if(!done){\n    bottomHtml=`<button id=\"vbtn\" class=\"validate-btn\" style=\"background:${dcolor}\" onclick=\"validate()\" disabled><i class=\"ti ti-check\"><\/i> Valider toutes les réponses<\/button>`;\n  } else {\n    const rr=roundResult;\n    bottomHtml=`<div class=\"result-row\">\n      <div class=\"result-banner ${rr.allOk?'win':'lose'}\">\n        <span class=\"result-txt\">${rr.allOk?'Parfait ! Toutes les réponses sont correctes !':rr.errCount+' erreur'+(rr.errCount>1?'s':'')+' — prends le temps de voir tes erreurs'}<\/span>\n        <span class=\"result-pts\">${rr.allOk?'+'+diff.gain:'-'+diff.perte} pt<\/span>\n      <\/div>\n      <button class=\"next-btn\" onclick=\"nextIP()\"><i class=\"ti ti-arrow-right\"><\/i> IP suivante<\/button>\n    <\/div>`;\n  }\n\n  app.innerHTML=`\n    <div class=\"topbar\">\n      <div class=\"score-wrap\"><div class=\"score-lbl\">Score<\/div><div class=\"score-val\">${score.toFixed(2)}<\/div><\/div>\n      <div class=\"prog-wrap\">\n        <div class=\"prog-track\"><div class=\"prog-fill\" style=\"width:${pct.toFixed(1)}%;background:${dcolor}\"><\/div><\/div>\n      <\/div>\n      <span class=\"diff-badge\" style=\"background:${dbg};color:${dtc}\">${diff.label} · +${diff.gain}/-${diff.perte}<\/span>\n      <div class=\"goal-wrap\"><div class=\"goal-lbl\">Objectif<\/div><div class=\"goal-val\">20<\/div><\/div>\n      <div class=\"timer-wrap\"><div class=\"timer-lbl\">Temps<\/div><div class=\"timer-val\">${fmtTime(getElapsed())}<\/div><\/div>\n    <\/div>\n    <div class=\"main\">\n      <div class=\"ip-panel\">\n        <span class=\"cls-badge cls-${ip.cls}\">${done?'Classe '+ip.cls:'Classe ?'}<\/span>\n        <div class=\"ip-addr\">${ipHtml}<\/div>\n        <div class=\"rules-note\" style=\"color:${dtc};background:${dbg}\"><i class=\"ti ti-info-circle\"><\/i> Tout juste : +${diff.gain} pt &nbsp;|&nbsp; Erreur : -${diff.perte} pt<\/div>\n        <button class=\"new-ip-btn\" onclick=\"newIP()\"><i class=\"ti ti-refresh\"><\/i> Nouvelle IP (-${diff.perte} pt)<\/button>\n        <button class=\"finish-btn\" onclick=\"finishGame()\"><i class=\"ti ti-flag\"><\/i> Finir &amp; voir la note<\/button>\n        <button class=\"lvl-btn\" onclick=\"changeLevel()\"><i class=\"ti ti-adjustments\"><\/i> Changer de niveau · chrono 0<\/button>\n        <button class=\"reset-btn\" onclick=\"askReset()\"><i class=\"ti ti-lock\"><\/i> Réinitialiser<\/button>\n        ${lockedIn?'':`<button class=\"back-btn\" onclick=\"goBack()\"><i class=\"ti ti-arrow-left\"><\/i> Changer de mode<\/button>`}\n      <\/div>\n      <div class=\"q-panel\">${qCards}${visCard}${bonusCard}<\/div>\n    <\/div>\n    <div class=\"bottom\">${bottomHtml}<\/div>\n  `;\n\n  if(!done){const b=document.getElementById('vbtn');if(b)b.disabled=!allFilled();}\n  saveState();\n}\n\nloadState();\nif(!diff)menuTimer();\nrender();\n<\/script>\n<\/body>\n<\/html>\n";

const loaded = {cours:false, quiz:false};
const SRC = {cours:SRC_COURS, quiz:SRC_QUIZ};

function openPage(which){
  /* chargée au premier clic seulement (le chrono du quiz démarre à ce moment-là) */
  if(!loaded[which]){
    document.getElementById('f-'+which).srcdoc = SRC[which];
    loaded[which] = true;
  }
  document.getElementById('home').classList.add('hidden');
  document.getElementById('page-cours').classList.toggle('on', which==='cours');
  document.getElementById('page-quiz').classList.toggle('on', which==='quiz');
  try{ document.getElementById('f-'+which).contentWindow.focus(); }catch(e){}
}

/* Fond animé de l'accueil : la Box, ses appareils, la passerelle, le pare-feu, le NAT et Internet */
(function(){
  const cv=document.getElementById('bg'), cx=cv.getContext('2d'), home=document.getElementById('home');
  const PUB='82.123.45.6', LAN='192.168.1.1', SERVER='8.8.8.8', HACKER='203.0.113.66';

  const rnd=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.floor(Math.random()*a.length)];

  /* positions en fractions de l'écran */
  const ST={
    box:{fx:.19,fy:.24},
    fw :{fx:.34,fy:.11,e:'🧱',label:'PARE-FEU',sub:'filtre les paquets',c:'255,140,60'},
    nat:{fx:.52,fy:.085,e:'🔄',label:'NAT',sub:'IP privée → publique',c:'168,85,247'},
    net:{fx:.80,fy:.27,e:'🌐',label:'INTERNET',sub:'',c:'0,212,255'},
    srv:{fx:.92,fy:.52,e:'🗄️',label:'SERVEUR',sub:SERVER,c:'0,255,157'}
  };
  const DEVS=[
    {id:'d0',e:'📱',ip:'192.168.1.12',fx:.06,fy:.27},
    {id:'d1',e:'💻',ip:'192.168.1.23',fx:.06,fy:.42},
    {id:'d2',e:'🖥️',ip:'192.168.1.30',fx:.06,fy:.57},
    {id:'d3',e:'📺',ip:'192.168.1.41',fx:.06,fy:.72},
    {id:'d4',e:'🎮',ip:'192.168.1.50',fx:.06,fy:.87}
  ];
  DEVS.forEach(d=>{ST[d.id]=d; d.c='0,212,255'; d.bob=rnd(0,6.28);});
  const EDGES=[...DEVS.map(d=>[d.id,'box']),['box','fw'],['fw','nat'],['nat','net'],['net','srv']];

  let W,H,S=1,T=0,courses=[],bits=[],packets=[],msgs=[],sparks=[],pulse={};

    courses=Array.from({length:9},()=>({x:rnd(0,W),y:rnd(0,H),vy:-rnd(.12,.35),e:pick(COURSE),s:rnd(26,40),ph:rnd(0,6.28),sp:rnd(.01,.02)}));
    bits=Array.from({length:Math.floor(W*H/30000)},()=>({x:rnd(0,W),y:rnd(0,H),vy:-rnd(.3,.8),t:Math.random()<.5?'0':'1',a:rnd(.06,.18),s:rnd(11,15)}));
    packets=[];msgs=[];
  }
  window.addEventListener('resize',resize);resize();

  function emoji(e,x,y,size,alpha,rot,sc){
    cx.save();cx.globalAlpha=alpha;cx.translate(x,y);
    if(rot)cx.rotate(rot);if(sc&&sc!==1)cx.scale(sc,sc);

    cx.textAlign='center';cx.textBaseline='middle';cx.fillText(e,0,0);cx.restore();
  }
  function pill(x,y,text,font,fill,stroke,color,alpha){
    cx.save();cx.globalAlpha=alpha;cx.font=font;cx.textAlign='center';cx.textBaseline='middle';

  /* ---------- paquets ---------- */

    cx.shadowBlur=0;
    cx.fillStyle='rgba(0,212,255,.9)';cx.font='700 '+(11*S)+'px "JetBrains Mono",monospace';cx.textAlign='center';cx.textBaseline='middle';
    cx.fillText('BOX',x,y-9*S);

    pill(x,y+h/2+42*S,PUB+' · publique','700 '+(10*S)+'px "JetBrains Mono",monospace','rgba(5,8,16,.85)','rgba(168,85,247,.5)','#d2a8ff',.95);
  }
  function drawStation(id,s,x,y){
    const g=pulse[id]||0,r=(24+g*5)*S;

    cx.fillStyle='rgba('+s.c+',.95)';cx.font='700 '+(11*S)+'px "JetBrains Mono",monospace';cx.textAlign='center';cx.textBaseline='middle';
    cx.fillText(s.label,x,y+r+14*S);

    cx.beginPath();cx.arc(x,by,(21+g*4)*S,0,6.283);cx.fill();cx.stroke();cx.restore();
    emoji(d.e,x,by+1,22*S,1,0,1+g*.25);
    pill(x,by+34*S,d.ip,'600 '+(10*S)+'px "JetBrains Mono",monospace','rgba(5,8,16,.8)','rgba(0,212,255,.35)','#9fe9ff',.95);
  }

  function draw(){
    T++;cx.clearRect(0,0,W,H);
    for(const k in pulse){pulse[k]*=.94;if(pulse[k]<.01)pulse[k]=0;}

    /* ambiance : 0/1 et émojis de cours, très discrets */
    for(const b of bits){
      b.y+=b.vy;if(b.y<-20){b.y=H+20;b.x=rnd(0,W);}
      cx.fillStyle='rgba(0,255,157,'+b.a+')';cx.font=b.s+'px "JetBrains Mono",monospace';cx.textAlign='center';cx.fillText(b.t,b.x,b.y);
    }
    for(const c of courses){
      c.ph+=c.sp;c.x+=Math.sin(c.ph)*.35;c.y+=c.vy;if(c.y<-50){c.y=H+50;c.x=rnd(0,W);c.e=pick(COURSE);}
      emoji(c.e,c.x,c.y,c.s,.16+.06*Math.sin(c.ph*2),Math.sin(c.ph)*.35,1);
    }

    /* câbles */
    cx.lineWidth=1.4;cx.setLineDash([7,9]);cx.lineDashOffset=-T*.5;
    for(const [a,b] of EDGES){
      const A=pos(a),B=pos(b);
      cx.strokeStyle=(a==='net'||b==='srv'||a==='nat')?'rgba(168,85,247,.28)':'rgba(0,212,255,.26)';
      cx.beginPath();cx.moveTo(A.x,A.y);cx.lineTo(B.x,B.y);cx.stroke();
    }
    cx.setLineDash([]);

    /* nouveaux paquets */
    if(T%130===1&&packets.length<4)spawn(null,Math.random()<.22);

    /* stations / appareils */
    for(const d of DEVS){const p=pos(d.id);drawDevice(d,p.x,p.y);}
    for(const id of ['fw','nat','net','srv']){const p=pos(id);drawStation(id,ST[id],p.x,p.y);}
    {const p=pos('box');drawBox(p.x,p.y);}

    /* paquets */
    for(let k=packets.length-1;k>=0;k--){
      const p=packets[k];
      let x,y;
      if(p.dwell>0){
        p.dwell--;
        const P=pos(p.path[p.i]);x=P.x;y=P.y;
        if(p.dead)x+=Math.sin(T*1.6)*3;
        if(p.dwell===0&&(p.dead||p.done)){
          for(let n=0;n<10;n++){const a=rnd(0,6.28),v=rnd(1,3);sparks.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,c:p.dead?'255,70,90':'0,255,157'});}
          packets.splice(k,1);continue;
        }
      }else{
        const A=pos(p.path[p.i]),B=pos(p.path[p.i+1]);
        const len=Math.hypot(B.x-A.x,B.y-A.y)||1;
        p.t+=3.4/len;
        if(p.t>=1){p.i++;p.t=0;arrive(p,p.path[p.i]);const P=pos(p.path[p.i]);x=P.x;y=P.y;}
        else{x=A.x+(B.x-A.x)*p.t;y=A.y+(B.y-A.y)*p.t;}
        p.trail=p.trail||[];p.trail.push({x,y});if(p.trail.length>16)p.trail.shift();
        for(let i=0;i<p.trail.length;i++){const f=i/p.trail.length;cx.fillStyle='rgba('+p.col+','+(f*.5)+')';cx.beginPath();cx.arc(p.trail[i].x,p.trail[i].y,f*3.2,0,6.283);cx.fill();}
      }
      cx.save();cx.shadowColor='rgba('+p.col+',1)';cx.shadowBlur=14;
      emoji(p.e,x,y,20*S,1,Math.sin(T*.2)*.2,1+.12*Math.sin(T*.3));cx.restore();
      pill(x,y-24*S,p.src+' → '+p.dst,'600 '+(9.5*S)+'px "JetBrains Mono",monospace','rgba(5,8,16,.88)','rgba('+p.col+',.7)','rgb('+p.col+')',1);
    }

    /* bulles d'explication */
    for(let k=msgs.length-1;k>=0;k--){
      const m=msgs[k];m.life-=.009;m.y-=.12;
      if(m.life<=0){msgs.splice(k,1);continue;}
      pill(m.x,m.y,m.t,'700 '+(10.5*S)+'px "JetBrains Mono",monospace','rgba(10,15,30,.92)','rgba('+m.c+',.8)','rgb('+m.c+')',Math.min(1,m.life*2));
    }
    /* étincelles */
    for(let k=sparks.length-1;k>=0;k--){
      const s=sparks[k];s.x+=s.vx;s.y+=s.vy;s.vy+=.05;s.life-=.025;
      if(s.life<=0){sparks.splice(k,1);continue;}
      cx.fillStyle='rgba('+s.c+','+s.life+')';cx.beginPath();cx.arc(s.x,s.y,2.4*s.life,0,6.283);cx.fill();
    }
  }

  /* clic sur un appareil : il envoie un paquet ; clic ailleurs : pluie d'émojis */
  window.addEventListener('click',e=>{
    if(home.classList.contains('hidden')||e.target.closest('.choice'))return;
    for(let i=0;i<DEVS.length;i++){
      const p=pos(DEVS[i].id);
      if(Math.hypot(e.clientX-p.x,e.clientY-p.y)<34*S){if(packets.length<7)spawn(i,false);return;}
    }
    for(let i=0;i<10;i++){const a=rnd(0,6.28),v=rnd(1.5,4);
      courses.push({x:e.clientX,y:e.clientY,vy:-v+Math.sin(a),e:pick(COURSE),s:rnd(24,38),ph:a,sp:.02});}
    if(courses.length>40)courses.splice(0,courses.length-40);
  });

  (function loop(){if(!home.classList.contains('hidden'))draw();requestAnimationFrame(loop);})();
})();

/* Retour du COURS : d'abord au choix des classes, puis à l'accueil */
function backCours(){
  let handled = false;
  try{ handled = document.getElementById('f-cours').contentWindow.coursBack(); }catch(e){}
  if(!handled) goHome();
}
function setCoursLabel(t){
  document.getElementById('label-cours').textContent = t==='Classes' ? 'Classes' : 'Accueil';
  document.getElementById('back-cours').title = t==='Classes' ? 'Retour au choix des classes' : "Retour à l'accueil";
}
/* Retour du QUIZ : d'abord au choix du niveau, puis à l'accueil */
function backQuiz(){
  if(typeof mpLocked==='function'&&mpLocked()){mpToast('🔒 Mode surveillé : tu ne peux pas quitter le Quiz avant de l\'avoir terminé.');return;}
  if(typeof mp!=='undefined'&&mp.role==='guest'&&mp.started){
    let lk=false;
    try{lk=!!document.getElementById('f-quiz').contentWindow.eval('lockedIn&&!won&&!finished');}catch(e){}
    if(lk){goHome();return;}
  }
  let handled = false;
  try{
    const w = document.getElementById('f-quiz').contentWindow;
    if(!w.document.querySelector('.diff-screen')){ w.changeLevel(); handled = true; }
  }catch(e){}
  if(!handled) goHome();
}
function goHome(){
  document.getElementById('page-cours').classList.remove('on');
  document.getElementById('page-quiz').classList.remove('on');
  document.getElementById('home').classList.remove('hidden');
}
</script>
